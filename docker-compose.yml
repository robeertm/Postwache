services:
  postwache:
    image: ghcr.io/der Dienstbenutzer/postwache:latest
    container_name: postwache
    restart: unless-stopped
    ports:
      - "8110:8110"          # the page; open http://<host>:8110
    environment:
      - TZ=Europe/Berlin
      - POSTWACHE_TAKT=60    # seconds between runs; a container has no cron
    volumes:
      - ./data:/data         # mailbox credentials, what it learned, the log

  # ── Keeps itself up to date ────────────────────────────────────────────
  # Docker never re-pulls a running container: `image: …:latest` is a label,
  # not a subscription. Without the service below the Postwache would stay on the
  # image you first pulled, forever, and you would have to remember
  #     docker compose pull && docker compose up -d
  #
  # So it is ON by default — you should not have to do anything to get fixes.
  # What that costs, stated plainly:
  #   * it needs the Docker socket, which is effectively root on the host.
  #     Mounted READ-ONLY here, but still a privilege you are granting.
  #   * it updates on ITS schedule. Nightly at 04:00, not hourly, so a new
  #     version does not land in the middle of what you are doing.
  #   * it watches ONLY the postwache container (named at the end of the
  #     command). If you already run a Watchtower of your own, the two do not
  #     fight — they look at different containers.
  #
  # To switch it off: delete this service, or `docker compose stop watchtower`.
  # To change when it runs, put a cron line in `.env`:
  #     WATCHTOWER_SCHEDULE=0 30 3 * * *
  watchtower:
    image: ghcr.io/nicholas-fedor/watchtower:latest
    container_name: postwache-watchtower
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Europe/Berlin}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - --cleanup
      - --schedule
      - ${WATCHTOWER_SCHEDULE:-0 0 4 * * *}
      - postwache
