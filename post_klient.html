}
/* 🔴 The frame is measured, not guessed. `allow-same-origin` WITHOUT
   `allow-scripts` is the point: the parent may read the document to find its
   height, and the browser still refuses to run anything inside it. */
function briefHoehe(){
  const f = $("#brief");
  if(!f) return;
  const messen = () => {
    try{
      const d = f.contentDocument;
      if(!d || !d.body) return;
      f.style.height = Math.max(160, d.body.scrollHeight + 24) + "px";
    }catch(e){ f.style.height = "70vh"; }
  };
  messen();
  /* Images arrive after the load event; without the second look every mail with a
     picture ends up cut off at the bottom. */
  setTimeout(messen, 350);
  setTimeout(messen, 1200);
}
async function bilderLaden(){
  const m = await sende("klient_mail", {ordner:offenOrdner(), uid:S.uid, bilder:1,
                                        hell:istHell()});
  if(m && m.ok){ S.offen = m; leseMalen(); }
}
async function bilderImmer(){
  await einstellungSetzen("bilder", "immer");
  await bilderLaden();
}
async function ansichtUm(){
  const neu = S.offen.ansicht === "html" ? "text" : "html";
  const m = await sende("klient_mail", {ordner:offenOrdner(), uid:S.uid, ansicht:neu,
                                        hell:istHell(),
                                        bilder: S.offen.bilder ? 1 : 0});
  if(m && m.ok){ S.offen = m; leseMalen(); }
}
function quelleZeigen(){
  window.open("/api/klient/roh?pf=" + encodeURIComponent(S.pf) + "&ordner=" +
    encodeURIComponent(offenOrdner()) + "&uid=" + S.uid, "_blank");
}
function briefDrucken(){
  const f = $("#brief");
  try{ f.contentWindow.focus(); f.contentWindow.print(); }
  catch(e){ window.print(); }
}
</script>

<script>
/* ── Writing ───────────────────────────────────────────────────────────────── */
async function verfassen(art, uid){
  const v = await sende("klient_vorlage", {art:art, ordner:ordnerVon(uid), uid:uid || 0});
  if(!v || !v.ok) return melde((v && v.text) || txt("k.ging_nicht"), false);
  S.brief = {art:art, quelle:v.quelle || null, in_antwort_auf:v.in_antwort_auf || "",
             anhaenge:[], uebernahme:(v.anhaenge || []).map(a =>
               Object.assign({}, a, {ordner:(v.quelle || {}).ordner,
                                     uid:(v.quelle || {}).uid}))};
  $("#v_titel").textContent = txt({neu:"k.neue_mail", antwort:"k.antworten",
    antwort_alle:"k.allen", weiter:"k.weiterleiten"}[art] || "k.neue_mail");
  $("#v_absender").textContent = (S.smtp && S.smtp.server)
    ? txt("k.von") + " " + ((S.postfaecher.find(p => p.id === S.pf) || {}).adresse || "")
    : txt("k.smtp_fehlt");
  $("#v_an").value = v.an || "";
  $("#v_kopie").value = v.kopie || "";
  $("#v_blind").value = "";
  $("#v_betreff").value = v.betreff || "";
  $("#v_text").value = v.text || "";
  $("#v_kopiereihe").hidden = !v.kopie;
  $("#v_blindreihe").hidden = true;
  $("#v_stand").textContent = "";
  anhaengeMalen();
  $("#verfassenfenster").classList.add("auf");
  $("#dunkel1").classList.add("auf");
  setTimeout(() => {
    const feld = (art === "neu" || art === "weiter") ? $("#v_an") : $("#v_text");
    feld.focus();
    /* On a reply the cursor belongs BEFORE the quote, not behind it — with the
       quote below, that is position 0. */
    if(feld === $("#v_text") && S.einst.zitat !== "oben"){
      feld.setSelectionRange(0, 0);
      /* 🔴 And to the top. Setting the cursor is not the same as scrolling
         there — the first line of the quote was cut off at the upper edge. */
      feld.scrollTop = 0;
    }
  }, 70);
}
function verfassenZu(){
  const leer = !$("#v_an").value && !$("#v_betreff").value.trim() &&
               !$("#v_text").value.replace(/\s/g, "");
  if(!leer && !confirm(txt("k.verwerfen_sicher"))) return;
  $("#verfassenfenster").classList.remove("auf");
  $("#dunkel1").classList.remove("auf");
}
function kopieZeigen(){
  $("#v_kopiereihe").hidden = false;
  $("#v_blindreihe").hidden = false;
  $("#v_mehr").style.display = "none";
}
function anhaengeMalen(){
  const b = S.brief || {anhaenge:[], uebernahme:[]};
  const eigene = b.anhaenge.map((a, i) =>
    `<span class="anh"><span>📎</span><span class="nm">${esc(a.name)}</span>
      <span class="gr">${esc(gr(a.gross))}</span>
      <button class="blank kleiner" onclick="anhangWeg(${i})">✕</button></span>`);
  const alte = b.uebernahme.map((a, i) =>
    `<span class="anh" title="${esc(txt("k.aus_original"))}"><span>↪</span>
      <span class="nm">${esc(a.n)}</span><span class="gr">${esc(gr(a.b))}</span>
      <button class="blank kleiner" onclick="uebernahmeWeg(${i})">✕</button></span>`);
  $("#v_anhaenge").innerHTML = eigene.concat(alte).join("");
}
function anhangWeg(i){ S.brief.anhaenge.splice(i, 1); anhaengeMalen(); }
function uebernahmeWeg(i){ S.brief.uebernahme.splice(i, 1); anhaengeMalen(); }
function dateienNehmen(dateien){
  const grenze = (S.einst.anhang_grenze || 25) * 1024 * 1024;
  [...dateien].forEach(d => {
    const schon = S.brief.anhaenge.reduce((s, a) => s + a.gross, 0);
    if(schon + d.size > grenze) return melde(txt("k.anhang_gross",
      {mb:S.einst.anhang_grenze || 25}), false);
    const leser = new FileReader();
    leser.onload = () => {
      S.brief.anhaenge.push({name:d.name, typ:d.type || "", gross:d.size,
        b64:String(leser.result).split(",")[1] || ""});
      anhaengeMalen();
    };
    leser.readAsDataURL(d);
  });
  $("#v_datei").value = "";
}
function briefFelder(){
  const b = S.brief || {};
  return {an:$("#v_an").value, kopie:$("#v_kopie").value, blind:$("#v_blind").value,
    betreff:$("#v_betreff").value, text:$("#v_text").value,
    anhaenge:b.anhaenge || [], uebernahme:b.uebernahme || [],
    in_antwort_auf:b.in_antwort_auf || "", quelle:b.quelle || null,
    entwurf_uid:b.entwurf_uid || 0};
}
async function senden(){
  const k = $("#v_senden");
  k.disabled = true;
  $("#v_stand").innerHTML = `<span class="laedt"></span> ${esc(txt("k.sende"))}`;
  let r;
  try{ r = await sende("klient_senden", briefFelder()); }
  catch(e){ k.disabled = false; return; }
  k.disabled = false;
  $("#v_stand").textContent = "";
  melde(r.text || (r.ok ? "" : txt("k.ging_nicht")), r.ok);
  if(r.ok){
    S.brief = {anhaenge:[], uebernahme:[]};
    $("#v_an").value = $("#v_kopie").value = $("#v_blind").value = "";
    $("#v_betreff").value = $("#v_text").value = "";
    $("#verfassenfenster").classList.remove("auf");
    $("#dunkel1").classList.remove("auf");
    await allesLaden(false);
  }
}
async function entwurfSpeichern(){
  const r = await sende("klient_entwurf", briefFelder());
  melde(r.text || (r.ok ? "" : txt("k.ging_nicht")), r.ok);
}

/* ── Address book out of the watchman's memory ─────────────────────────────── */
let vorschlag_zeit = null;
function letzterTeil(wert){
  const stuecke = String(wert).split(",");
  return {vor:stuecke.slice(0, -1), frage:(stuecke[stuecke.length - 1] || "").trim()};
}
function vorschlagSuchen(el){
  clearTimeout(vorschlag_zeit);
  const kasten = $("#vorschlag_" + el.id.slice(2));
  const {frage} = letzterTeil(el.value);
  if(frage.length < 2){ kasten.classList.remove("auf"); return; }
  vorschlag_zeit = setTimeout(async () => {
    const r = await sende("klient_adressbuch", {q:frage});
    const t = (r.treffer || []);
    if(!t.length){ kasten.classList.remove("auf"); return; }
    kasten.innerHTML = t.map((x, i) =>
      `<div data-i="${i}" class="${i === 0 ? "an" : ""}"
        onclick="vorschlagNehmen('${escJs(el.id)}',${i})">
        ${esc(x.name || x.adresse)}<small>${esc(x.adresse)} · ${
        esc(txt("k.mails_n", {n:x.n}))}</small></div>`).join("");
    kasten._treffer = t;
    kasten.classList.add("auf");
  }, 180);
}
function vorschlagNehmen(feldId, i){
  const el = $("#" + feldId), kasten = $("#vorschlag_" + feldId.slice(2));
  const x = (kasten._treffer || [])[i];
  if(!x) return;
  const {vor} = letzterTeil(el.value);
  /* A name with a comma has to be quoted, otherwise the comma separates two
     recipients out of one person. */
  const name = x.name && x.name.includes(",") ? '"' + x.name.replace(/"/g, "") + '"'
                                              : x.name;
  const eintrag = name ? name + " <" + x.adresse + ">" : x.adresse;
  el.value = vor.concat([" " + eintrag]).join(",").replace(/^\s*,?\s*/, "") + ", ";
  kasten.classList.remove("auf");
  el.focus();
}
function vorschlagTaste(ev, el){
  const kasten = $("#vorschlag_" + el.id.slice(2));
  if(!kasten.classList.contains("auf")) return;
  const zeilen = [...kasten.querySelectorAll("div")];
  let i = zeilen.findIndex(z => z.classList.contains("an"));
  if(ev.key === "ArrowDown" || ev.key === "ArrowUp"){
    ev.preventDefault();
    zeilen[i] && zeilen[i].classList.remove("an");
    i = (i + (ev.key === "ArrowDown" ? 1 : zeilen.length - 1)) % zeilen.length;
    zeilen[i].classList.add("an");
  }else if(ev.key === "Enter" || ev.key === "Tab"){
    ev.preventDefault();
    vorschlagNehmen(el.id, i < 0 ? 0 : i);
  }else if(ev.key === "Escape"){
    kasten.classList.remove("auf");
  }
}
</script>

<script>
/* ── Settings ──────────────────────────────────────────────────────────────
   🔑 ONE table describes them all. Every switch here exists in the engine's
   `VORGABEN` as well, and the engine refuses anything it does not know — so a
   forgotten line here is a missing switch, never a setting that lands nowhere. */
/* 🔑 There is NO settings table here any more. It stands in `klient.py` next to
   the defaults it is built from and arrives with the state — otherwise the phone
   version and this one would each carry their own, and the second one is always
   the one missing the newest switch. */

function einstAuf(){
  einstMalen();
  $("#einstschublade").classList.add("auf");
  $("#dunkel2").classList.add("auf");
}
function einstZu(){
  $("#einstschublade").classList.remove("auf");
  $("#dunkel2").classList.remove("auf");
}
function einstMalen(){
  const e = S.einst;
  const stueck = (f) => {
    const wert = e[f.s];
    const titel = esc(txt(f.titel));
    const hilfe = txt(f.hilfe);
    const kopf = `<div class="txt"><b>${titel}</b>${
      hilfe === f.hilfe ? "" : `<span>${esc(hilfe)}</span>`}</div>`;
    if(f.art === "knebel")
      return `<div class="reihe">${kopf}
        <div class="knebel" role="switch" tabindex="0" aria-checked="${!!wert}"
          aria-label="${titel}"
          onclick="einstellungSetzen('${f.s}',${!wert})"
          onkeydown="if(event.key===' '||event.key==='Enter'){event.preventDefault();
            einstellungSetzen('${f.s}',${!wert})}"></div></div>`;
    if(f.art === "wahl")
      return `<div class="reihe">${kopf}<div class="stell"><select aria-label="${titel}"
        onchange="einstellungSetzen('${f.s}',this.value)">${
        (f.optionen || []).map(([v, k]) => `<option value="${esc(v)}"${
          String(v) === String(wert) ? " selected" : ""}>${esc(txt(k))}</option>`).join("")
        }</select></div></div>`;
    if(f.art === "zahl")
      return `<div class="reihe">${kopf}<div class="stell"
        style="display:flex;gap:.4rem;align-items:center">
        <input type="range" min="${f.tief}" max="${f.hoch}" step="${f.schritt}"
          value="${wert}" aria-label="${titel}"
          oninput="this.nextElementSibling.textContent=this.value+'${f.einheit}'"
          onchange="einstellungSetzen('${f.s}',Number(this.value))">
        <span class="kleiner zahl" style="flex:0 0 3rem">${wert}${f.einheit}</span>
        </div></div>`;
    if(f.art === "ordner")
      return `<div class="reihe">${kopf}<div class="stell"><select aria-label="${titel}"
        onchange="einstellungSetzen('${f.s}',this.value)">
        <option value="">${esc(txt("k.o_automatisch"))}</option>${
        S.ordner_liste.filter(o => o.waehlbar).map(o =>
          `<option value="${esc(o.name)}"${o.name === wert ? " selected" : ""}>${
          esc(o.pfad)}</option>`).join("")}</select></div></div>`;
    if(f.mehrzeilig)
      return `<div style="padding:.5rem 0;border-top:1px solid var(--rand)">
        <label>${titel}</label><textarea rows="4"
          onchange="einstellungSetzen('${f.s}',this.value)"
          >${esc(wert || "")}</textarea></div>`;
    return `<div class="reihe">${kopf}<div class="stell"><input value="${esc(wert || "")}"
      aria-label="${titel}" onchange="einstellungSetzen('${f.s}',this.value)"></div></div>`;
  };
  const gruppen = (S.oberflaeche || []).map(g =>
    `<div class="gruppe"><h3>${esc(txt(g.titel))}</h3>
      <div class="klein leise">${esc(txt(g.hilfe))}</div>
      ${(g.felder || []).map(stueck).join("")}</div>`);

  /* The sending route and the access word — the two things that are not a view. */
  const s = S.smtp || {};
  gruppen.push(`<div class="gruppe"><h3>${esc(txt("k.g_senden"))}</h3>
    <div class="klein leise">${esc(txt("k.g_senden_hilfe"))}</div>
    <div class="feldpaar" style="margin-top:.5rem">
      <div style="flex:2 1 12rem"><label>${esc(txt("k.smtp_server"))}</label>
        <input id="s_server" value="${esc(s.server || "")}"
          placeholder="${esc(s.geraten ? txt("k.geraten") : "")}"></div>
      <div style="flex:0 0 6rem"><label>${esc(txt("k.smtp_port"))}</label>
        <input id="s_port" class="zahl" value="${esc(s.port || 587)}"></div>
      <div><label>${esc(txt("k.smtp_art"))}</label><select id="s_art">
        <option value="starttls"${s.art === "starttls" ? " selected" : ""}>STARTTLS</option>
        <option value="ssl"${s.art === "ssl" ? " selected" : ""}>SSL/TLS</option>
        <option value="klar"${s.art === "klar" ? " selected" : ""}>${
          esc(txt("k.o_klar"))}</option></select></div>
    </div>
    <div class="feldpaar" style="margin-top:.5rem">
      <div><label>${esc(txt("k.smtp_benutzer"))}</label>
        <input id="s_benutzer" value="${esc(s.benutzer || "")}"></div>
      <div><label>${esc(txt("k.smtp_passwort"))}</label>
        <input id="s_passwort" type="password" autocomplete="new-password"
          placeholder="${esc(s.passwort_da ? txt("k.unveraendert") : txt("k.wie_imap"))}"></div>
      <div><label>${esc(txt("k.absender_name"))}</label>
        <input id="s_name" value="${esc(s.absender_name || "")}"></div>
    </div>
    <div style="display:flex;gap:.5rem;margin-top:.6rem;flex-wrap:wrap">
      <button class="haupt" onclick="smtpSpeichern()">${esc(txt("k.speichern"))}</button>
      <button onclick="smtpPruefen()">${esc(txt("k.verbindung_pruefen"))}</button>
      <span class="kleiner leise" id="s_stand" style="align-self:center"></span>
    </div></div>`);

  gruppen.push(`<div class="gruppe"><h3>${esc(txt("k.g_zugang"))}</h3>
    <div class="klein leise">${esc(txt("k.g_zugang_hilfe"))}</div>
    <div class="feldpaar" style="margin-top:.5rem">
      <div><label>${esc(txt("k.wort_alt"))}</label>
        <input id="w_alt" type="password" autocomplete="current-password"></div>
      <div><label>${esc(txt("k.wort_neu"))}</label>
        <input id="w_neu" type="password" autocomplete="new-password"></div>
    </div>
    <div style="display:flex;gap:.5rem;margin-top:.6rem;flex-wrap:wrap">
      <button onclick="wortAendern()">${esc(txt("k.wort_aendern"))}</button>
      <button onclick="abmelden()">🔒 ${esc(txt("k.abmelden"))}</button>
    </div></div>`);
  /* The way to the phone version — and it stays there, the server remembers the
     choice. Useful on a laptop too: it is the quickest way to see what the page
     looks like on a phone. */
  gruppen.push(`<div class="gruppe"><h3>${esc(txt("k.ansicht"))}</h3>
    <div class="klein leise">${esc(txt("k.ansicht_hilfe"))}</div>
    <div style="display:flex;gap:.5rem;flex-wrap:wrap;padding:.6rem 0">
      <button onclick="location.href='/post?ansicht=mobil'">📱 ${
        esc(txt("k.handy_ansicht"))}</button>
      <button onclick="location.href='/?wache=1'">🛡️ ${esc(txt("k.zum_waechter"))}</button>
    </div></div>`);
  gruppen.push(`<div class="klein leise" style="text-align:center;padding:.4rem 0 1.5rem">
    Postwache ${esc(S.version)}</div>`);
  $("#einstleib").innerHTML = gruppen.join("");
}
async function einstellungSetzen(schluessel, wert){
  const r = await sende("klient_einstellung", {werte:{[schluessel]:wert}});
  if(!r.ok) return melde(r.text || txt("k.ging_nicht"), false);
  S.einst = r.einst || S.einst;
  einstAnwenden();
  /* A setting that changes the LIST has to be visible immediately — otherwise it
     looks as if it did not take. */
  if(["dichte","absender_zeigen","vorschautext","strang"].includes(schluessel))
    listeMalen();
  if(["neu_zeitraum","neu_spam"].includes(schluessel)){
    ordnerMalen();
    if(S.neu) await ladeListe(true);
  }
  if(["pro_seite","sortierung","richtung","nur_ungelesen"].includes(schluessel)){
    S.sortierung = S.einst.sortierung; S.richtung = S.einst.richtung;
    S.pro = S.einst.pro_seite; S.seite = 1;
    einstAnwenden(); await ladeListe(true);
  }
  if(["bilder","html_zuerst","wache_grund","kopfzeilen"].includes(schluessel) && S.uid)
    await mailOeffnen(S.uid);
  if($("#einstschublade").classList.contains("auf")) einstMalen();
}
async function smtpSpeichern(){
  const r = await sende("klient_smtp", {server:$("#s_server").value,
    port:$("#s_port").value, art:$("#s_art").value, benutzer:$("#s_benutzer").value,
    passwort:$("#s_passwort").value, absender_name:$("#s_name").value});
  melde(r.text, r.ok);
  if(r.ok){ S.smtp = r.smtp || S.smtp; $("#s_passwort").value = ""; einstMalen(); }
}
async function smtpPruefen(){
  $("#s_stand").innerHTML = `<span class="laedt"></span>`;
  const r = await sende("klient_smtp_pruefen", {});
  $("#s_stand").textContent = r.text || "";
  melde(r.text, r.ok);
}
async function wortAendern(){
  const neu = $("#w_neu").value;
  if(neu.length < 8) return melde(txt("k.wort_kurz"), false);
  const r = await sende("klient_wort", {neu:neu, alt:$("#w_alt").value});
  melde(r.text, r.ok);
  if(r.ok){ $("#w_alt").value = $("#w_neu").value = ""; torZeigen({wort:true, an:false}); }
}

/* ── Keyboard ──────────────────────────────────────────────────────────────── */
const TASTEN = [
  ["j", "k.t_runter"], ["k", "k.t_rauf"], ["Enter", "k.t_oeffnen"],
  ["u", "k.t_ungelesen"], ["f", "k.t_stern"], ["e", "k.t_archiv"],
  ["#", "k.t_loeschen"], ["r", "k.t_antwort"], ["a", "k.t_allen"],
  ["w", "k.t_weiter"], ["c", "k.t_neu"], ["/", "k.t_suche"],
  ["g", "k.t_posteingang"], ["n", "k.t_neu_ansicht"], ["x", "k.t_waehlen"],
  ["Esc", "k.t_zu"], ["?", "k.t_hilfe"],
];
function hilfeAuf(){
  $("#tastenliste").innerHTML = TASTEN.map(([t, k]) =>
    `<div><kbd>${esc(t)}</kbd><span>${esc(txt(k))}</span></div>`).join("");
  $("#hilfefenster").classList.add("auf");
  $("#dunkel3").classList.add("auf");
}
function hilfeZu(){
  $("#hilfefenster").classList.remove("auf");
  $("#dunkel3").classList.remove("auf");
}
function offeneFenster(){
  return $$(".fenster.auf, .schublade.auf").length > 0;
}
document.addEventListener("keydown", (ev) => {
  const feld = /^(INPUT|TEXTAREA|SELECT)$/.test((ev.target.tagName || ""));
  if(ev.key === "Escape"){
    if(offeneFenster()){ verfassenZu(); einstZu(); hilfeZu(); }
    else if(feld) ev.target.blur();
    else if(S.gewaehlt.size){ S.gewaehlt.clear(); listeMalen(); }
    else blick("liste");
    return;
  }
  if(feld || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  if(!S.einst.tasten || $("#tor").classList.contains("auf")) return;
  if(offeneFenster()) return;
  const i = S.mails.findIndex(m => m.uid === S.uid);
  const gehe = (d) => {
    const n = S.mails[Math.max(0, Math.min(S.mails.length - 1, (i < 0 ? -1 : i) + d))];
    if(n) mailOeffnen(n.uid, n.ordner);
  };
  switch(ev.key){
    case "j": case "ArrowDown": ev.preventDefault(); gehe(1); break;
    case "k": case "ArrowUp": ev.preventDefault(); gehe(-1); break;
    case "Enter": if(S.uid) mailOeffnen(S.uid); break;
    case "u": if(S.uid) stapel("gelesen", !(S.offen || {}).gelesen, [S.uid]); break;
    case "f": if(S.uid) stapel("markiert", !(S.offen || {}).markiert, [S.uid]); break;
    case "e": if(S.uid && S.rollen.archiv) stapelVerschieben(S.rollen.archiv, [S.uid]); break;
    case "#": case "Delete": if(S.uid) stapelLoeschen([S.uid]); break;
    case "r": if(S.uid) verfassen("antwort", S.uid); break;
    case "a": if(S.uid) verfassen("antwort_alle", S.uid); break;
    case "w": if(S.uid) verfassen("weiter", S.uid); break;
    case "c": verfassen("neu"); break;
    case "x": if(S.uid) wahlUm(S.uid, i, false); break;
    case "g": if(S.rollen.posteingang) ordnerWaehlen(S.rollen.posteingang); break;
    case "n": neuWaehlen(); break;
    case "/": ev.preventDefault(); $("#suche").focus(); break;
    case "?": hilfeAuf(); break;
  }
});

/* ── Start ─────────────────────────────────────────────────────────────────── */
textenSetzen(document);
lichtAnwenden(false);           /* the button needs its sign and its word */
leseLeeren();
allesLaden(true);
/* ── The listening post ─────────────────────────────────────────────────────
   🔑 New mail has to show up BY ITSELF — and it does not do that by asking every
   minute, it does it by LISTENING. The page leaves one request waiting; the
   server answers it the moment the provider says a word (IMAP IDLE). Twenty
   seconds per wait, and the same loop is the fallback: if the listening post
   cannot be reached, it asks again after a pause. ONE place decides how often. */
const HORCH = {stand:0, marken:{}};
function schlafen(ms){ return new Promise(r => setTimeout(r, ms)); }
function angemeldet(){ return !$("#tor").classList.contains("auf"); }
function horchOrte(){
  const orte = ["INBOX"];
  for(const o of [S.rollen.posteingang, S.ordner])
    if(o && orte.indexOf(o) < 0) orte.push(o);
  return orte;
}
async function horchSchleife(){
  while(true){
    /* A tab nobody is looking at asks for nothing: the listening post drops its
       connection at the provider after a minute and a half, and coming back
       refreshes at once — see the `visibilitychange` below. */
    if(document.hidden || !angemeldet()){ await schlafen(1500); continue; }
    let a = null;
    try{
      a = await sende("klient_horch", {ordner:horchOrte(), stand:HORCH.stand, warte:20});
    }catch(e){ a = null; }
    if(!a || a.ok === false){ await schlafen(20000); await nachziehen(false); continue; }
    const vorher = HORCH.marken;
    HORCH.marken = a.marken || {};
    HORCH.stand = a.stand || 0;
    /* 🔴 The FIRST answer has no „before" to compare against. Keeping it and
       doing nothing is the whole point — otherwise every page load would refetch
       the list it has just drawn. */
    if(!Object.keys(vorher).length) continue;
    let etwas = false, neuePost = false;
    for(const ort in HORCH.marken){
      const v = vorher[ort], n = HORCH.marken[ort];
      if(!v) continue;
      if(v.join() !== n.join()) etwas = true;
      if(n[2] > v[2]) neuePost = true;      // UIDNEXT only grows when post ARRIVES
    }
    if(etwas) await nachziehen(neuePost);
  }
}
/* 🔴 Never redraw the list under somebody's hands: a selection, an open window, a
   focused field, a search, a page other than the first — each of them blocks it.
   The folder NUMBERS are updated anyway; a counter steals nobody's click. */
async function nachziehen(neuePost){
  if(S.laeuft || !angemeldet()) return;
  try{
    const l = await sende("klient_ordner", {frisch:true});
    if(!l.ok) return;
    const vorher = (S.ordner_liste.find(o => o.name === S.ordner) || {}).gesamt;
    S.ordner_liste = l.ordner || S.ordner_liste;
    ordnerMalen();
    const jetzt = (S.ordner_liste.find(o => o.name === S.ordner) || {}).gesamt;
    if(offeneFenster() || S.gewaehlt.size || S.suche) return;
    if(/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName || "")) return;
    if(!S.neu && S.seite !== 1) return;
    if(S.neu || neuePost || jetzt !== vorher) await ladeListe(false);
  }catch(e){ /* the next round tries again */ }
}
/* Coming back to the tab is a question, and it deserves an answer right away. */
document.addEventListener("visibilitychange", () => {
  if(!document.hidden && angemeldet()) nachziehen(false);
});
$("#ordner").addEventListener("dragover", ziehRollen);
$("#ordner").addEventListener("dragleave", ziehRollenAus);
horchSchleife();
</script>
