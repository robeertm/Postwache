<!-- ── Settings ─────────────────────────────────────────────────────────── -->
<div class="dunkel" id="dunkel2" onclick="einstZu()"></div>
<div class="schublade" id="einstschublade">
  <div class="fkopf">
    <h2 data-t="k.einstellungen"></h2>
    <button class="blank" onclick="einstZu()">✕</button>
  </div>
  <div class="fleib" id="einstleib"></div>
</div>

<!-- ── Keyboard help ────────────────────────────────────────────────────── -->
<div class="dunkel" id="dunkel3" onclick="hilfeZu()"></div>
<div class="fenster" id="hilfefenster" style="width:min(40rem,94vw)">
  <div class="fkopf"><h2 data-t="k.tastenhilfe"></h2>
    <button class="blank" onclick="hilfeZu()">✕</button></div>
  <div class="fleib"><div class="tastenliste" id="tastenliste"></div></div>
</div>

<div class="melde" id="melde"></div>

<script>
/*SPRACHE*/
/* Same fallback as on the watchman page, for the same reason: `var T` would
   collide with the substituted `const T` and that is a PARSE error — the page
   then looks almost normal and not one button works. */
if (typeof T === "undefined") {
  globalThis.T = {};
  globalThis.LANG = "de";
  globalThis.SPRACHEN = [["de", "Deutsch"]];
}
function txt(schluessel, werte){
  let s = T[schluessel];
  if(s === undefined) return schluessel;
  if(werte) for(const k in werte) s = s.split("{" + k + "}").join(werte[k]);
  return s;
}
function textenSetzen(wurzel){
  (wurzel || document).querySelectorAll("[data-t]").forEach(el => {
    el.textContent = txt(el.dataset.t); });
  (wurzel || document).querySelectorAll("[data-t-titel]").forEach(el => {
    el.title = txt(el.dataset.tTitel); });
  (wurzel || document).querySelectorAll("[data-t-platzhalter]").forEach(el => {
    el.placeholder = txt(el.dataset.tPlatzhalter); });
  (wurzel || document).querySelectorAll("[data-t-html]").forEach(el => {
    el.innerHTML = txt(el.dataset.tHtml); });
  (wurzel || document).querySelectorAll("[data-t-aria]").forEach(el => {
    el.setAttribute("aria-label", txt(el.dataset.tAria)); });
}
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
function esc(s){ return String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

/* ── State ─────────────────────────────────────────────────────────────────
   One object. Every drawing function reads from here and nowhere else — with the
   state spread over the DOM, the list and the reading pane drift apart, and it
   shows up as „the wrong mail opened". */
const S = {
  pf:"", ordner:"INBOX", seite:1, sieb:"", suche:"", feld:"alle",
  sortierung:"datum", richtung:"ab", pro:50,
  mails:[], uid:0, offen:null, gewaehlt:new Set(),
  ordner_liste:[], rollen:{}, einst:{}, faehig:{}, postfaecher:[],
  zu:new Set(),            // collapsed folder branches
  oberflaeche:[],          // how the settings are described — comes from the engine
  lesemarke:null,          // the timer for „mark read after N seconds"
  laeuft:false, version:""
};

function melde(text, gut){
  const m = $("#melde");
  m.textContent = text;
  m.className = "melde auf" + (gut === false ? " schlecht" : (gut ? " gut" : ""));
  clearTimeout(m._t);
  m._t = setTimeout(() => m.className = "melde", 5000);
}

async function sende(aktion, daten){
  const r = await fetch("/api/" + aktion, {method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify(Object.assign({pf: S.pf}, daten || {}))});
  const a = await r.json().catch(() => ({ok:false, text:"HTTP " + r.status}));
  /* 🔴 A session can expire while the page is open. Then EVERY answer says
     „locked" — and the page has to go back to the door instead of drawing empty
     lists and letting the reader think the mailbox is empty. */
  if(a && a.gesperrt){ torZeigen({wort:true, an:false}); throw new Error("gesperrt"); }
  return a;
}

/* ── Small dressing ──────────────────────────────────────────────────────── */
function initialen(name, adresse){
  const s = (name || adresse || "?").trim();
  const teile = s.replace(/[<>"]/g,"").split(/[\s.@_-]+/).filter(Boolean);
  if(!teile.length) return "?";
  if(teile.length === 1) return teile[0].slice(0,2).toUpperCase();
  return (teile[0][0] + teile[1][0]).toUpperCase();
}
/* The colour follows the ADDRESS, so the same sender always has the same one —
   after two days you recognise the circle before you have read the name. */
function farbe(adresse){
  let h = 0;
  const s = String(adresse || "");
  for(let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360;
  return "hsl(" + h + " 52% 63%)";
}
function gr(b){
  b = Number(b || 0);
  if(b >= 1048576) return (b/1048576).toFixed(1).replace(".0","") + " MB";
  if(b >= 1024) return Math.round(b/1024) + " kB";
  return b + " B";
}
/* „14:32" for today, „gestern 09:14", „Mo. 12:04" this week, otherwise the date.
   A column full of identical dates says nothing; this one says how old it is. */
function wann(iso){
  if(!iso) return "";
  const d = new Date(iso);
  if(isNaN(d)) return String(iso).slice(0,10);
  const jetzt = new Date();
  const tag = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  /* 🔴 The setting decides, not the language. With LANG „en" the locale default
     is 12 hours — and whoever set „24 hours" watched it be ignored. Seen in the
     screenshot: „09:44 AM" on a page set to 24. */
  const uhrform = {hour:"2-digit", minute:"2-digit"};
  if(S.einst && S.einst.zeitform) uhrform.hour12 = (S.einst.zeitform === "12");
  const uhr = d.toLocaleTimeString(LANG, uhrform);
  const tage = Math.round((tag(jetzt) - tag(d)) / 86400000);
  if(tage === 0) return uhr;
  if(tage === 1) return txt("k.gestern") + " " + uhr;
  if(tage < 7) return d.toLocaleDateString(LANG, {weekday:"short"}) + " " + uhr;
  if(d.getFullYear() === jetzt.getFullYear())
    return d.toLocaleDateString(LANG, {day:"2-digit", month:"2-digit"});
  return d.toLocaleDateString(LANG, {day:"2-digit", month:"2-digit", year:"numeric"});
}
function langesDatum(iso){
  if(!iso) return "";
  const d = new Date(iso);
  if(isNaN(d)) return String(iso);
  const form = {weekday:"short", day:"2-digit", month:"short", year:"numeric",
                hour:"2-digit", minute:"2-digit"};
  if(S.einst && S.einst.zeitform) form.hour12 = (S.einst.zeitform === "12");
  return d.toLocaleString(LANG, form);
}
function blick(was){ document.body.dataset.blick = was; }

/* ── The door ──────────────────────────────────────────────────────────────
   🔴 The page starts CLOSED. Not „open and then check": between drawing and the
   answer lies exactly the moment in which an inbox stands on the screen for
   anyone. */
function torZeigen(schloss){
  $("#tor").classList.add("auf");
  $("#app").hidden = true;
  const kein = !schloss.wort;
  $("#tor_neu").hidden = !kein;
  $("#tor_an").hidden = kein;
  /* 🔴 Both keys SPELLED OUT, never a condition INSIDE the call. To find German
     sentences, the language test bench cuts the literal key out of a translation
     call — written the other way round it sees a bare call and reads the two keys
     as prose. The same note stands in `post_web.py`; it holds for every page.
     (And this comment may not contain such a call either: section 3 reads the
     page as it is and would look the key up. Found exactly that way.) */
  $("#tor_text").textContent = kein ? txt("k.tor_kein_wort") : txt("k.tor_text");
  $("#tor_fuss").textContent = kein ? txt("k.tor_fuss_neu") : txt("k.tor_fuss");
  setTimeout(() => (kein ? $("#tor_wort1") : $("#tor_wort")).focus(), 60);
}
function torWeg(){
  $("#tor").classList.remove("auf");
  $("#app").hidden = false;
}
async function wortSetzen(){
  const a = $("#tor_wort1").value, b = $("#tor_wort2").value;
  if(a.length < 8) return melde(txt("k.wort_kurz"), false);
  if(a !== b) return melde(txt("k.wort_ungleich"), false);
  const r = await sende("klient_wort", {neu:a});
  melde(r.text, r.ok);
  if(r.ok){ $("#tor_wort1").value = $("#tor_wort2").value = ""; torZeigen({wort:true}); }
}
async function anmelden(){
  const wort = $("#tor_wort").value;
  if(!wort) return;
  const r = await sende("klient_anmelden", {wort:wort});
  if(!r.ok) return melde(r.text, false);
  $("#tor_wort").value = "";
  torWeg();
  await allesLaden(true);
  /* Came here from the locked watchman page? Then that is where we go back to. */
  const zurueck = new URLSearchParams(location.search).get("zurueck");
  if(zurueck) location.href = zurueck;
}
async function abmelden(){
  const r = await sende("klient_abmelden", {});
  melde(r.text, true);
  torZeigen({wort:true, an:false});
}

/* ── Loading ───────────────────────────────────────────────────────────────── */
async function allesLaden(frisch){
  if(S.laeuft) return;
  S.laeuft = true;
  try{
    const l = await sende("klient_lage", {});
    if(!l.schloss || !l.schloss.an){ torZeigen(l.schloss || {wort:false}); return; }
    torWeg();
    if(l.ok === false && l.text) melde(l.text, false);
    S.einst = l.einst || {};
    S.oberflaeche = l.oberflaeche || S.oberflaeche || [];
    S.ordner_liste = l.ordner || [];
    S.rollen = l.rollen || {};
    S.faehig = l.faehig || {};
    S.postfaecher = l.postfaecher || [];
    S.pf = l.pf || S.pf;
    S.version = l.version || "";
    S.smtp = l.smtp || {};
    einstAnwenden();
    if(!S.ordner || !S.ordner_liste.some(o => o.name === S.ordner))
      S.ordner = S.rollen.posteingang || (S.ordner_liste[0] || {}).name || "INBOX";
    $("#pfname").textContent = l.adresse || "";
    const wahl = $("#pfwahl");
    wahl.hidden = S.postfaecher.length < 2;
    wahl.innerHTML = S.postfaecher.map(p =>
      `<option value="${esc(p.id)}"${p.id === S.pf ? " selected" : ""}>${esc(p.name)}</option>`).join("");
    ordnerMalen();
    await ladeListe(frisch);
  }catch(e){
    if(String(e.message) !== "gesperrt") melde(txt("k.keine_verbindung"), false);
  }finally{ S.laeuft = false; }
}

/* Settings that change the LOOK are applied to the frame, not to every row —
   one attribute on the body, and the CSS does the rest. */
function einstAnwenden(){
  const e = S.einst;
  document.body.dataset.dichte = e.dichte || "bequem";
  $("#raum").dataset.vorschau = e.vorschau || "rechts";
  document.documentElement.style.setProperty("--schrift", (e.schrift || 100) + "%");
  S.pro = e.pro_seite || 50;
  if(!S.sieb && e.nur_ungelesen) S.sieb = "ungelesen";
  S.sortierung = S.sortierung || e.sortierung;
  S.richtung = S.richtung || e.richtung;
  $("#sieb").value = S.sieb;
  $("#sortierung").value = S.sortierung;
  $("#sortierung").disabled = !S.faehig.sort && S.sortierung === "datum";
  $("#richtung").textContent = S.richtung === "ab" ? "↓" : "↑";
}

/* ── Folder tree ───────────────────────────────────────────────────────────── */
function ordnerMalen(){
  const liste = S.ordner_liste;
  const teile = [];
  const sonder = liste.filter(o => o.rolle);
  const rest = liste.filter(o => !o.rolle);
  const zeile = (o) => {
    const eltern = elternWeg(o);
    if(eltern.some(p => S.zu.has(p))) return "";
    const kinder = rest.some(x => x !== o && x.pfad.startsWith(o.pfad + "/") ||
                                  x.name.startsWith(o.name + (S.faehig.trenner || ".")));
    const falt = kinder
      ? `<span class="ofalt ${S.zu.has(o.name) ? "zu" : ""}"
             onclick="faltenUm(event,'${escJs(o.name)}')">▾</span>` : "";
    return `<div class="o ${o.name === S.ordner ? "an" : ""}" tabindex="0"
        style="padding-left:${.55 + o.tiefe * .85}rem"
        onclick="ordnerWaehlen('${escJs(o.name)}')"
        onkeydown="if(event.key==='Enter')ordnerWaehlen('${escJs(o.name)}')"
        title="${esc(o.pfad)} — ${o.gesamt} ${esc(txt("k.mails"))}">
      ${falt}<span class="ic">${o.icon || "📁"}</span>
      <span class="nm">${esc(ordnerName(o))}</span>
      ${o.ungelesen ? `<span class="u">${o.ungelesen}</span>`
                    : `<span class="n">${o.gesamt || ""}</span>`}
    </div>`;
  };
  teile.push(`<div class="obaum">${sonder.map(zeile).join("")}</div>`);
  if(rest.length){
    teile.push(`<div class="ogruppe">${esc(txt("k.eigene_ordner"))}</div>`);
    teile.push(`<div class="obaum">${rest.map(zeile).join("")}</div>`);
  }
  teile.push(`<div style="padding:.7rem .55rem 0">
    <button class="blank kleiner" onclick="ordnerNeu()">＋ ${esc(txt("k.ordner_neu"))}</button>
  </div>`);
  $("#ordner").innerHTML = teile.join("");
  const ziel = $("#stapel_ziel");
  ziel.innerHTML = `<option value="">${esc(txt("k.verschieben_nach"))}</option>` +
    liste.filter(o => o.waehlbar).map(o =>
      `<option value="${esc(o.name)}">${"·".repeat(o.tiefe)} ${esc(o.zeige)}</option>`).join("");
}
/* 🔴 „INBOX" is a word from the protocol, not a name a person gave a folder.
   Every other folder is called what the server calls it — that IS the truth, and
   a German mailbox really does have „Gesendet". Only this one is translated. */
function ordnerName(o){
  return (o.name.toUpperCase() === "INBOX") ? txt("k.posteingang") : o.zeige;
}
function elternWeg(o){
  const tr = S.faehig.trenner || ".";
  const teile = o.name.split(tr);
  return teile.slice(0, -1).map((_, i) => teile.slice(0, i + 1).join(tr));
}
function escJs(s){ return String(s).replace(/\\/g,"\\\\").replace(/'/g,"\\'"); }
function faltenUm(ev, name){
  ev.stopPropagation();
  S.zu.has(name) ? S.zu.delete(name) : S.zu.add(name);
  ordnerMalen();
}
async function ordnerWaehlen(name){
  S.ordner = name; S.seite = 1; S.gewaehlt.clear(); S.uid = 0; S.offen = null;
  leseLeeren();
  ordnerMalen();
  blick("liste");
  await ladeListe(false);
}
async function ordnerNeu(){
  const name = prompt(txt("k.ordner_name"));
  if(!name) return;
  const r = await sende("klient_ordner_neu", {name:name});
  melde(r.text || (r.ok ? "" : txt("k.ging_nicht")), r.ok);
  if(r.ok) await allesLaden(true);
}
async function postfachWechseln(id){
  S.pf = id; S.ordner = ""; S.seite = 1; S.uid = 0; S.offen = null;
  S.gewaehlt.clear(); leseLeeren();
  await allesLaden(true);
}
</script>

<script>
/* ── The list ──────────────────────────────────────────────────────────────── */
async function ladeListe(frisch){
  const r = $("#rollen");
  const stand = r.scrollTop;
  if(!S.mails.length) $("#zeilen").innerHTML = ladebalken(8);
  let a;
  try{
    a = await sende("klient_liste", {ordner:S.ordner, seite:S.seite, sieb:S.sieb,
      suche:S.suche, feld:S.feld, sortierung:S.sortierung, richtung:S.richtung,
      pro_seite:S.pro});
  }catch(e){ return; }
  if(!a || a.ok === false){ melde((a && a.text) || txt("k.ging_nicht"), false); return; }
  S.mails = a.mails || [];
  S.seite = a.seite || 1;
  S.seiten = a.seiten || 1;
  S.gesamt = a.gesamt || 0;
  S.sortiert = a.sortiert !== false;
  listeMalen();
  if(frisch) r.scrollTop = 0; else r.scrollTop = stand;
  ordnerZahlAktualisieren(a.ordner_gesamt, a.ordner_ungelesen);
}
function ladebalken(n){
  return Array.from({length:n}, () => `<div class="z" style="pointer-events:none">
    <span></span><span class="kreis" style="background:var(--karte2)"></span>
    <div class="kopfz" style="display:block">
      <div style="height:.7rem;width:8rem;background:var(--karte2);border-radius:4px"></div>
      <div style="height:.6rem;width:14rem;background:var(--karte);border-radius:4px;
                  margin-top:.35rem"></div></div><span></span></div>`).join("");
}
function ordnerZahlAktualisieren(gesamt, ungelesen){
  const o = S.ordner_liste.find(x => x.name === S.ordner);
  if(!o) return;
  if(typeof gesamt === "number") o.gesamt = gesamt;
  if(typeof ungelesen === "number") o.ungelesen = ungelesen;
  ordnerMalen();
}

function listeMalen(){
  const z = $("#zeilen"), leer = $("#listeleer");
  if(!S.mails.length){
    z.innerHTML = "";
    leer.hidden = false;
    leer.innerHTML = `<div><span class="gross">${S.suche ? "🔍" : "📭"}</span>
      ${esc(txt(S.suche ? "k.nichts_gefunden" : (S.sieb ? "k.nichts_im_sieb" : "k.ordner_leer")))}</div>`;
    spanneMalen();
    return;
  }
  leer.hidden = true;
  const eng = (S.einst.dichte === "eng");
  let vorher = "";
  z.innerHTML = S.mails.map((m, i) => {
    const gleich = S.einst.strang && m.strang && m.strang === vorher;
    vorher = m.strang || "";
    const gewaehlt = S.gewaehlt.has(m.uid);
    const wer = S.einst.absender_zeigen === "adresse" ? m.adresse
              : S.einst.absender_zeigen === "beides"
                ? (m.von || "") + " · " + (m.adresse || "") : (m.von || m.adresse);
    const dritte = zweitzeile(m);
    const zeichen = [
      m.markiert ? '<span class="stern">★</span>' : "",
      m.beantwortet ? "<span>↩</span>" : "",
      m.anhang ? '<span title="' + esc(txt("k.anhang")) + '">📎</span>' : "",
      m.abmelden ? '<span title="' + esc(txt("k.newsletter")) + '">📰</span>' : "",
      !m.gelesen ? '<span class="punkt"></span>' : ""
    ].filter(Boolean).join("");
    return `<div class="z ${m.gelesen ? "" : "neu"} ${m.uid === S.uid ? "an" : ""}
        ${gewaehlt ? "gewaehlt" : ""} ${m.geloescht ? "weg" : ""} ${gleich ? "antwort" : ""}"
        data-uid="${m.uid}" data-i="${i}" tabindex="0"
        onclick="zeileKlick(event,${m.uid},${i})"
        onkeydown="if(event.key==='Enter')mailOeffnen(${m.uid})">
      <input type="checkbox" class="haken" ${gewaehlt ? "checked" : ""}
             onclick="event.stopPropagation();wahlUm(${m.uid},${i},event.shiftKey)">
      <span class="kreis" style="background:${farbe(m.adresse)}"
            >${esc(initialen(m.von, m.adresse))}</span>
      <span class="von" title="${esc(m.adresse)}">${esc(wer)}</span>
      <span class="wann">${esc(wann(m.zeit))}</span>
      <span class="bet">${esc(m.betreff || txt("k.ohne_betreff"))}</span>
      <span class="zeichen">${zeichen}</span>
      ${(!eng && S.einst.vorschautext && dritte) ? `<span class="aus">${
        esc(dritte)}</span>` : ""}
    </div>`;
  }).join("");
  spanneMalen();
  wahlLeisteMalen();
}
/* The third line of a row: the first words of the letter itself. That is what
   makes a list worth reading — sender and subject tell you who and about what,
   the excerpt tells you whether it can wait.

   🔴 Where there is none — a mail that is only an attachment, or a folder whose
   excerpts were not asked for — the row says what else is worth knowing instead
   of leaving a gap. And „To der Besitzer Marlow" under every row of the INBOX is not
   it: of course it is to me. In the sent folder the recipient is the opposite,
   the only interesting name. */
function zweitzeile(m){
  if(m.auszug) return m.auszug;
  const raus = [];
  const gesendet = [S.rollen.gesendet, S.rollen.entwuerfe].includes(S.ordner);
  if(gesendet && m.an) raus.push(txt("k.an") + ": " + m.an);
  else if(m.adresse) raus.push(m.adresse);
  if(m.groesse) raus.push(gr(m.groesse));
  return raus.join(" · ");
}
function spanneMalen(){
  const von = S.gesamt ? (S.seite - 1) * S.pro + 1 : 0;
  const bis = Math.min(S.gesamt, S.seite * S.pro);
  $("#spanne").textContent = S.gesamt
    ? txt("k.spanne", {von:von, bis:bis, n:S.gesamt.toLocaleString(LANG)}) : "";
  $("#zurueck").disabled = S.seite <= 1;
  $("#weiter").disabled = S.seite >= (S.seiten || 1);
}
async function blaettern(d){
  S.seite = Math.max(1, Math.min(S.seiten || 1, S.seite + d));
  S.gewaehlt.clear();
  await ladeListe(true);
}

/* ── Selection ─────────────────────────────────────────────────────────────
   🔴 A click on the row OPENS, a click on the box SELECTS. Two intentions on one
   row, and mixing them up means the reader marks a mail as read while trying to
   tick it. */
function zeileKlick(ev, uid, i){
  if(ev.metaKey || ev.ctrlKey){ wahlUm(uid, i, false); return; }
  if(ev.shiftKey){ wahlUm(uid, i, true); return; }
  mailOeffnen(uid);
}
function wahlUm(uid, i, bereich){
  if(bereich && S.letzteWahl != null){
    const [a, b] = [Math.min(S.letzteWahl, i), Math.max(S.letzteWahl, i)];
    for(let k = a; k <= b; k++) S.gewaehlt.add(S.mails[k].uid);
  }else{
    S.gewaehlt.has(uid) ? S.gewaehlt.delete(uid) : S.gewaehlt.add(uid);
    S.letzteWahl = i;
  }
  listeMalen();
}
function alleWaehlen(an){
  S.gewaehlt.clear();
  if(an) S.mails.forEach(m => S.gewaehlt.add(m.uid));
  listeMalen();
}
function wahlLeisteMalen(){
  const n = S.gewaehlt.size;
  $("#wahltasten").style.display = n ? "flex" : "none";
  $("#siebtasten").style.display = n ? "none" : "flex";
  $("#wahlzahl").textContent = n ? txt("k.gewaehlt", {n:n}) : "";
  $("#alle_haken").checked = n > 0 && n === S.mails.length;
  $("#alle_haken").indeterminate = n > 0 && n < S.mails.length;
  document.body.classList.toggle("wahlmodus", n > 0);
}
function gewaehlteUids(){
  return S.gewaehlt.size ? [...S.gewaehlt] : (S.uid ? [S.uid] : []);
}

/* ── Acting ────────────────────────────────────────────────────────────────── */
async function stapel(was, an, uids){
  uids = uids || gewaehlteUids();
  if(!uids.length) return melde(txt("k.nichts_gewaehlt"), false);
  const r = await sende("klient_flaggen", {ordner:S.ordner, uids:uids, was:was, an:an});
  if(!r.ok) return melde(r.text || txt("k.ging_nicht"), false);
  /* Do not refetch the whole list for a flag: the server has confirmed it, and a
     list that jumps after every click is a list you stop clicking in. */
  S.mails.forEach(m => { if(uids.includes(m.uid)) m[was] = an; });
  if(S.offen && uids.includes(S.offen.uid)) S.offen[was] = an;
  listeMalen();
  if(was === "gelesen"){
    const o = S.ordner_liste.find(x => x.name === S.ordner);
    if(o) o.ungelesen = Math.max(0, (o.ungelesen || 0) + (an ? -uids.length : uids.length));
    ordnerMalen();
  }
  if(S.offen && uids.includes(S.offen.uid)) leseKopfMalen();
}
async function stapelVerschieben(ziel, uids){
  if(!ziel) return;
  uids = uids || gewaehlteUids();
  $("#stapel_ziel").value = "";
  if(!uids.length) return melde(txt("k.nichts_gewaehlt"), false);
  const r = await sende("klient_verschieben", {ordner:S.ordner, uids:uids, ziel:ziel});
  melde(r.text || (r.ok ? "" : txt("k.ging_nicht")), r.ok);
  if(r.ok) await nachTat(uids);
}
async function stapelLoeschen(uids, endgueltig){
  uids = uids || gewaehlteUids();
  if(!uids.length) return melde(txt("k.nichts_gewaehlt"), false);
  /* 🔴 One mail is not „1 mails". A count that reads as a sentence needs both
     forms — everywhere else the number stands at the end, where no form is
     needed at all. */
  const frage = uids.length === 1 ? txt("k.loeschen_sicher_eine")
                                  : txt("k.loeschen_sicher", {n:uids.length});
  if(S.einst.sicherheitsfrage && !confirm(frage)) return;
  const r = await sende("klient_loeschen", {ordner:S.ordner, uids:uids,
                                            endgueltig:!!endgueltig});
  melde(r.text || (r.ok ? "" : txt("k.ging_nicht")), r.ok);
  if(r.ok) await nachTat(uids);
}
async function wieWache(uid, adresse){
  const r = await sende("klient_wie_wache", {ordner:S.ordner, uids:[uid],
                                             adresse:adresse});
  melde(r.text || (r.ok ? "" : txt("k.ging_nicht")), r.ok);
  if(r.ok) await nachTat([uid]);
}
/* After a move or a delete the mails are gone from this folder. Instead of
   refetching everything: take them out of the list, open the next one — that is
   what a reader working through a folder expects. */
async function nachTat(uids){
  const stelle = S.mails.findIndex(m => m.uid === S.uid);
  S.mails = S.mails.filter(m => !uids.includes(m.uid));
  S.gewaehlt.clear();
  if(uids.includes(S.uid)){
    const naechste = S.mails[Math.min(stelle, S.mails.length - 1)];
    S.uid = 0; S.offen = null; leseLeeren();
    if(naechste && S.einst.vorschau !== "aus") mailOeffnen(naechste.uid);
  }
  listeMalen();
  const l = await sende("klient_ordner", {frisch:true});
  if(l.ok){ S.ordner_liste = l.ordner || S.ordner_liste; ordnerMalen(); }
}

/* ── Filter, sort, search ──────────────────────────────────────────────────── */
async function siebSetzen(v){ S.sieb = v; S.seite = 1; S.gewaehlt.clear(); await ladeListe(true); }
async function sortSetzen(){
  S.sortierung = $("#sortierung").value;
  if(!S.faehig.sort && S.sortierung !== "datum")
    melde(txt("k.kein_sort"), false);
  S.seite = 1; await ladeListe(true);
}
async function richtungDrehen(){
  S.richtung = S.richtung === "ab" ? "auf" : "ab";
  $("#richtung").textContent = S.richtung === "ab" ? "↓" : "↑";
  S.seite = 1; await ladeListe(true);
}
async function sucheLos(){
  S.suche = $("#suche").value.trim();
  S.feld = $("#suchfeld").value;
  S.seite = 1; S.gewaehlt.clear();
  $("#suche_x").hidden = !S.suche;
  await ladeListe(true);
}
async function sucheLeeren(){
  $("#suche").value = ""; S.suche = ""; $("#suche_x").hidden = true;
  S.seite = 1; await ladeListe(true);
}
</script>

<script>
/* ── The reading pane ──────────────────────────────────────────────────────── */
function leseLeeren(){
  $("#lese").innerHTML = `<div class="leer"><div><span class="gross">✉️</span>
    ${esc(txt("k.nichts_offen"))}</div></div>`;
}
async function mailOeffnen(uid){
  clearTimeout(S.lesemarke);
  S.uid = uid;
  listeMalen();
  blick("lese");
  $("#lese").innerHTML = `<div class="leer"><div><span class="laedt"></span></div></div>`;
  let m;
  try{ m = await sende("klient_mail", {ordner:S.ordner, uid:uid}); }
  catch(e){ return; }
  if(!m || !m.ok){
    $("#lese").innerHTML = `<div class="leer"><div>${esc((m && m.text) || txt("k.ging_nicht"))}</div></div>`;
    return;
  }
  S.offen = m;
  leseMalen();
  const inListe = S.mails.find(x => x.uid === uid);
  if(m.gelesen && inListe && !inListe.gelesen){ inListe.gelesen = true; listeMalen();
    ordnerZahlAktualisieren(undefined, Math.max(0,
      ((S.ordner_liste.find(o => o.name === S.ordner) || {}).ungelesen || 1) - 1)); }
  /* „Mark as read after N seconds" — the timer belongs to the PAGE, because only
     it knows whether the mail is still open. It is cleared on every change of
     mail, otherwise a glance at four mails marks all four. */
  const nach = Number(S.einst.gelesen_nach);
  if(nach > 0 && !m.gelesen)
    S.lesemarke = setTimeout(() => { if(S.uid === uid) stapel("gelesen", true, [uid]); },
                             nach * 1000);
}
function leseMalen(){
  const m = S.offen;
  if(!m) return leseLeeren();
  $("#lese").innerHTML = `
    <div class="lesescroll" id="lesescroll">
      <div class="lesekopf" id="lesekopf"></div>
      <div class="lesetasten" id="lesetasten"></div>
      <div id="lesehinweise"></div>
      <table class="kopftabelle" id="kopftabelle">${
        (m.kopfzeilen || []).map(([n, w]) =>
          `<tr><td>${esc(n)}</td><td>${esc(w)}</td></tr>`).join("")}</table>
      <div class="anhangreihe" id="anhangreihe"></div>
      <iframe id="brief" title="${esc(txt("k.brief"))}"
              sandbox="allow-same-origin allow-popups allow-popups-to-escape-sandbox"
              srcdoc="${esc(m.rahmen || "")}" onload="briefHoehe()"></iframe>
    </div>`;
  leseKopfMalen();
  if(S.einst.kopfzeilen) $("#kopftabelle").classList.add("auf");
}
function leseKopfMalen(){
  const m = S.offen;
  if(!m) return;
  const an = (m.an || []).map(a => a.name || a.adresse).join(", ");
  const kopie = (m.kopie || []).map(a => a.name || a.adresse).join(", ");
  $("#lesekopf").innerHTML = `
    <h2>${esc(m.betreff || txt("k.ohne_betreff"))}</h2>
    <div class="wer">
      <span class="kreis" style="background:${farbe(m.adresse)}"
        >${esc(initialen(m.von, m.adresse))}</span>
      <div class="txt">
        <b>${esc(m.von || m.adresse)}</b>
        <div class="adr">${esc(m.adresse)}</div>
        <div class="kleiner leise" style="margin-top:.2rem">
          ${an ? esc(txt("k.an") + ": " + an) : ""}
          ${kopie ? " · " + esc(txt("k.kopie") + ": " + kopie) : ""}
        </div>
      </div>
      <div style="text-align:right;flex:0 0 auto">
        <div class="kleiner leise">${esc(langesDatum(m.zeit))}</div>
        <div class="kleiner leise">${esc(gr(m.groesse))}</div>
      </div>
    </div>`;
  const t = [];
  t.push(`<button onclick="verfassen('antwort',${m.uid})">↩ ${esc(txt("k.antworten"))}</button>`);
  if((m.an || []).length + (m.kopie || []).length > 1)
    t.push(`<button onclick="verfassen('antwort_alle',${m.uid})">↩↩ ${esc(txt("k.allen"))}</button>`);
  t.push(`<button onclick="verfassen('weiter',${m.uid})">➦ ${esc(txt("k.weiterleiten"))}</button>`);
  t.push(`<button class="blank" onclick="stapel('markiert',${!m.markiert},[${m.uid}])"
      title="${esc(txt("k.markieren"))}">${m.markiert ? "★" : "☆"}</button>`);
  t.push(`<button class="blank" onclick="stapel('gelesen',${!m.gelesen},[${m.uid}])"
      title="${esc(txt(m.gelesen ? "k.ungelesen" : "k.gelesen"))}">${m.gelesen ? "✉️" : "📖"}</button>`);
  const archiv = S.rollen.archiv;
  if(archiv && archiv !== S.ordner)
    t.push(`<button class="blank" onclick="stapelVerschieben('${escJs(archiv)}',[${m.uid}])"
        title="${esc(txt("k.archivieren"))}">📦</button>`);
  const spam = S.rollen.spam;
  if(spam && spam !== S.ordner)
    t.push(`<button class="blank" onclick="stapelVerschieben('${escJs(spam)}',[${m.uid}])"
        title="${esc(txt("k.spam"))}">🚫</button>`);
  t.push(`<button class="blank gefahr" onclick="stapelLoeschen([${m.uid}])"
      title="${esc(txt("k.loeschen"))}">🗑️</button>`);
  t.push(`<button class="blank" onclick="$('#kopftabelle').classList.toggle('auf')"
      title="${esc(txt("k.kopfzeilen"))}">📋</button>`);
  t.push(`<button class="blank" onclick="quelleZeigen()"
      title="${esc(txt("k.quelle"))}">{ }</button>`);
  t.push(`<button class="blank" onclick="briefDrucken()"
      title="${esc(txt("k.drucken"))}">🖨️</button>`);
  if(m.hat_html && m.hat_text)
    t.push(`<button class="blank" onclick="ansichtUm()"
        title="${esc(txt("k.ansicht_um"))}">${m.ansicht === "html" ? "Aa" : "</>"}</button>`);
  $("#lesetasten").innerHTML = t.join("");

  /* Banners and chips — everything the reader should know BEFORE clicking. */
  const h = [];
  if(m.phishing)
    h.push(`<div class="warnleiste"><span>🚨</span>
      <span><b>${esc(txt("k.phishing"))}</b> ${esc(m.phishing)}</span></div>`);
  if((m.links_verdacht || []).length){
    const l = m.links_verdacht.map(x =>
      `<div class="kleiner" style="margin-top:.25rem">${esc(x.text || "—")} →
        <b>${esc(x.wirt)}</b> <span class="leise">(${esc(txt("k.warn." + x.warnung))})</span></div>`).join("");
    h.push(`<div class="warnleiste mild"><div><b>${
      esc(txt("k.links_verdacht", {n:m.links_verdacht.length}))}</b>${l}</div></div>`);
  }
  if(m.fern_blockiert)
    h.push(`<div class="warnleiste mild"><span>🖼️</span>
      <span>${esc(txt("k.bilder_blockiert", {n:m.fern_blockiert}))}</span>
      <button onclick="bilderLaden()">${esc(txt("k.bilder_laden"))}</button>
      <button class="blank" onclick="bilderImmer()">${esc(txt("k.bilder_immer"))}</button></div>`);
  const c = [];
  const w = m.wache || {};
  if(w.klasse || w.ordner){
    const schub = (S.schubladen || {})[w.klasse] || {};
    c.push(`<span class="chip info" title="${esc(w.grund || "")}">🛡️
      ${w.klasse ? esc((schub.icon || "") + " " + (schub.name || w.klasse)) : ""}
      ${w.zeige ? "· " + esc(txt("k.wache_ordner", {o:w.zeige})) : ""}</span>`);
    if(w.ordner && w.ordner !== S.ordner)
      c.push(`<span class="chip tat" onclick="wieWache(${m.uid},'${escJs(m.adresse)}')"
        >➜ ${esc(txt("k.wie_wache"))}</span>`);
  }
  if(w.gesehen)
    c.push(`<span class="chip">${esc(txt("k.schon_gesehen", {n:w.gesehen}))}</span>`);
  if(m.abmelden)
    c.push(`<a class="chip tat" href="${esc(m.abmelden)}" target="_blank"
      rel="noopener noreferrer">📰 ${esc(txt("k.abmelden_link"))}</a>`);
  if(c.length) h.push(`<div class="bahn">${c.join("")}</div>`);
  $("#lesehinweise").innerHTML = h.join("");

  const a = (m.anhaenge || []).map(x => {
    const url = "/api/klient/anhang?pf=" + encodeURIComponent(S.pf) +
      "&ordner=" + encodeURIComponent(S.ordner) + "&uid=" + m.uid +
      "&t=" + encodeURIComponent(x.t) + "&k=" + encodeURIComponent(x.k) +
      "&n=" + encodeURIComponent(x.n);
    const ic = x.art === "bild" ? "🖼️" : (x.art === "dokument" ? "📄" : "📎");
    return `<a class="anh" href="${esc(url)}" download="${esc(x.n)}"
      title="${esc(x.n + " · " + x.m)}"><span>${ic}</span>
      <span class="nm">${esc(x.n)}</span><span class="gr">${esc(gr(x.b))}</span></a>`;
  });
  $("#anhangreihe").innerHTML = a.length
    ? `<span class="kleiner leise" style="align-self:center">${
        esc(txt("k.anhaenge", {n:a.length}))}</span>` + a.join("") : "";
}
/* 🔴 The frame is measured, not guessed. `allow-same-origin` WITHOUT
   `allow-scripts` is the point: the parent may read the document to find its
   height, and the browser still refuses to run anything inside it. */
function briefHoehe(){
  const f = $("#brief");
  if(!f) return;
  const messen = () => {
    try{
      const d = f.contentDocument;
      if(!d || !d.body) return;
      f.style.height = Math.max(160, d.body.scrollHeight + 24) + "px";
    }catch(e){ f.style.height = "70vh"; }
  };
  messen();
  /* Images arrive after the load event; without the second look every mail with a
     picture ends up cut off at the bottom. */
  setTimeout(messen, 350);
  setTimeout(messen, 1200);
}
async function bilderLaden(){
  const m = await sende("klient_mail", {ordner:S.ordner, uid:S.uid, bilder:1});
  if(m && m.ok){ S.offen = m; leseMalen(); }
}
async function bilderImmer(){
  await einstellungSetzen("bilder", "immer");
  await bilderLaden();
}
async function ansichtUm(){
  const neu = S.offen.ansicht === "html" ? "text" : "html";
  const m = await sende("klient_mail", {ordner:S.ordner, uid:S.uid, ansicht:neu,
                                        bilder: S.offen.bilder ? 1 : 0});
  if(m && m.ok){ S.offen = m; leseMalen(); }
}
function quelleZeigen(){
  window.open("/api/klient/roh?pf=" + encodeURIComponent(S.pf) + "&ordner=" +
    encodeURIComponent(S.ordner) + "&uid=" + S.uid, "_blank");
}
function briefDrucken(){
  const f = $("#brief");
  try{ f.contentWindow.focus(); f.contentWindow.print(); }
  catch(e){ window.print(); }
}
</script>

<script>
/* ── Writing ───────────────────────────────────────────────────────────────── */
async function verfassen(art, uid){
  const v = await sende("klient_vorlage", {art:art, ordner:S.ordner, uid:uid || 0});
  if(!v || !v.ok) return melde((v && v.text) || txt("k.ging_nicht"), false);
  S.brief = {art:art, quelle:v.quelle || null, in_antwort_auf:v.in_antwort_auf || "",
             anhaenge:[], uebernahme:(v.anhaenge || []).map(a =>
               Object.assign({}, a, {ordner:(v.quelle || {}).ordner,
                                     uid:(v.quelle || {}).uid}))};
  $("#v_titel").textContent = txt({neu:"k.neue_mail", antwort:"k.antworten",
    antwort_alle:"k.allen", weiter:"k.weiterleiten"}[art] || "k.neue_mail");
  $("#v_absender").textContent = (S.smtp && S.smtp.server)
    ? txt("k.von") + " " + ((S.postfaecher.find(p => p.id === S.pf) || {}).adresse || "")
    : txt("k.smtp_fehlt");
  $("#v_an").value = v.an || "";
  $("#v_kopie").value = v.kopie || "";
  $("#v_blind").value = "";
  $("#v_betreff").value = v.betreff || "";
  $("#v_text").value = v.text || "";
  $("#v_kopiereihe").hidden = !v.kopie;
  $("#v_blindreihe").hidden = true;
  $("#v_stand").textContent = "";
  anhaengeMalen();
  $("#verfassenfenster").classList.add("auf");
  $("#dunkel1").classList.add("auf");
  setTimeout(() => {
    const feld = (art === "neu" || art === "weiter") ? $("#v_an") : $("#v_text");
    feld.focus();
    /* On a reply the cursor belongs BEFORE the quote, not behind it — with the
       quote below, that is position 0. */
    if(feld === $("#v_text") && S.einst.zitat !== "oben"){
      feld.setSelectionRange(0, 0);
      /* 🔴 And to the top. Setting the cursor is not the same as scrolling
         there — the first line of the quote was cut off at the upper edge. */
      feld.scrollTop = 0;
    }
  }, 70);
}
function verfassenZu(){
  const leer = !$("#v_an").value && !$("#v_betreff").value.trim() &&
               !$("#v_text").value.replace(/\s/g, "");
  if(!leer && !confirm(txt("k.verwerfen_sicher"))) return;
  $("#verfassenfenster").classList.remove("auf");
  $("#dunkel1").classList.remove("auf");
}
function kopieZeigen(){
  $("#v_kopiereihe").hidden = false;
  $("#v_blindreihe").hidden = false;
  $("#v_mehr").style.display = "none";
}
function anhaengeMalen(){
  const b = S.brief || {anhaenge:[], uebernahme:[]};
  const eigene = b.anhaenge.map((a, i) =>
    `<span class="anh"><span>📎</span><span class="nm">${esc(a.name)}</span>
      <span class="gr">${esc(gr(a.gross))}</span>
      <button class="blank kleiner" onclick="anhangWeg(${i})">✕</button></span>`);
  const alte = b.uebernahme.map((a, i) =>
    `<span class="anh" title="${esc(txt("k.aus_original"))}"><span>↪</span>
      <span class="nm">${esc(a.n)}</span><span class="gr">${esc(gr(a.b))}</span>
      <button class="blank kleiner" onclick="uebernahmeWeg(${i})">✕</button></span>`);
  $("#v_anhaenge").innerHTML = eigene.concat(alte).join("");
}
function anhangWeg(i){ S.brief.anhaenge.splice(i, 1); anhaengeMalen(); }
function uebernahmeWeg(i){ S.brief.uebernahme.splice(i, 1); anhaengeMalen(); }
function dateienNehmen(dateien){
  const grenze = (S.einst.anhang_grenze || 25) * 1024 * 1024;
  [...dateien].forEach(d => {
    const schon = S.brief.anhaenge.reduce((s, a) => s + a.gross, 0);
    if(schon + d.size > grenze) return melde(txt("k.anhang_gross",
      {mb:S.einst.anhang_grenze || 25}), false);
    const leser = new FileReader();
    leser.onload = () => {
      S.brief.anhaenge.push({name:d.name, typ:d.type || "", gross:d.size,
        b64:String(leser.result).split(",")[1] || ""});
      anhaengeMalen();
    };
    leser.readAsDataURL(d);
  });
  $("#v_datei").value = "";
}
function briefFelder(){
  const b = S.brief || {};
  return {an:$("#v_an").value, kopie:$("#v_kopie").value, blind:$("#v_blind").value,
    betreff:$("#v_betreff").value, text:$("#v_text").value,
    anhaenge:b.anhaenge || [], uebernahme:b.uebernahme || [],
    in_antwort_auf:b.in_antwort_auf || "", quelle:b.quelle || null,
    entwurf_uid:b.entwurf_uid || 0};
}
async function senden(){
  const k = $("#v_senden");
  k.disabled = true;
  $("#v_stand").innerHTML = `<span class="laedt"></span> ${esc(txt("k.sende"))}`;
  let r;
  try{ r = await sende("klient_senden", briefFelder()); }
  catch(e){ k.disabled = false; return; }
  k.disabled = false;
  $("#v_stand").textContent = "";
  melde(r.text || (r.ok ? "" : txt("k.ging_nicht")), r.ok);
  if(r.ok){
    S.brief = {anhaenge:[], uebernahme:[]};
    $("#v_an").value = $("#v_kopie").value = $("#v_blind").value = "";
    $("#v_betreff").value = $("#v_text").value = "";
    $("#verfassenfenster").classList.remove("auf");
    $("#dunkel1").classList.remove("auf");
    await allesLaden(false);
  }
}
async function entwurfSpeichern(){
  const r = await sende("klient_entwurf", briefFelder());
  melde(r.text || (r.ok ? "" : txt("k.ging_nicht")), r.ok);
}

/* ── Address book out of the watchman's memory ─────────────────────────────── */
let vorschlag_zeit = null;
function letzterTeil(wert){
  const stuecke = String(wert).split(",");
  return {vor:stuecke.slice(0, -1), frage:(stuecke[stuecke.length - 1] || "").trim()};
}
function vorschlagSuchen(el){
  clearTimeout(vorschlag_zeit);
  const kasten = $("#vorschlag_" + el.id.slice(2));
  const {frage} = letzterTeil(el.value);
  if(frage.length < 2){ kasten.classList.remove("auf"); return; }
  vorschlag_zeit = setTimeout(async () => {
    const r = await sende("klient_adressbuch", {q:frage});
    const t = (r.treffer || []);
    if(!t.length){ kasten.classList.remove("auf"); return; }
    kasten.innerHTML = t.map((x, i) =>
      `<div data-i="${i}" class="${i === 0 ? "an" : ""}"
        onclick="vorschlagNehmen('${escJs(el.id)}',${i})">
        ${esc(x.name || x.adresse)}<small>${esc(x.adresse)} · ${
        esc(txt("k.mails_n", {n:x.n}))}</small></div>`).join("");
    kasten._treffer = t;
    kasten.classList.add("auf");
  }, 180);
}
function vorschlagNehmen(feldId, i){
  const el = $("#" + feldId), kasten = $("#vorschlag_" + feldId.slice(2));
  const x = (kasten._treffer || [])[i];
  if(!x) return;
  const {vor} = letzterTeil(el.value);
  /* A name with a comma has to be quoted, otherwise the comma separates two
     recipients out of one person. */
  const name = x.name && x.name.includes(",") ? '"' + x.name.replace(/"/g, "") + '"'
                                              : x.name;
  const eintrag = name ? name + " <" + x.adresse + ">" : x.adresse;
  el.value = vor.concat([" " + eintrag]).join(",").replace(/^\s*,?\s*/, "") + ", ";
  kasten.classList.remove("auf");
  el.focus();
}
function vorschlagTaste(ev, el){
  const kasten = $("#vorschlag_" + el.id.slice(2));
  if(!kasten.classList.contains("auf")) return;
  const zeilen = [...kasten.querySelectorAll("div")];
  let i = zeilen.findIndex(z => z.classList.contains("an"));
  if(ev.key === "ArrowDown" || ev.key === "ArrowUp"){
    ev.preventDefault();
    zeilen[i] && zeilen[i].classList.remove("an");
    i = (i + (ev.key === "ArrowDown" ? 1 : zeilen.length - 1)) % zeilen.length;
    zeilen[i].classList.add("an");
  }else if(ev.key === "Enter" || ev.key === "Tab"){
    ev.preventDefault();
    vorschlagNehmen(el.id, i < 0 ? 0 : i);
  }else if(ev.key === "Escape"){
    kasten.classList.remove("auf");
  }
}
</script>

<script>
/* ── Settings ──────────────────────────────────────────────────────────────
   🔑 ONE table describes them all. Every switch here exists in the engine's
   `VORGABEN` as well, and the engine refuses anything it does not know — so a
   forgotten line here is a missing switch, never a setting that lands nowhere. */
/* 🔑 There is NO settings table here any more. It stands in `klient.py` next to
   the defaults it is built from and arrives with the state — otherwise the phone
   version and this one would each carry their own, and the second one is always
   the one missing the newest switch. */

function einstAuf(){
  einstMalen();
  $("#einstschublade").classList.add("auf");
  $("#dunkel2").classList.add("auf");
}
function einstZu(){
  $("#einstschublade").classList.remove("auf");
  $("#dunkel2").classList.remove("auf");
}
function einstMalen(){
  const e = S.einst;
  const stueck = (f) => {
    const wert = e[f.s];
    const titel = esc(txt(f.titel));
    const hilfe = txt(f.hilfe);
    const kopf = `<div class="txt"><b>${titel}</b>${
      hilfe === f.hilfe ? "" : `<span>${esc(hilfe)}</span>`}</div>`;
    if(f.art === "knebel")
      return `<div class="reihe">${kopf}
        <div class="knebel" role="switch" tabindex="0" aria-checked="${!!wert}"
          aria-label="${titel}"
          onclick="einstellungSetzen('${f.s}',${!wert})"
          onkeydown="if(event.key===' '||event.key==='Enter'){event.preventDefault();
            einstellungSetzen('${f.s}',${!wert})}"></div></div>`;
    if(f.art === "wahl")
      return `<div class="reihe">${kopf}<div class="stell"><select aria-label="${titel}"
        onchange="einstellungSetzen('${f.s}',this.value)">${
        (f.optionen || []).map(([v, k]) => `<option value="${esc(v)}"${
          String(v) === String(wert) ? " selected" : ""}>${esc(txt(k))}</option>`).join("")
        }</select></div></div>`;
    if(f.art === "zahl")
      return `<div class="reihe">${kopf}<div class="stell"
        style="display:flex;gap:.4rem;align-items:center">
        <input type="range" min="${f.tief}" max="${f.hoch}" step="${f.schritt}"
          value="${wert}" aria-label="${titel}"
          oninput="this.nextElementSibling.textContent=this.value+'${f.einheit}'"
          onchange="einstellungSetzen('${f.s}',Number(this.value))">
        <span class="kleiner zahl" style="flex:0 0 3rem">${wert}${f.einheit}</span>
        </div></div>`;
    if(f.art === "ordner")
      return `<div class="reihe">${kopf}<div class="stell"><select aria-label="${titel}"
        onchange="einstellungSetzen('${f.s}',this.value)">
        <option value="">${esc(txt("k.o_automatisch"))}</option>${
        S.ordner_liste.filter(o => o.waehlbar).map(o =>
          `<option value="${esc(o.name)}"${o.name === wert ? " selected" : ""}>${
          esc(o.pfad)}</option>`).join("")}</select></div></div>`;
    if(f.mehrzeilig)
      return `<div style="padding:.5rem 0;border-top:1px solid var(--rand)">
        <label>${titel}</label><textarea rows="4"
          onchange="einstellungSetzen('${f.s}',this.value)"
          >${esc(wert || "")}</textarea></div>`;
    return `<div class="reihe">${kopf}<div class="stell"><input value="${esc(wert || "")}"
      aria-label="${titel}" onchange="einstellungSetzen('${f.s}',this.value)"></div></div>`;
  };
  const gruppen = (S.oberflaeche || []).map(g =>
    `<div class="gruppe"><h3>${esc(txt(g.titel))}</h3>
      <div class="klein leise">${esc(txt(g.hilfe))}</div>
      ${(g.felder || []).map(stueck).join("")}</div>`);

  /* The sending route and the access word — the two things that are not a view. */
  const s = S.smtp || {};
  gruppen.push(`<div class="gruppe"><h3>${esc(txt("k.g_senden"))}</h3>
    <div class="klein leise">${esc(txt("k.g_senden_hilfe"))}</div>
    <div class="feldpaar" style="margin-top:.5rem">
      <div style="flex:2 1 12rem"><label>${esc(txt("k.smtp_server"))}</label>
        <input id="s_server" value="${esc(s.server || "")}"
          placeholder="${esc(s.geraten ? txt("k.geraten") : "")}"></div>
      <div style="flex:0 0 6rem"><label>${esc(txt("k.smtp_port"))}</label>
        <input id="s_port" class="zahl" value="${esc(s.port || 587)}"></div>
      <div><label>${esc(txt("k.smtp_art"))}</label><select id="s_art">
        <option value="starttls"${s.art === "starttls" ? " selected" : ""}>STARTTLS</option>
        <option value="ssl"${s.art === "ssl" ? " selected" : ""}>SSL/TLS</option>
        <option value="klar"${s.art === "klar" ? " selected" : ""}>${
          esc(txt("k.o_klar"))}</option></select></div>
    </div>
    <div class="feldpaar" style="margin-top:.5rem">
      <div><label>${esc(txt("k.smtp_benutzer"))}</label>
        <input id="s_benutzer" value="${esc(s.benutzer || "")}"></div>
      <div><label>${esc(txt("k.smtp_passwort"))}</label>
        <input id="s_passwort" type="password" autocomplete="new-password"
          placeholder="${esc(s.passwort_da ? txt("k.unveraendert") : txt("k.wie_imap"))}"></div>
      <div><label>${esc(txt("k.absender_name"))}</label>
        <input id="s_name" value="${esc(s.absender_name || "")}"></div>
    </div>
    <div style="display:flex;gap:.5rem;margin-top:.6rem;flex-wrap:wrap">
      <button class="haupt" onclick="smtpSpeichern()">${esc(txt("k.speichern"))}</button>
      <button onclick="smtpPruefen()">${esc(txt("k.verbindung_pruefen"))}</button>
      <span class="kleiner leise" id="s_stand" style="align-self:center"></span>
    </div></div>`);

  gruppen.push(`<div class="gruppe"><h3>${esc(txt("k.g_zugang"))}</h3>
    <div class="klein leise">${esc(txt("k.g_zugang_hilfe"))}</div>
    <div class="feldpaar" style="margin-top:.5rem">
      <div><label>${esc(txt("k.wort_alt"))}</label>
        <input id="w_alt" type="password" autocomplete="current-password"></div>
      <div><label>${esc(txt("k.wort_neu"))}</label>
        <input id="w_neu" type="password" autocomplete="new-password"></div>
    </div>
    <div style="display:flex;gap:.5rem;margin-top:.6rem;flex-wrap:wrap">
      <button onclick="wortAendern()">${esc(txt("k.wort_aendern"))}</button>
      <button onclick="abmelden()">🔒 ${esc(txt("k.abmelden"))}</button>
    </div></div>`);
  /* The way to the phone version — and it stays there, the server remembers the
     choice. Useful on a laptop too: it is the quickest way to see what the page
     looks like on a phone. */
  gruppen.push(`<div class="gruppe"><h3>${esc(txt("k.ansicht"))}</h3>
    <div class="klein leise">${esc(txt("k.ansicht_hilfe"))}</div>
    <div style="display:flex;gap:.5rem;flex-wrap:wrap;padding:.6rem 0">
      <button onclick="location.href='/post?ansicht=mobil'">📱 ${
        esc(txt("k.handy_ansicht"))}</button>
      <button onclick="location.href='/?wache=1'">🛡️ ${esc(txt("k.zum_waechter"))}</button>
    </div></div>`);
  gruppen.push(`<div class="klein leise" style="text-align:center;padding:.4rem 0 1.5rem">
    Postwache ${esc(S.version)}</div>`);
  $("#einstleib").innerHTML = gruppen.join("");
}
async function einstellungSetzen(schluessel, wert){
  const r = await sende("klient_einstellung", {werte:{[schluessel]:wert}});
  if(!r.ok) return melde(r.text || txt("k.ging_nicht"), false);
  S.einst = r.einst || S.einst;
  einstAnwenden();
  /* A setting that changes the LIST has to be visible immediately — otherwise it
     looks as if it did not take. */
  if(["dichte","absender_zeigen","vorschautext","strang"].includes(schluessel))
    listeMalen();
  if(["pro_seite","sortierung","richtung","nur_ungelesen"].includes(schluessel)){
    S.sortierung = S.einst.sortierung; S.richtung = S.einst.richtung;
    S.pro = S.einst.pro_seite; S.seite = 1;
    einstAnwenden(); await ladeListe(true);
  }
  if(["bilder","html_zuerst","wache_grund","kopfzeilen"].includes(schluessel) && S.uid)
    await mailOeffnen(S.uid);
  if($("#einstschublade").classList.contains("auf")) einstMalen();
}
async function smtpSpeichern(){
  const r = await sende("klient_smtp", {server:$("#s_server").value,
    port:$("#s_port").value, art:$("#s_art").value, benutzer:$("#s_benutzer").value,
    passwort:$("#s_passwort").value, absender_name:$("#s_name").value});
  melde(r.text, r.ok);
  if(r.ok){ S.smtp = r.smtp || S.smtp; $("#s_passwort").value = ""; einstMalen(); }
}
async function smtpPruefen(){
  $("#s_stand").innerHTML = `<span class="laedt"></span>`;
  const r = await sende("klient_smtp_pruefen", {});
  $("#s_stand").textContent = r.text || "";
  melde(r.text, r.ok);
}
async function wortAendern(){
  const neu = $("#w_neu").value;
  if(neu.length < 8) return melde(txt("k.wort_kurz"), false);
  const r = await sende("klient_wort", {neu:neu, alt:$("#w_alt").value});
  melde(r.text, r.ok);
  if(r.ok){ $("#w_alt").value = $("#w_neu").value = ""; torZeigen({wort:true, an:false}); }
}

/* ── Keyboard ──────────────────────────────────────────────────────────────── */
const TASTEN = [
  ["j", "k.t_runter"], ["k", "k.t_rauf"], ["Enter", "k.t_oeffnen"],
  ["u", "k.t_ungelesen"], ["f", "k.t_stern"], ["e", "k.t_archiv"],
  ["#", "k.t_loeschen"], ["r", "k.t_antwort"], ["a", "k.t_allen"],
  ["w", "k.t_weiter"], ["c", "k.t_neu"], ["/", "k.t_suche"],
  ["g", "k.t_posteingang"], ["x", "k.t_waehlen"], ["Esc", "k.t_zu"], ["?", "k.t_hilfe"],
];
function hilfeAuf(){
  $("#tastenliste").innerHTML = TASTEN.map(([t, k]) =>
    `<div><kbd>${esc(t)}</kbd><span>${esc(txt(k))}</span></div>`).join("");
  $("#hilfefenster").classList.add("auf");
  $("#dunkel3").classList.add("auf");
}
function hilfeZu(){
  $("#hilfefenster").classList.remove("auf");
  $("#dunkel3").classList.remove("auf");
}
function offeneFenster(){
  return $$(".fenster.auf, .schublade.auf").length > 0;
}
document.addEventListener("keydown", (ev) => {
  const feld = /^(INPUT|TEXTAREA|SELECT)$/.test((ev.target.tagName || ""));
  if(ev.key === "Escape"){
    if(offeneFenster()){ verfassenZu(); einstZu(); hilfeZu(); }
    else if(feld) ev.target.blur();
    else if(S.gewaehlt.size){ S.gewaehlt.clear(); listeMalen(); }
    else blick("liste");
    return;
  }
  if(feld || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  if(!S.einst.tasten || $("#tor").classList.contains("auf")) return;
  if(offeneFenster()) return;
  const i = S.mails.findIndex(m => m.uid === S.uid);
  const gehe = (d) => {
    const n = S.mails[Math.max(0, Math.min(S.mails.length - 1, (i < 0 ? -1 : i) + d))];
    if(n) mailOeffnen(n.uid);
  };
  switch(ev.key){
    case "j": case "ArrowDown": ev.preventDefault(); gehe(1); break;
    case "k": case "ArrowUp": ev.preventDefault(); gehe(-1); break;
    case "Enter": if(S.uid) mailOeffnen(S.uid); break;
    case "u": if(S.uid) stapel("gelesen", !(S.offen || {}).gelesen, [S.uid]); break;
    case "f": if(S.uid) stapel("markiert", !(S.offen || {}).markiert, [S.uid]); break;
    case "e": if(S.uid && S.rollen.archiv) stapelVerschieben(S.rollen.archiv, [S.uid]); break;
    case "#": case "Delete": if(S.uid) stapelLoeschen([S.uid]); break;
    case "r": if(S.uid) verfassen("antwort", S.uid); break;
    case "a": if(S.uid) verfassen("antwort_alle", S.uid); break;
    case "w": if(S.uid) verfassen("weiter", S.uid); break;
    case "c": verfassen("neu"); break;
    case "x": if(S.uid) wahlUm(S.uid, i, false); break;
    case "g": if(S.rollen.posteingang) ordnerWaehlen(S.rollen.posteingang); break;
    case "/": ev.preventDefault(); $("#suche").focus(); break;
    case "?": hilfeAuf(); break;
  }
});

/* ── Start ─────────────────────────────────────────────────────────────────── */
textenSetzen(document);
leseLeeren();
allesLaden(true);
/* New mail should show up without pressing anything — but never while somebody is
   working. Selection, an open window, a focused field: all three block it. */
setInterval(async () => {
  if(document.hidden || S.laeuft || offeneFenster() || S.gewaehlt.size) return;
  if(/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName || "")) return;
  if(S.seite !== 1 || S.suche) return;
  try{
    const l = await sende("klient_ordner", {frisch:true});
    if(!l.ok) return;
    const vorher = (S.ordner_liste.find(o => o.name === S.ordner) || {}).gesamt;
    S.ordner_liste = l.ordner || S.ordner_liste;
    ordnerMalen();
    const jetzt = (S.ordner_liste.find(o => o.name === S.ordner) || {}).gesamt;
    if(jetzt !== vorher) await ladeListe(false);
  }catch(e){ /* the next round tries again */ }
}, 60000);
</script>
