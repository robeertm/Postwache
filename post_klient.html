<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Postwache</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%AC%3C/text%3E%3C/svg%3E">
<style>
/* ── The client wears the watchman's clothes ─────────────────────────────
   Same tokens as `post_web.html`: the warm ground, the amber accent, the glassy
   cards. Two pages that look like two products would be two products. What is
   different is the SHAPE: the dashboard is a column of cards with a maximum
   width, the client is a three-pane window that uses the whole screen. */
:root{
  color-scheme: dark;
  --grund:#12100c;
  --karte:rgba(255,255,255,.045); --karte2:rgba(255,255,255,.075);
  --karte-voll:#1d1b17;
  --rand:rgba(255,255,255,.10); --rand2:rgba(255,255,255,.18);
  --text:#f4efe6; --leise:#a99c88; --leiser:#7d7264;
  --akzent:#e0a458; --akzent-tief:#2a1d0a;
  --ok:#34d399; --info:#60a5fa; --warnung:#fbbf24; --kritisch:#f87171;
  --r:1.1rem; --r2:.7rem;
  --ordner:16.5rem;         /* width of the folder column */
  --zeile:5.05rem;          /* height of a list row — the density setting */
  --schrift:100%;
}
body[data-dichte="eng"]{--zeile:2.35rem}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;font-size:var(--schrift)}
html,body{margin:0;height:100%;overflow:hidden}
body{
  background:var(--grund); color:var(--text);
  font-family:ui-rounded,"SF Pro Rounded",system-ui,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
  /* 🔑 The same three lights as the watchman's page, in the same order and the
     same strengths. Two pages of one house do not get to have two grounds — and
     the client had a weaker version of this one, which read as a colder page
     rather than as a different one. */
  background-image:
    radial-gradient(60rem 34rem at 8% -10%, rgba(224,164,88,.16), transparent 60%),
    radial-gradient(46rem 30rem at 100% 4%, rgba(96,165,250,.08), transparent 58%),
    radial-gradient(50rem 34rem at 50% 118%, rgba(224,164,88,.09), transparent 60%);
  background-attachment:fixed;
}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
button{font:inherit;color:var(--text);background:var(--karte2);cursor:pointer;
  border:1px solid var(--rand);border-radius:var(--r2);padding:.42rem .75rem;
  transition:background .15s ease,border-color .15s ease,transform .06s ease}
button:hover{background:rgba(255,255,255,.12);border-color:var(--rand2)}
button:active{transform:translateY(1px)}
button:disabled{opacity:.42;cursor:not-allowed}
button.haupt{background:var(--akzent);border-color:var(--akzent);color:var(--akzent-tief);
  font-weight:600}
button.haupt:hover{filter:brightness(1.07)}
button.blank{background:transparent;border-color:transparent;padding:.34rem .45rem}
button.blank:hover{background:var(--karte2);border-color:var(--rand)}
button.gefahr:hover{background:#f871711f;border-color:#f8717166;color:#fca5a5}
input,select,textarea{font:inherit;color:var(--text);background:rgba(0,0,0,.28);
  border:1px solid var(--rand);border-radius:var(--r2);padding:.46rem .6rem;width:100%}
/* Sliders and checkboxes in the house colour — the browser's blue is the one
   thing on the page that belongs to somebody else. */
input[type=range],input[type=checkbox]{accent-color:var(--akzent)}
input[type=range]{padding:0}
input:focus,select,textarea:focus{outline:none}
input:focus-visible,textarea:focus-visible,select:focus-visible,
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--akzent);
  outline-offset:1px}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--leise) 50%),
  linear-gradient(135deg,var(--leise) 50%,transparent 50%);
  background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:1.7rem}
label{display:block;font-size:.76rem;color:var(--leise);margin:0 0 .2rem}
.leise{color:var(--leise)} .klein{font-size:.8rem} .kleiner{font-size:.72rem}
.zahl{font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.13);border-radius:99px;
  border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.24);background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ── Frame ───────────────────────────────────────────────────────── */
/* 🔑 The watchman's page is built of cards that float on the warm ground, and
   the client was built of panes divided by hairlines. Same colours, different
   house. So the panes are cards too: a gap between them, a rounded edge, and the
   ground showing through. Nothing else about the layout changes. */
.app{display:grid;grid-template-rows:auto 1fr;height:100%;min-height:0;
  padding:.6rem .7rem .7rem;gap:.6rem}
.leiste{display:flex;align-items:center;gap:.7rem;padding:.5rem .7rem;
  border:1px solid var(--rand);border-radius:var(--r);background:var(--karte);
  backdrop-filter:blur(12px);position:relative;z-index:6}
.wappen{width:2.1rem;height:2.1rem;display:grid;place-items:center;font-size:1.25rem;
  border-radius:50%;border:1.5px solid var(--akzent);opacity:.95;flex:0 0 auto}
.marke{display:flex;align-items:baseline;gap:.45rem;min-width:0}
.marke b{font-size:1.02rem;letter-spacing:-.01em}
.marke span{font-size:.7rem;color:var(--leiser)}
.suchfeld{flex:1 1 20rem;min-width:7rem;display:flex;gap:.35rem;align-items:center;
  background:rgba(0,0,0,.3);border:1px solid var(--rand);border-radius:99px;
  padding:.1rem .35rem .1rem .75rem;max-width:44rem}
.suchfeld:focus-within{border-color:var(--akzent)}
.suchfeld input{border:0;background:transparent;padding:.4rem 0}
.suchfeld select{border:0;background-color:transparent;width:auto;font-size:.78rem;
  color:var(--leise);padding:.2rem 1.4rem .2rem .4rem}
.leiste .rechts{display:flex;gap:.4rem;align-items:center;margin-left:auto;flex:0 0 auto}

.raum{display:grid;min-height:0;gap:.6rem;
  grid-template-columns:var(--ordner) minmax(19rem,1fr);
  grid-template-areas:"ordner liste";}
.raum[data-vorschau="rechts"]{grid-template-columns:var(--ordner) minmax(17rem,.95fr) minmax(21rem,1.25fr);
  grid-template-areas:"ordner liste lese"}
.raum[data-vorschau="unten"]{grid-template-columns:var(--ordner) 1fr;
  grid-template-rows:minmax(0,.95fr) minmax(0,1.05fr);
  grid-template-areas:"ordner liste" "ordner lese"}
.spalte{min-width:0;min-height:0;display:flex;flex-direction:column;
  border:1px solid var(--rand);border-radius:var(--r);background:var(--karte);
  overflow:hidden}
.ordner{grid-area:ordner;overflow:auto;padding:.55rem .5rem 1.5rem}
.liste{grid-area:liste;overflow:hidden}
.lese{grid-area:lese;overflow:hidden}

/* ── Folder tree ─────────────────────────────────────────────────── */
.obaum{display:flex;flex-direction:column;gap:1px}
.o{display:flex;align-items:center;gap:.5rem;padding:.4rem .55rem;border-radius:.6rem;
  cursor:pointer;border:1px solid transparent;min-width:0}
.o:hover{background:var(--karte)}
.o.an{background:rgba(224,164,88,.15);border-color:rgba(224,164,88,.35)}
.o .ic{flex:0 0 1.1rem;text-align:center;font-size:.92rem;opacity:.95}
.o .nm{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;font-size:.87rem}
.o.an .nm{font-weight:600}
.o .n{flex:0 0 auto;font-size:.7rem;color:var(--leiser);font-variant-numeric:tabular-nums}
.o .u{flex:0 0 auto;font-size:.68rem;font-weight:700;color:var(--akzent-tief);
  background:var(--akzent);border-radius:99px;padding:.05rem .4rem;
  font-variant-numeric:tabular-nums}
.ogruppe{margin:.75rem .55rem .25rem;font-size:.66rem;letter-spacing:.09em;
  text-transform:uppercase;color:var(--leiser)}
.ofalt{flex:0 0 .9rem;font-size:.72rem;color:var(--leise);text-align:center;
  cursor:pointer;transition:transform .15s ease}
.ofalt:hover{color:var(--text)}
.ofalt.zu{transform:rotate(-90deg)}

/* ── Message list ────────────────────────────────────────────────── */
.werkzeug{display:flex;align-items:center;gap:.4rem;padding:.45rem .6rem;
  border-bottom:1px solid var(--rand);background:rgba(255,255,255,.028);
  flex-wrap:wrap}
.werkzeug .trenn{width:1px;height:1.3rem;background:var(--rand);margin:0 .15rem}
.werkzeug select{width:auto;font-size:.78rem;padding:.3rem 1.5rem .3rem .5rem}
.blaettern{display:flex;align-items:center;gap:.3rem;margin-left:auto;font-size:.76rem;
  color:var(--leise)}
.rollen{overflow:auto;flex:1 1 auto;min-height:0}
.zeilen{display:flex;flex-direction:column}
/* 🔴 EVERY cell is placed by hand — column AND row, on every child. Automatic
   placement put the date in the free column and pushed sender and subject to the
   far right, with the second line under the checkbox. It looked like a layout
   somebody had chosen. Nobody had. Since then the rule holds: in a grid that
   carries a list, nothing is left to the cursor. */
.z{display:grid;
  grid-template-columns:auto auto minmax(0,1fr) auto;
  grid-template-rows:auto auto auto;
  column-gap:.7rem;row-gap:.12rem;align-items:center;
  padding:.55rem .75rem;border-bottom:1px solid rgba(255,255,255,.05);
  cursor:pointer;min-height:var(--zeile);position:relative}
.z:hover{background:rgba(255,255,255,.055)}
.z.an{background:rgba(224,164,88,.14);box-shadow:inset 3px 0 0 var(--akzent)}
.z.gewaehlt{background:rgba(96,165,250,.13)}
.z.weg{opacity:.45;text-decoration:line-through}
.z .haken{grid-column:1;grid-row:1/4;width:1.05rem;height:1.05rem;
  accent-color:var(--akzent);margin:0;cursor:pointer;justify-self:center;
  opacity:.22;transition:opacity .12s}
.z:hover .haken,.z .haken:checked,body.wahlmodus .z .haken{opacity:1}
.z .kreis{grid-column:2;grid-row:1/4;width:2.2rem;height:2.2rem;border-radius:50%;
  display:grid;place-items:center;font-size:.78rem;font-weight:700;
  letter-spacing:-.02em;color:#15120c;justify-self:center}
/* Line 1: who — and when, right at the edge where the eye looks for it. */
.z .von{grid-column:3;grid-row:1;font-size:.92rem;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;align-self:end}
.z .wann{grid-column:4;grid-row:1;font-size:.74rem;color:var(--leise);
  font-variant-numeric:tabular-nums;white-space:nowrap;align-self:end;
  justify-self:end}
/* Line 2: what it says — and the marks. */
.z .bet{grid-column:3;grid-row:2;font-size:.89rem;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;color:var(--text);opacity:.94}
.z .zeichen{grid-column:4;grid-row:2;display:flex;gap:.28rem;font-size:.74rem;
  color:var(--leise);align-items:center;justify-self:end}
/* Line 3: the first words of the letter itself, across the full width. */
.z .aus{grid-column:3/5;grid-row:3;font-size:.79rem;color:var(--leiser);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.45}
.z.neu .von,.z.neu .bet{font-weight:700}
.z.neu .bet{color:#fffaf2}
.z.neu .wann{color:var(--akzent)}
.z .punkt{width:.45rem;height:.45rem;border-radius:50%;background:var(--akzent);
  flex:0 0 auto}
.z .stern{color:var(--warnung)}
/* Dense: one line, five columns, and again every cell named. */
body[data-dichte="eng"] .z{
  grid-template-columns:auto minmax(7rem,13rem) minmax(0,1fr) auto auto;
  grid-template-rows:auto;padding:.26rem .75rem;column-gap:.7rem}
body[data-dichte="eng"] .z .kreis{display:none}
body[data-dichte="eng"] .z .haken{grid-row:1}
body[data-dichte="eng"] .z .von{grid-column:2;grid-row:1;font-size:.86rem;
  align-self:center}
body[data-dichte="eng"] .z .bet{grid-column:3;grid-row:1;font-size:.86rem}
body[data-dichte="eng"] .z .zeichen{grid-column:4;grid-row:1}
body[data-dichte="eng"] .z .wann{grid-column:5;grid-row:1;align-self:center}
body[data-dichte="eng"] .z .aus{display:none}
.z.antwort{padding-left:1.9rem}
.z.antwort::before{content:"⤷";position:absolute;left:.75rem;top:50%;
  transform:translateY(-50%);color:var(--leiser);font-size:.8rem}

/* ── Reading pane ────────────────────────────────────────────────── */
.lesekopf{padding:.75rem .9rem .6rem;border-bottom:1px solid var(--rand);
  background:rgba(255,255,255,.02)}
.lesekopf h2{font-size:1.06rem;line-height:1.35;margin:0 0 .4rem}
.wer{display:flex;gap:.6rem;align-items:flex-start}
.wer .kreis{width:2.5rem;height:2.5rem;border-radius:50%;display:grid;place-items:center;
  font-size:.92rem;font-weight:700;flex:0 0 auto;color:#15120c}
.wer .txt{min-width:0;flex:1 1 auto}
.wer b{display:block;font-size:.92rem}
.wer .adr{font-size:.78rem;color:var(--leise);word-break:break-all}
.lesetasten{display:flex;gap:.35rem;flex-wrap:wrap;padding:.5rem .9rem;
  border-bottom:1px solid var(--rand)}
.lesetasten button{font-size:.8rem;padding:.35rem .6rem}
.bahn{display:flex;gap:.45rem;flex-wrap:wrap;padding:.45rem .9rem 0}
.chip{display:inline-flex;align-items:center;gap:.35rem;padding:.16rem .6rem;
  border-radius:999px;font-size:.74rem;border:1px solid var(--rand);
  background:var(--karte2);color:var(--leise);max-width:100%}
.chip b{font-weight:600;color:var(--text)}
.chip.ok{color:var(--ok);border-color:#34d39955;background:#34d3991a}
.chip.warnung{color:var(--warnung);border-color:#fbbf2455;background:#fbbf241a}
.chip.kritisch{color:var(--kritisch);border-color:#f8717155;background:#f871711a}
.chip.info{color:var(--info);border-color:#60a5fa55;background:#60a5fa1a}
.chip.tat{cursor:pointer}
.chip.tat:hover{background:rgba(255,255,255,.14);color:var(--text)}
.warnleiste{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;
  margin:.55rem .9rem 0;padding:.5rem .7rem;border-radius:var(--r2);font-size:.8rem;
  border:1px solid #f8717155;background:#f871711a;color:#fca5a5}
.warnleiste.mild{border-color:#fbbf2455;background:#fbbf2414;color:#fcd34d}
.warnleiste button{padding:.24rem .55rem;font-size:.76rem}
.anhangreihe{display:flex;gap:.45rem;flex-wrap:wrap;padding:.55rem .9rem 0}
.anh{display:inline-flex;align-items:center;gap:.4rem;padding:.3rem .55rem;
  border-radius:.6rem;border:1px solid var(--rand);background:var(--karte2);
  font-size:.78rem;max-width:20rem;text-decoration:none;color:var(--text)}
.anh:hover{border-color:var(--rand2);background:rgba(255,255,255,.12)}
.anh .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.anh .gr{color:var(--leiser);font-size:.7rem;flex:0 0 auto}
.kopftabelle{margin:.55rem .9rem 0;font-size:.74rem;border-collapse:collapse;
  width:calc(100% - 1.8rem);display:none}
.kopftabelle.auf{display:table}
.kopftabelle td{border-top:1px solid var(--rand);padding:.2rem .4rem;
  vertical-align:top;word-break:break-word}
.kopftabelle td:first-child{color:var(--leiser);white-space:nowrap;width:9rem}
/* The reading pane scrolls as ONE piece: header, chips, attachments and letter
   together. Two scroll areas in one pane is the kind of thing people fight with
   instead of reading. So the frame gets the height of its content, measured after
   loading — see `briefHoehe()`. */
.lesescroll{flex:1 1 auto;min-height:0;overflow:auto;display:flex;
  flex-direction:column}
#brief{width:100%;border:0;background:#161410;display:block;min-height:11rem;
  flex:0 0 auto}
.nichtschmal{display:inline}
/* Preview „off": the letter takes the place of the list instead of squeezing it. */
.raum[data-vorschau="aus"] .lese{display:none}
body[data-blick="lese"] .raum[data-vorschau="aus"] .lese{display:flex;grid-area:liste}
body[data-blick="lese"] .raum[data-vorschau="aus"] .liste{display:none}
.lese .leer,.liste .leer{display:grid;place-items:center;height:100%;padding:2rem;
  text-align:center;color:var(--leiser);font-size:.85rem;line-height:1.6}
.lese .leer .gross{font-size:2.4rem;opacity:.5;display:block;margin-bottom:.5rem}

/* ── Windows: compose, settings, login, help ─────────────────────── */
.dunkel{position:fixed;inset:0;background:rgba(8,7,5,.68);backdrop-filter:blur(3px);
  z-index:20;display:none}
.dunkel.auf{display:block}
.fenster{position:fixed;z-index:21;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(56rem,94vw);max-height:92vh;display:none;flex-direction:column;
  background:var(--karte-voll);border:1px solid var(--rand2);border-radius:var(--r);
  box-shadow:0 24px 70px rgba(0,0,0,.6);overflow:hidden}
.fenster.auf{display:flex}
.fkopf{display:flex;align-items:center;gap:.6rem;padding:.65rem .8rem;
  border-bottom:1px solid var(--rand);background:rgba(255,255,255,.03)}
.fkopf h2{font-size:.98rem;flex:1 1 auto}
.fleib{padding:.8rem;overflow:auto;flex:1 1 auto;min-height:0}
.ffuss{display:flex;gap:.5rem;align-items:center;padding:.65rem .8rem;
  border-top:1px solid var(--rand);background:rgba(255,255,255,.02);flex-wrap:wrap}
.schublade{position:fixed;z-index:21;top:0;right:0;height:100%;width:min(34rem,96vw);
  background:var(--karte-voll);border-left:1px solid var(--rand2);display:none;
  flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,.5)}
.schublade.auf{display:flex}
.gruppe{border:1px solid var(--rand);border-radius:var(--r2);padding:.7rem .8rem;
  margin-bottom:.7rem;background:var(--karte)}
.gruppe > h3{font-size:.86rem;margin:0 0 .15rem}
.gruppe > .klein{margin-bottom:.55rem}
.reihe{display:flex;align-items:center;gap:.8rem;padding:.5rem 0;
  border-top:1px solid var(--rand)}
.reihe:first-of-type{border-top:0}
.reihe .txt{flex:1 1 auto;min-width:0}
.reihe .txt b{display:block;font-weight:600;font-size:.87rem}
.reihe .txt span{font-size:.76rem;color:var(--leise)}
.reihe .stell{flex:0 0 auto;width:11rem;max-width:45%}
.knebel{flex:0 0 auto;position:relative;width:46px;height:27px;border-radius:999px;
  border:1px solid var(--rand);background:rgba(255,255,255,.07);cursor:pointer}
.knebel::after{content:"";position:absolute;top:2px;left:2px;width:21px;height:21px;
  border-radius:50%;background:#e7ddcd;transition:transform .16s ease}
.knebel[aria-checked="true"]{background:var(--akzent);border-color:var(--akzent)}
.knebel[aria-checked="true"]::after{transform:translateX(19px);background:var(--akzent-tief)}
.feldpaar{display:flex;gap:.6rem;flex-wrap:wrap}
.feldpaar > div{flex:1 1 12rem;min-width:0}
.empf{display:flex;align-items:center;gap:.5rem;margin-bottom:.4rem}
.empf label{flex:0 0 3.2rem;margin:0;text-align:right}
.vorschlag{position:absolute;z-index:30;background:var(--karte-voll);
  border:1px solid var(--rand2);border-radius:var(--r2);overflow:hidden;
  box-shadow:0 12px 34px rgba(0,0,0,.5);display:none;max-height:16rem;overflow-y:auto}
.vorschlag.auf{display:block}
.vorschlag div{padding:.4rem .6rem;cursor:pointer;font-size:.82rem}
.vorschlag div:hover,.vorschlag div.an{background:rgba(224,164,88,.18)}
.vorschlag small{display:block;color:var(--leiser);font-size:.7rem}
#v_text{min-height:13rem;resize:vertical;font-family:inherit;line-height:1.5}
.tor{position:fixed;inset:0;z-index:40;display:none;place-items:center;
  background:radial-gradient(60rem 40rem at 50% -10%,rgba(224,164,88,.12),transparent 60%),
  var(--grund)}
.tor.auf{display:grid}
.torkarte{width:min(26rem,92vw);background:var(--karte);border:1px solid var(--rand);
  border-radius:var(--r);padding:1.4rem 1.3rem;backdrop-filter:blur(8px);text-align:center}
.torkarte .wappen{margin:0 auto .8rem;width:3.2rem;height:3.2rem;font-size:1.9rem}
.torkarte h1{font-size:1.2rem;margin-bottom:.3rem}
.torkarte p{margin:.3rem 0 1rem;font-size:.82rem;color:var(--leise);line-height:1.5}
.torkarte input{text-align:center;margin-bottom:.6rem}
.melde{position:fixed;left:50%;bottom:1.3rem;transform:translateX(-50%) translateY(2rem);
  background:var(--karte-voll);border:1px solid var(--rand2);border-radius:99px;
  padding:.5rem 1rem;font-size:.84rem;z-index:50;opacity:0;pointer-events:none;
  transition:opacity .2s ease,transform .2s ease;box-shadow:0 10px 30px rgba(0,0,0,.45);
  max-width:calc(100vw - 2rem)}
.melde.auf{opacity:1;transform:translateX(-50%) translateY(0)}
.melde.gut{border-color:#34d39977}
.melde.schlecht{border-color:#f8717199}
kbd{font:600 .72rem/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;
  background:var(--karte2);border:1px solid var(--rand);border-bottom-width:2px;
  border-radius:.35rem;padding:.08rem .34rem;color:var(--text)}
.tastenliste{display:grid;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr));
  gap:.3rem .9rem}
.tastenliste div{display:flex;gap:.5rem;align-items:baseline;font-size:.82rem;
  padding:.16rem 0}
.tastenliste kbd{flex:0 0 auto;min-width:1.5rem;text-align:center}
.laedt{display:inline-block;width:.85rem;height:.85rem;border-radius:50%;
  border:2px solid var(--rand2);border-top-color:var(--akzent);
  animation:dreh .7s linear infinite;vertical-align:-.1rem}
@keyframes dreh{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.laedt{animation-duration:2s}}
.nurschmal{display:none}

/* ── Big screens: use the room, do not stretch the text ───────────
   🔑 Two different things. A 27-inch screen should show MORE (wider folder
   column, wider list, more air) — but a line of text 200 characters long is
   harder to read, not easier. So: the panes grow, the letter keeps its measure.
   The reading measure sits in `rahmen()` on the plain-text container, never on
   HTML mail: a newsletter brings its own width, and a max-width across it breaks
   the layout it was built with. */
@media (min-width:1400px){
  :root{--ordner:18.5rem}
  .raum[data-vorschau="rechts"]{
    grid-template-columns:var(--ordner) minmax(21rem,.8fr) minmax(28rem,1.3fr)}
  .leiste{padding:.6rem 1.1rem}
  .z{padding:.58rem .9rem}
  .lesekopf,.lesetasten,.bahn,.anhangreihe,.kopftabelle{
    padding-left:1.3rem;padding-right:1.3rem}
  .kopftabelle{width:calc(100% - 2.6rem)}
  .ordner{padding:.7rem .7rem 2rem}
}
@media (min-width:1800px){
  :root{--ordner:21rem;--zeile:5.35rem}
  body[data-dichte="eng"]{--zeile:2.5rem}
  /* At this width the letter no longer needs the extra room — a newsletter is
     600 px wide and text keeps its measure. So the LIST gets more of it. */
  .raum[data-vorschau="rechts"]{
    grid-template-columns:var(--ordner) minmax(26rem,.9fr) minmax(32rem,1.1fr)}
  .suchfeld{max-width:56rem}
  .z .kreis{width:2.3rem;height:2.3rem;font-size:.82rem}
  .lesekopf h2{font-size:1.16rem}
  .leiste{padding:.7rem 1.5rem}
  .lesekopf,.lesetasten,.bahn,.anhangreihe{padding-left:1.7rem;padding-right:1.7rem}
}
/* Very wide and the preview below: the list would be one endless line of text,
   so the row content keeps a sane measure and centres. */
@media (min-width:2200px){
  .raum[data-vorschau="unten"] .zeilen,
  .raum[data-vorschau="unten"] .werkzeug{max-width:120rem;margin:0 auto;width:100%}
}

/* ── Phone: one pane at a time ───────────────────────────────────── */
@media (max-width:900px){
  .raum,.raum[data-vorschau="rechts"],.raum[data-vorschau="unten"]{
    grid-template-columns:1fr;grid-template-rows:1fr;
    grid-template-areas:"liste"}
  .ordner,.lese{display:none}
  body[data-blick="ordner"] .ordner{display:flex;grid-area:liste}
  body[data-blick="ordner"] .liste{display:none}
  body[data-blick="lese"] .lese{display:flex;grid-area:liste}
  body[data-blick="lese"] .liste{display:none}
  .nurschmal{display:inline-flex}
  .nichtschmal{display:none}
  .suchfeld{flex:1 1 6rem;max-width:none}
  .marke span{display:none}
  .leiste{gap:.4rem;padding:.5rem .55rem}
}
</style>
</head>
<body data-dichte="bequem" data-blick="liste">

<!-- ── The door. Nothing behind it is drawn before it is open. ───────────── -->
<div class="tor auf" id="tor">
  <div class="torkarte">

    <h1>Postwache</h1>

<div class="app" id="app" hidden>
  <header class="leiste">
    <button class="blank nurschmal" onclick="blick('ordner')"
            data-t-titel="k.ordner">☰</button>
    <div class="wappen">📬</div>

      <input id="suche" data-t-platzhalter="k.suchen"
             onkeydown="if(event.key==='Enter')sucheLos();if(event.key==='Escape')sucheLeeren()">
      <select id="suchfeld" onchange="if($('#suche').value)sucheLos()">
        <option value="alle" data-t="k.feld_alle"></option>
        <option value="von" data-t="k.feld_von"></option>
        <option value="betreff" data-t="k.feld_betreff"></option>
        <option value="an" data-t="k.feld_an"></option>

    </div>

        <span class="nichtschmal" data-t="k.verfassen"></span></button>
      <button class="blank" onclick="allesLaden(true)" data-t-titel="k.neu_laden">⟳</button>

  <main class="raum" id="raum" data-vorschau="rechts">
    <nav class="spalte ordner" id="ordner" data-t-aria="k.ordner"></nav>

    <section class="spalte liste">
      <div class="werkzeug">
        <input type="checkbox" id="alle_haken" onchange="alleWaehlen(this.checked)"
               style="width:1.05rem;height:1.05rem;accent-color:var(--akzent)"
               data-t-titel="k.alle_waehlen">
        <div id="wahltasten" style="display:none;gap:.4rem" >
          <button class="blank" onclick="stapel('gelesen',true)" data-t-titel="k.gelesen">📖</button>
          <button class="blank" onclick="stapel('gelesen',false)" data-t-titel="k.ungelesen">✉️</button>
          <button class="blank" onclick="stapel('markiert',true)" data-t-titel="k.markieren">⭐</button>
          <select id="stapel_ziel" onchange="stapelVerschieben(this.value)"
                  style="width:auto;max-width:10rem"></select>
          <button class="blank gefahr" onclick="stapelLoeschen()" data-t-titel="k.loeschen">🗑️</button>
          <span class="kleiner leise" id="wahlzahl"></span>
        </div>
        <div id="siebtasten" style="display:flex;gap:.4rem;align-items:center">
          <select id="sieb" onchange="siebSetzen(this.value)">
            <option value="" data-t="k.sieb_alle"></option>
            <option value="ungelesen" data-t="k.sieb_ungelesen"></option>
            <option value="markiert" data-t="k.sieb_markiert"></option>
            <option value="unbeantwortet" data-t="k.sieb_unbeantwortet"></option>
            <option value="anhang" data-t="k.sieb_anhang"></option>
          </select>
          <select id="sortierung" onchange="sortSetzen()">
            <option value="datum" data-t="k.sort_datum"></option>
            <option value="von" data-t="k.sort_von"></option>
            <option value="betreff" data-t="k.sort_betreff"></option>
            <option value="groesse" data-t="k.sort_groesse"></option>
          </select>
          <button class="blank" id="richtung" onclick="richtungDrehen()"
                  data-t-titel="k.richtung">↓</button>
        </div>
        <div class="blaettern">
          <span id="spanne" class="zahl"></span>
          <button class="blank" id="zurueck" onclick="blaettern(-1)">‹</button>
          <button class="blank" id="weiter" onclick="blaettern(1)">›</button>
        </div>
      </div>
      <div class="rollen" id="rollen">
        <div class="zeilen" id="zeilen"></div>
        <div class="leer" id="listeleer" hidden></div>
      </div>
    </section>

    <section class="spalte lese" id="lese"></section>
  </main>
</div>

<!-- ── Compose ──────────────────────────────────────────────────────────── -->
<div class="dunkel" id="dunkel1" onclick="verfassenZu()"></div>
<div class="fenster" id="verfassenfenster">
  <div class="fkopf">
    <h2 id="v_titel"></h2>
    <span class="kleiner leise" id="v_absender"></span>
    <button class="blank" onclick="verfassenZu()">✕</button>
  </div>
  <div class="fleib">
    <div class="empf"><label for="v_an" data-t="k.an"></label>

               onkeydown="vorschlagTaste(event,this)">

      <button class="blank kleiner" onclick="kopieZeigen()" id="v_mehr">Cc/Bcc</button>

      <div style="flex:1 1 auto;position:relative">
        <input id="v_kopie" autocomplete="off" oninput="vorschlagSuchen(this)"
               onkeydown="vorschlagTaste(event,this)">
        <div class="vorschlag" id="vorschlag_kopie"></div>
      </div></div>
    <div class="empf" id="v_blindreihe" hidden><label for="v_blind" data-t="k.blind"></label>
      <div style="flex:1 1 auto;position:relative">
        <input id="v_blind" autocomplete="off" oninput="vorschlagSuchen(this)"

    <div class="empf"><label for="v_betreff" data-t="k.betreff"></label>

  <div class="ffuss">

    <label style="display:inline-flex;align-items:center;gap:.4rem;margin:0;cursor:pointer">
      <input type="file" id="v_datei" multiple style="display:none"
