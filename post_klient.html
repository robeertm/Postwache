        <input id="v_an" autocomplete="off" oninput="vorschlagSuchen(this)"
               onkeydown="vorschlagTaste(event,this)">
        <div class="vorschlag" id="vorschlag_an"></div>
      </div>
      <button class="blank kleiner" onclick="kopieZeigen()" id="v_mehr">Cc/Bcc</button>
    </div>
    <div class="empf" id="v_kopiereihe" hidden><label for="v_kopie" data-t="k.kopie"></label>
      <div style="flex:1 1 auto;position:relative">
        <input id="v_kopie" autocomplete="off" oninput="vorschlagSuchen(this)"
               onkeydown="vorschlagTaste(event,this)">
        <div class="vorschlag" id="vorschlag_kopie"></div>
      </div></div>
    <div class="empf" id="v_blindreihe" hidden><label for="v_blind" data-t="k.blind"></label>
      <div style="flex:1 1 auto;position:relative">
        <input id="v_blind" autocomplete="off" oninput="vorschlagSuchen(this)"
               onkeydown="vorschlagTaste(event,this)">
        <div class="vorschlag" id="vorschlag_blind"></div>
      </div></div>
    <div class="empf"><label for="v_betreff" data-t="k.betreff"></label>
      <input id="v_betreff"></div>
    <textarea id="v_text" spellcheck="true"></textarea>
    <div class="anhangreihe" id="v_anhaenge" style="padding:.55rem 0 0"></div>
  </div>
  <div class="ffuss">
    <button class="haupt" onclick="senden()" id="v_senden" data-t="k.senden"></button>
    <button onclick="entwurfSpeichern()" data-t="k.entwurf"></button>
    <label style="display:inline-flex;align-items:center;gap:.4rem;margin:0;cursor:pointer">
      <input type="file" id="v_datei" multiple style="display:none"
             onchange="dateienNehmen(this.files)">
      <button onclick="$('#v_datei').click()" data-t="k.anhaengen"></button>
    </label>
    <span class="kleiner leise" id="v_stand" style="margin-left:auto"></span>
  </div>
</div>

<!-- ── Settings ─────────────────────────────────────────────────────────── -->
<div class="dunkel" id="dunkel2" onclick="einstZu()"></div>
<div class="schublade" id="einstschublade">
  <div class="fkopf">
    <h2 data-t="k.einstellungen"></h2>
    <button class="blank" onclick="einstZu()">✕</button>
  </div>
  <div class="fleib" id="einstleib"></div>
</div>

<!-- ── Keyboard help ────────────────────────────────────────────────────── -->
<div class="dunkel" id="dunkel3" onclick="hilfeZu()"></div>
<div class="fenster" id="hilfefenster" style="width:min(40rem,94vw)">
  <div class="fkopf"><h2 data-t="k.tastenhilfe"></h2>
    <button class="blank" onclick="hilfeZu()">✕</button></div>
  <div class="fleib"><div class="tastenliste" id="tastenliste"></div></div>
</div>

<div class="melde" id="melde"></div>

<script>
/*SPRACHE*/
/* Same fallback as on the watchman page, for the same reason: `var T` would
   collide with the substituted `const T` and that is a PARSE error — the page
   then looks almost normal and not one button works. */
if (typeof T === "undefined") {
  globalThis.T = {};
  globalThis.LANG = "de";
  globalThis.SPRACHEN = [["de", "Deutsch"]];
}
/* ── Day and night ─────────────────────────────────────────────────────────
   TWO positions, one button: night and day. 🔴 And night is the DEFAULT — not
   „automatic", not what the device happens to say. A third position nobody asked
   for is a switch you have to press twice to understand, and a house this dark
   should not hand a light page to somebody who never chose one.
   🔑 The choice lives on the DEVICE, not in the mailbox: a phone in a dark room
   and a desk in the sun are two different answers to the same question, and one
   setting on the server can only ever give one of them.
   🔴 NOT called `ANSICHTEN`: on the watchman page that word is already the list
   of tabs, and a second `const` of the same name is a PARSE error that kills the
   whole script — while the page still draws its markup and looks perfectly
   normal. All three pages use the same names, so the word stays free here too. */
const LICHT_WAHLEN = ["dunkel", "hell"];
const LICHT_ZEICHEN = {dunkel:"☾", hell:"☀"};
/* 🔴 Keys SPELLED OUT, never assembled from the state: assembled, no literal
   exists anywhere, and the language bench can neither find a typo in it nor see
   that the key is in use. */
const LICHT_WORT = {dunkel:"allg.ansicht_dunkel", hell:"allg.ansicht_hell"};
/* 🔴 ONE variable holds the choice. Read it out of the store on every question
   and a `?licht=` in the address would win for ever — the button would write
   and write and nothing would move. */
let LICHT_WAHL = (function(){
  try{
    const auf = new URLSearchParams(location.search).get("licht");
    if(LICHT_WAHLEN.indexOf(auf) >= 0) return auf;
  }catch(e){ /* no parameter, no matter */ }
  try{
    const w = localStorage.getItem("pw_licht");
    if(LICHT_WAHLEN.indexOf(w) >= 0) return w;
  }catch(e){ /* a browser may refuse the store — then it stays night */ }
  return "dunkel";
})();
function istHell(){ return LICHT_WAHL === "hell"; }
function lichtAnwenden(neuzeichnen){
  const wurzel = document.documentElement;
  if(istHell()) wurzel.setAttribute("data-hell", "1");
  else wurzel.removeAttribute("data-hell");
  const grund = getComputedStyle(wurzel).getPropertyValue("--grund").trim();
  const marke = document.querySelector('meta[name="theme-color"]');
  if(marke && grund) marke.setAttribute("content", grund);
  const knopf = document.getElementById("lichttaste");
  if(knopf){
    knopf.textContent = LICHT_ZEICHEN[LICHT_WAHL];
    knopf.title = txt(LICHT_WORT[LICHT_WAHL]);
    knopf.setAttribute("aria-label", knopf.title);
  }
  /* 🔑 The letter is a document of its own inside the frame, with a stylesheet
     built by the ENGINE. It cannot be repainted from out here — so it is asked
     for again. One request, for something somebody pressed on purpose. */
  if(neuzeichnen && S.uid) mailOeffnen(S.uid, offenOrdner());
}
function lichtUm(){
  LICHT_WAHL = LICHT_WAHL === "hell" ? "dunkel" : "hell";
  try{ localStorage.setItem("pw_licht", LICHT_WAHL); }catch(e){}
  lichtAnwenden(true);
}

function txt(schluessel, werte){
  let s = T[schluessel];
  if(s === undefined) return schluessel;
  if(werte) for(const k in werte) s = s.split("{" + k + "}").join(werte[k]);
  return s;
}
function textenSetzen(wurzel){
  (wurzel || document).querySelectorAll("[data-t]").forEach(el => {
    el.textContent = txt(el.dataset.t); });
  (wurzel || document).querySelectorAll("[data-t-titel]").forEach(el => {
    el.title = txt(el.dataset.tTitel); });
  (wurzel || document).querySelectorAll("[data-t-platzhalter]").forEach(el => {
    el.placeholder = txt(el.dataset.tPlatzhalter); });
  (wurzel || document).querySelectorAll("[data-t-html]").forEach(el => {
    el.innerHTML = txt(el.dataset.tHtml); });
  (wurzel || document).querySelectorAll("[data-t-aria]").forEach(el => {
    el.setAttribute("aria-label", txt(el.dataset.tAria)); });
}
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
function esc(s){ return String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

/* ── State ─────────────────────────────────────────────────────────────────
   One object. Every drawing function reads from here and nowhere else — with the
   state spread over the DOM, the list and the reading pane drift apart, and it
   shows up as „the wrong mail opened". */
const S = {
  pf:"", ordner:"INBOX", seite:1, sieb:"", suche:"", feld:"alle",
  sortierung:"datum", richtung:"ab", pro:50,
  mails:[], uid:0, offen:null, gewaehlt:new Set(),
  ordner_liste:[], rollen:{}, einst:{}, faehig:{}, postfaecher:[],
  zu:new Set(),            // collapsed folder branches
  /* 🔑 „New" is where a session starts, not the inbox — every fresh
     connection opens there instead of on the inbox.
     The reason sits in the watchman itself: it moves new mail OUT of the inbox
     into a dozen folders, so somebody who lands in the inbox is looking at the
     one place that does NOT show what has arrived. The choice lasts for the
     session — open a folder and you stay there, and ⟳ does not pull you back
     either; only a fresh connection starts at „New" again. */
  neu:true,                // the „New" view instead of a folder
  neu_gesamt:0, neu_gekuerzt:false, neu_ordner:0,
  oberflaeche:[],          // how the settings are described — comes from the engine
  lesemarke:null,          // the timer for „mark read after N seconds"
  laeuft:false, version:""
};

/* 🔴 `bleibt` is for the things that TAKE time. Moving a folder is one server
   command, but the server may be carrying two thousand mails while it runs —
   and a page that says nothing until it is over looks broken. There is no
   progress to report (the command reports none), so what is shown is the
   honest thing: what is happening, and that it can take a while. */
function melde(text, gut, bleibt){
  const m = $("#melde");
  m.innerHTML = (bleibt ? '<span class="laedt"></span> ' : "") + esc(text);
  m.className = "melde auf" + (gut === false ? " schlecht" : (gut ? " gut" : ""));
  clearTimeout(m._t);
  if(!bleibt) m._t = setTimeout(() => m.className = "melde", 5000);
}

async function sende(aktion, daten){
  const r = await fetch("/api/" + aktion, {method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify(Object.assign({pf: S.pf}, daten || {}))});
  const a = await r.json().catch(() => ({ok:false, text:"HTTP " + r.status}));
  /* 🔴 A session can expire while the page is open. Then EVERY answer says
     „locked" — and the page has to go back to the door instead of drawing empty
     lists and letting the reader think the mailbox is empty. */
  if(a && a.gesperrt){ torZeigen({wort:true, an:false}); throw new Error("gesperrt"); }
  return a;
}

/* ── Small dressing ──────────────────────────────────────────────────────── */
function initialen(name, adresse){
  const s = (name || adresse || "?").trim();
  const teile = s.replace(/[<>"]/g,"").split(/[\s.@_-]+/).filter(Boolean);
  if(!teile.length) return "?";
  if(teile.length === 1) return teile[0].slice(0,2).toUpperCase();
  return (teile[0][0] + teile[1][0]).toUpperCase();
}
/* The colour follows the ADDRESS, so the same sender always has the same one —
   after two days you recognise the circle before you have read the name. */
function farbe(adresse){
  let h = 0;
  const s = String(adresse || "");
  for(let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360;
  return "hsl(" + h + " 52% 63%)";
}
function gr(b){
  b = Number(b || 0);
  if(b >= 1048576) return (b/1048576).toFixed(1).replace(".0","") + " MB";
  if(b >= 1024) return Math.round(b/1024) + " kB";
  return b + " B";
}
/* „14:32" for today, „gestern 09:14", „Mo. 12:04" this week, otherwise the date.
   A column full of identical dates says nothing; this one says how old it is. */
function wann(iso){
  if(!iso) return "";
  const d = new Date(iso);
  if(isNaN(d)) return String(iso).slice(0,10);
  const jetzt = new Date();
  const tag = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  /* 🔴 The setting decides, not the language. With LANG „en" the locale default
     is 12 hours — and whoever set „24 hours" watched it be ignored. Seen in the
     screenshot: „09:44 AM" on a page set to 24. */
  const uhrform = {hour:"2-digit", minute:"2-digit"};
  if(S.einst && S.einst.zeitform) uhrform.hour12 = (S.einst.zeitform === "12");
  const uhr = d.toLocaleTimeString(LANG, uhrform);
  const tage = Math.round((tag(jetzt) - tag(d)) / 86400000);
  if(tage === 0) return uhr;
  if(tage === 1) return txt("k.gestern") + " " + uhr;
  if(tage < 7) return d.toLocaleDateString(LANG, {weekday:"short"}) + " " + uhr;
  if(d.getFullYear() === jetzt.getFullYear())
    return d.toLocaleDateString(LANG, {day:"2-digit", month:"2-digit"});
  return d.toLocaleDateString(LANG, {day:"2-digit", month:"2-digit", year:"numeric"});
}
function langesDatum(iso){
  if(!iso) return "";
  const d = new Date(iso);
  if(isNaN(d)) return String(iso);
  const form = {weekday:"short", day:"2-digit", month:"short", year:"numeric",
                hour:"2-digit", minute:"2-digit"};
  if(S.einst && S.einst.zeitform) form.hour12 = (S.einst.zeitform === "12");
  return d.toLocaleString(LANG, form);
}
function blick(was){ document.body.dataset.blick = was; }

/* ── The door ──────────────────────────────────────────────────────────────
   🔴 The page starts CLOSED. Not „open and then check": between drawing and the
   answer lies exactly the moment in which an inbox stands on the screen for
   anyone. */
function torZeigen(schloss){
  $("#tor").classList.add("auf");
  $("#app").hidden = true;
  const kein = !schloss.wort;
  $("#tor_neu").hidden = !kein;
  $("#tor_an").hidden = kein;
  /* 🔴 Both keys SPELLED OUT, never a condition INSIDE the call. To find German
     sentences, the language test bench cuts the literal key out of a translation
     call — written the other way round it sees a bare call and reads the two keys
     as prose. The same note stands in `post_web.py`; it holds for every page.
     (And this comment may not contain such a call either: section 3 reads the
     page as it is and would look the key up. Found exactly that way.) */
  $("#tor_text").textContent = kein ? txt("k.tor_kein_wort") : txt("k.tor_text");
  $("#tor_fuss").textContent = kein ? txt("k.tor_fuss_neu") : txt("k.tor_fuss");
  setTimeout(() => (kein ? $("#tor_wort1") : $("#tor_wort")).focus(), 60);
}
function torWeg(){
  $("#tor").classList.remove("auf");
  $("#app").hidden = false;
}
async function wortSetzen(){
  const a = $("#tor_wort1").value, b = $("#tor_wort2").value;
  if(a.length < 8) return melde(txt("k.wort_kurz"), false);
  if(a !== b) return melde(txt("k.wort_ungleich"), false);
  const r = await sende("klient_wort", {neu:a});
  melde(r.text, r.ok);
  if(r.ok){ $("#tor_wort1").value = $("#tor_wort2").value = ""; torZeigen({wort:true}); }
}
async function anmelden(){
  const wort = $("#tor_wort").value;
  if(!wort) return;
  const r = await sende("klient_anmelden", {wort:wort});
  if(!r.ok) return melde(r.text, false);
  $("#tor_wort").value = "";
  torWeg();
  await allesLaden(true);
  /* Came here from the locked watchman page? Then that is where we go back to. */
  const zurueck = new URLSearchParams(location.search).get("zurueck");
  if(zurueck) location.href = zurueck;
}
async function abmelden(){
  const r = await sende("klient_abmelden", {});
  melde(r.text, true);
  torZeigen({wort:true, an:false});
}

/* ── Loading ───────────────────────────────────────────────────────────────── */
async function allesLaden(frisch){
  if(S.laeuft) return;
  S.laeuft = true;
  try{
    const l = await sende("klient_lage", {});
    if(!l.schloss || !l.schloss.an){ torZeigen(l.schloss || {wort:false}); return; }
    torWeg();
    if(l.ok === false && l.text) melde(l.text, false);
    S.einst = l.einst || {};
    S.oberflaeche = l.oberflaeche || S.oberflaeche || [];
    S.ordner_liste = l.ordner || [];
    S.rollen = l.rollen || {};
    S.faehig = l.faehig || {};
    S.postfaecher = l.postfaecher || [];
    S.pf = l.pf || S.pf;
    S.version = l.version || "";
    S.smtp = l.smtp || {};
    einstAnwenden();
    if(!S.ordner || !S.ordner_liste.some(o => o.name === S.ordner))
      S.ordner = S.rollen.posteingang || (S.ordner_liste[0] || {}).name || "INBOX";
    $("#pfname").textContent = l.adresse || "";
    const wahl = $("#pfwahl");
    wahl.hidden = S.postfaecher.length < 2;
    wahl.innerHTML = S.postfaecher.map(p =>
      `<option value="${esc(p.id)}"${p.id === S.pf ? " selected" : ""}>${esc(p.name)}</option>`).join("");
    ordnerMalen();
    await ladeListe(frisch);
  }catch(e){
    if(String(e.message) !== "gesperrt") melde(txt("k.keine_verbindung"), false);
  }finally{ S.laeuft = false; }
}

/* Settings that change the LOOK are applied to the frame, not to every row —
   one attribute on the body, and the CSS does the rest. */
function einstAnwenden(){
  const e = S.einst;
  document.body.dataset.dichte = e.dichte || "bequem";
  $("#raum").dataset.vorschau = e.vorschau || "rechts";
  document.documentElement.style.setProperty("--schrift", (e.schrift || 100) + "%");
  S.pro = e.pro_seite || 50;
  if(!S.sieb && e.nur_ungelesen) S.sieb = "ungelesen";
  S.sortierung = S.sortierung || e.sortierung;
  S.richtung = S.richtung || e.richtung;
  $("#sieb").value = S.sieb;
  $("#sortierung").value = S.sortierung;
  $("#sortierung").disabled = !S.faehig.sort && S.sortierung === "datum";
  $("#richtung").textContent = S.richtung === "ab" ? "↓" : "↑";
}

/* ── Folder tree ───────────────────────────────────────────────────────────── */
function ordnerMalen(){
  const liste = S.ordner_liste;
  const teile = [];
  const sonder = liste.filter(o => o.rolle);
  const rest = liste.filter(o => !o.rolle);
  /* 🔑 The depth is measured from the shallowest OWN folder, not from the root.
     Almost every one of them sits under INBOX, so the absolute depth starts at
     one — and the whole tree would hang one step in from the left with nothing
     in that step. */
  const grund = rest.length ? Math.min(...rest.map(o => o.tiefe)) : 0;
  /* 🔑 The special folders are ROLES, not a hierarchy — and on most servers they
     are all called `INBOX.something`, so a fold triangle would appear on the
     inbox and collapsing it would take every own folder with it. In that block
     nothing folds; the empty slot keeps the icons in one line. */
  const zeile = (o, tief, faltbar) => {
    const eltern = elternWeg(o);
    if(faltbar && eltern.some(p => S.zu.has(p))) return "";
    const kinder = faltbar && hatKinder(o, rest);
    const falt = kinder
      ? `<span class="ofalt ${S.zu.has(o.name) ? "zu" : ""}"
             onclick="faltenUm(event,'${escJs(o.name)}')">▾</span>`
      : `<span class="ofalt"></span>`;
    /* 🔑 Draggable, and at the same time a target: a folder can be carried
       somewhere else, and mail can be carried INTO it. A special folder is a
       position, not a drawer — it does not travel, but post may land in it. */
    return `<div class="o ${tief > 0 ? "unter" : ""} ${kinder ? "eltern" : ""}
        ${(!S.neu && o.name === S.ordner) ? "an" : ""}" tabindex="0"
        style="--tief:${tief}"
        ${o.rolle ? "" : 'draggable="true"'}
        ondragstart="ordnerZiehStart(event,'${escJs(o.name)}')"
        ondragend="ziehEnde()"
        ondragover="ziehUeber(event,this,'${escJs(o.name)}',${o.rolle ? 1 : 0})"
        ondragleave="this.classList.remove('ziel')"
        ondrop="ziehAb(event,this,'${escJs(o.name)}',${o.rolle ? 1 : 0})"
        onclick="ordnerWaehlen('${escJs(o.name)}')"
        onkeydown="if(event.key==='Enter')ordnerWaehlen('${escJs(o.name)}')"
        title="${esc(o.pfad)} — ${o.gesamt} ${esc(txt("k.mails"))}">
      ${falt}<span class="ic ${o.ungelesen ? "atmet" : ""}">${o.icon || "📁"}</span>
      <span class="nm">${esc(ordnerName(o))}</span>
      ${o.ungelesen ? `<span class="u">${o.ungelesen}</span>`
                    : `<span class="n">${o.gesamt || ""}</span>`}
      ${o.rolle ? "" : `<button class="blank ordnerweg" tabindex="-1"
        onclick="ordnerFort(event,'${escJs(o.name)}')"
        title="${esc(txt("k.ordner_loeschen"))}"
        aria-label="${esc(txt("k.ordner_loeschen"))}">✕</button>`}
    </div>`;
  };
  const offen = neuZahl();
  teile.push(`<div class="obaum">
    <div class="o neu ${S.neu ? "an" : ""}" tabindex="0" onclick="neuWaehlen()"
         onkeydown="if(event.key==='Enter')neuWaehlen()"
         title="${esc(txt("k.neu_hilfe"))}">
      <span class="ofalt"></span><span class="ic">✨</span>
      <span class="nm">${esc(txt("k.neu"))}</span>
      ${offen ? `<span class="u">${offen}</span>` : ""}
    </div>
  </div>`);
  teile.push(`<div class="obaum">${sonder.map(o => zeile(o, 0, false)).join("")}</div>`);
  if(rest.length){
    /* The heading is the target for „to the top": a folder that has to come
       OUT of a branch needs a place to be dropped, and there is no row for the
       level above the first one. It also carries the one control that works on
       the WHOLE tree. */
    const faltbare = rest.filter(o => hatKinder(o, rest)).map(o => o.name);
    /* 🔑 ONE button, and the STATE decides which of the two things it offers:
       as long as anything is open it closes everything, and only when everything
       is closed does it open it again. A pair of buttons would leave one of them
       doing nothing half the time. */
    const allesZu = faltbare.length > 0 && faltbare.every(n => S.zu.has(n));
    teile.push(`<div class="ogruppe" ondragover="ziehUeber(event,this,'',0)"
      ondragleave="this.classList.remove('ziel')"
      ondrop="ziehAb(event,this,'',0)"><span>${esc(txt("k.eigene_ordner"))}</span>
      ${faltbare.length ? `<button class="blank falttaste"
        onclick="alleFalten(${allesZu ? "false" : "true"})"
        title="${esc(txt(allesZu ? "k.alle_auf" : "k.alle_zu"))}"
        aria-label="${esc(txt(allesZu ? "k.alle_auf" : "k.alle_zu"))}"
        >${allesZu ? "⊞" : "⊟"}</button>` : ""}</div>`);
    /* 🔑 One branch per top-level folder, with air between the branches. A flat
       run of rows leaves the reader counting indents to see where one family
       ends and the next begins. */
    let zweig = [];
    for(const o of rest){
      const tief = o.tiefe - grund;
      if(tief === 0 && zweig.length){
        teile.push(`<div class="ozweig">${zweig.join("")}</div>`);
        zweig = [];
      }
      zweig.push(zeile(o, tief, true));
    }
    if(zweig.length) teile.push(`<div class="ozweig">${zweig.join("")}</div>`);
  }
  teile.push(`<div style="padding:.7rem .55rem 0">
    <button class="blank kleiner" onclick="ordnerNeu()">＋ ${esc(txt("k.ordner_neu"))}</button>
  </div>`);
  $("#ordner").innerHTML = teile.join("");
  const ziel = $("#stapel_ziel");
  ziel.innerHTML = `<option value="">${esc(txt("k.verschieben_nach"))}</option>` +
    liste.filter(o => o.waehlbar).map(o =>
      `<option value="${esc(o.name)}">${"·".repeat(o.tiefe)} ${esc(o.zeige)}</option>`).join("");
}
/* 🔴 „INBOX" is a word from the protocol, not a name a person gave a folder.
   Every other folder is called what the server calls it — that IS the truth, and
   a German mailbox really does have „Gesendet". Only this one is translated. */
function ordnerName(o){
  return (o.name.toUpperCase() === "INBOX") ? txt("k.posteingang") : o.zeige;
}
function hatKinder(o, liste){
  const tr = S.faehig.trenner || ".";
  return liste.some(x => x !== o && x.name.startsWith(o.name + tr));
}
/* How many unread mails the „New" view would show — out of the counts the tree
   already carries, so it costs nothing. The folders it leaves out are the ones
   the view leaves out. */
function neuZahl(){
  return S.ordner_liste.reduce((n, o) => {
    if(!o.waehlbar || o.rolle === "papierkorb" || o.rolle === "entwuerfe") return n;
    if(o.rolle === "spam" && !S.einst.neu_spam) return n;
    return n + (o.ungelesen || 0);
  }, 0);
}
function elternWeg(o){
  const tr = S.faehig.trenner || ".";
  const teile = o.name.split(tr);
  return teile.slice(0, -1).map((_, i) => teile.slice(0, i + 1).join(tr));
}
function escJs(s){ return String(s).replace(/\\/g,"\\\\").replace(/'/g,"\\'"); }
function faltenUm(ev, name){
  ev.stopPropagation();
  S.zu.has(name) ? S.zu.delete(name) : S.zu.add(name);
  ordnerMalen();
}
/* Everything at once. 🔴 Only folders that HAVE children are remembered as
   closed: putting a childless one in there would leave a name in the set that
   nothing ever takes out again, and the button would then never offer „open
   all" once more. */
function alleFalten(zu){
  S.zu.clear();
  if(zu) for(const o of S.ordner_liste)
    if(!o.rolle && hatKinder(o, S.ordner_liste.filter(x => !x.rolle))) S.zu.add(o.name);
  ordnerMalen();
}
async function ordnerWaehlen(name){
  S.neu = false;
  S.ordner = name; S.seite = 1; S.gewaehlt.clear(); S.uid = 0; S.offen = null;
  leseLeeren();
  ordnerMalen();
  blick("liste");
  await ladeListe(false);
}
/* 🔑 The view the watchman makes necessary. It moves new mail out of the inbox
   and does it well — and exactly because of that „what came in" is no longer one
   folder but twelve. Here they are one list again, with the folder written next
   to every line. */
async function neuWaehlen(){
  S.neu = true;
  S.seite = 1; S.gewaehlt.clear(); S.uid = 0; S.offen = null;
  leseLeeren();
  ordnerMalen();
  blick("liste");
  await ladeListe(true);
}
/* Which folder a row really lives in. In a folder that is the folder; in the
   „New" view every row can answer differently, and EVERY action asks here
   instead of assuming. */
/* The folder of the mail that is OPEN — the server says so in its answer, and in
   the „New" view that is the only one who knows. */
function offenOrdner(){
  return (S.offen && S.offen.ordner) || S.ordner;
}
function ordnerVon(uid){
  /* 🔴 The open mail answers for itself. Searching the list by number finds the
     FIRST row with that number — and in the „New" view the same number stands in
     three folders, so the answer would be right by luck. */
  if(S.offen && S.offen.uid === uid && S.offen.ordner) return S.offen.ordner;
  const m = S.mails.find(x => x.uid === uid);
  return (m && m.ordner) || S.ordner;
}
/* 🔴 A UID is unique inside ITS FOLDER and nowhere else. Keyed by UID alone, one
   tick in the „New" view marked three rows — the same number 101 exists in the
   inbox, in House and in People. The key of a chosen mail is therefore folder
   AND number, and every action works on (folder, number) pairs. Measured: three
   ticks drawn from one click. */
function wahlSchluessel(m){
  return (m.ordner || S.ordner) + "\u0000" + m.uid;
}
function gewaehlteMails(){
  return S.mails.filter(m => S.gewaehlt.has(wahlSchluessel(m)));
}
/* What an action really works on. Given numbers (one open mail, a keyboard
   shortcut) it asks the row for the folder; given nothing it takes the
   selection, which carries its folders with it.

   🔴 And it reads the selection from the KEYS, not from the rows on screen.
   Built from `S.mails` it could only ever act on the page in front of it — a
   tick on page 1 was silently dropped the moment page 2 was open, and „select
   everything in this folder" would have acted on the visible fifty. The key
   already carries folder AND number; nothing else is needed. */
function posten(uids){
  if(uids && uids.length)
    return uids.map(u => ({ordner: ordnerVon(u), uid: u}));
  return [...S.gewaehlt].map(k => {
    const i = k.indexOf("\u0000");
    return {ordner: k.slice(0, i), uid: parseInt(k.slice(i + 1), 10)};
  }).filter(p => p.ordner && p.uid);
}
/* Grouped by folder. In a normal folder that is exactly one group and exactly
   one request — the same behaviour as before.

   🔴 Now that a selection reaches across pages, a group can hold THOUSANDS
   of numbers. One request over all of them would run for minutes, and a
   browser that loses patience halfway leaves a state nobody knows. So every
   group is cut into pieces as well: each request stays short, and between two
   pieces you can see how far it has got. */
const STAPEL_STUECK = 500;
function nachOrdnern(liste){
  const karte = new Map();
  for(const p of liste){
    if(!karte.has(p.ordner)) karte.set(p.ordner, []);
    karte.get(p.ordner).push(p.uid);
  }
  const raus = [];
  for(const [ordner, uids] of karte)
    for(let i = 0; i < uids.length; i += STAPEL_STUECK)
      raus.push([ordner, uids.slice(i, i + STAPEL_STUECK)]);
  return raus;
}
/* Progress shown only when there is a lot of it — for twenty mails it would
   be noise. `melde` is the same line that carries the result. */
function stapelFortschritt(getan, gesamt){
  if(gesamt > STAPEL_STUECK)
    melde(txt("k.stapel_laeuft", {n:getan.toLocaleString(LANG),
                                  g:gesamt.toLocaleString(LANG)}), true);
}
async function ordnerNeu(){
  const name = prompt(txt("k.ordner_name"));
  if(!name) return;
  const r = await sende("klient_ordner_neu", {name:name});
  melde(r.text || (r.ok ? "" : txt("k.ging_nicht")), r.ok);
  if(r.ok) await allesLaden(true);
}
async function postfachWechseln(id){
  S.pf = id; S.ordner = ""; S.seite = 1; S.uid = 0; S.offen = null;
  S.gewaehlt.clear(); leseLeeren();
  await allesLaden(true);
}
</script>

<script>
/* ── The list ──────────────────────────────────────────────────────────────── */
async function ladeListe(frisch){
  const r = $("#rollen");
  const stand = r.scrollTop;
  if(!S.mails.length) $("#zeilen").innerHTML = ladebalken(8);
  let a;
  try{
    a = S.neu
      ? await sende("klient_neu", {})
      : await sende("klient_liste", {ordner:S.ordner, seite:S.seite, sieb:S.sieb,
          suche:S.suche, feld:S.feld, sortierung:S.sortierung, richtung:S.richtung,
          pro_seite:S.pro});
  }catch(e){ return; }
  if(!a || a.ok === false){ melde((a && a.text) || txt("k.ging_nicht"), false); return; }
  S.mails = a.mails || [];
  if(S.neu){
    S.seite = 1; S.seiten = 1; S.sortiert = true;
    S.gesamt = a.mails ? a.mails.length : 0;
    S.neu_gesamt = a.gesamt || 0;
    S.neu_gekuerzt = !!a.gekuerzt;
    S.neu_ordner = a.ordner || 0;
  }else{
    S.seite = a.seite || 1;
    S.seiten = a.seiten || 1;
    S.gesamt = a.gesamt || 0;
    S.sortiert = a.sortiert !== false;
  }
  listeMalen();
  if(frisch) r.scrollTop = 0; else r.scrollTop = stand;
  ordnerZahlAktualisieren(a.ordner_gesamt, a.ordner_ungelesen);
}
function ladebalken(n){
  return Array.from({length:n}, () => `<div class="z" style="pointer-events:none">
    <span></span><span class="kreis" style="background:var(--karte2)"></span>
    <div class="kopfz" style="display:block">
      <div style="height:.7rem;width:8rem;background:var(--karte2);border-radius:4px"></div>
      <div style="height:.6rem;width:14rem;background:var(--karte);border-radius:4px;
                  margin-top:.35rem"></div></div><span></span></div>`).join("");
}
function ordnerZahlAktualisieren(gesamt, ungelesen, ordner){
  const o = S.ordner_liste.find(x => x.name === (ordner || S.ordner));
  if(!o) return;
  if(typeof gesamt === "number") o.gesamt = gesamt;
  if(typeof ungelesen === "number") o.ungelesen = ungelesen;
  ordnerMalen();
}

function listeMalen(){
  const z = $("#zeilen"), leer = $("#listeleer");
  if(!S.mails.length){
    z.innerHTML = "";
    leer.hidden = false;
    leer.innerHTML = S.neu
      ? `<div><span class="gross">✨</span>${esc(txt("k.nichts_neu"))}</div>`
      : `<div><span class="gross">${S.suche ? "🔍" : "📭"}</span>
      ${esc(txt(S.suche ? "k.nichts_gefunden" : (S.sieb ? "k.nichts_im_sieb" : "k.ordner_leer")))}</div>`;
    spanneMalen();
    return;
  }
  leer.hidden = true;
  const eng = (S.einst.dichte === "eng");
  let vorher = "";
  z.innerHTML = S.mails.map((m, i) => {
    const gleich = S.einst.strang && m.strang && m.strang === vorher;
    vorher = m.strang || "";
    const gewaehlt = S.gewaehlt.has(wahlSchluessel(m));
    const wer = S.einst.absender_zeigen === "adresse" ? m.adresse
              : S.einst.absender_zeigen === "beides"
                ? (m.von || "") + " · " + (m.adresse || "") : (m.von || m.adresse);
    const dritte = zweitzeile(m);
    /* In the „New" view the one thing every row has to answer is WHERE it is
       now — that is the whole point of gathering it. */
    const ort = (S.neu && m.ordner_kurz)
      ? `<span class="ort" title="${esc(m.ordner_zeige || "")}"
              >📁 ${esc(ordnerKurz(m))}</span>` : "";
    const zeichen = [
      m.markiert ? '<span class="stern">★</span>' : "",
      m.beantwortet ? "<span>↩</span>" : "",
      m.anhang ? '<span title="' + esc(txt("k.anhang")) + '">📎</span>' : "",
      m.abmelden ? '<span title="' + esc(txt("k.newsletter")) + '">📰</span>' : "",
      !m.gelesen ? '<span class="punkt"></span>' : ""
    ].filter(Boolean).join("");
    return `<div class="z ${m.gelesen ? "" : "neu"} ${m.uid === S.uid ? "an" : ""}
        ${gewaehlt ? "gewaehlt" : ""} ${m.geloescht ? "weg" : ""} ${gleich ? "antwort" : ""}"
        data-uid="${m.uid}" data-i="${i}" tabindex="0" draggable="true"
        ondragstart="mailZiehStart(event,${i})" ondragend="ziehEnde()"
        onclick="zeileKlick(event,${m.uid},${i})"
        onkeydown="if(event.key==='Enter')mailOeffnen(${m.uid},'${escJs(m.ordner || "")}')">
      <input type="checkbox" class="haken" ${gewaehlt ? "checked" : ""}
             onclick="event.stopPropagation();wahlUm(${m.uid},${i},event.shiftKey)">
      <span class="kreis" style="background:${farbe(m.adresse)}"
            >${esc(initialen(m.von, m.adresse))}</span>
      <span class="von" title="${esc(m.adresse)}">${esc(wer)}</span>
      <span class="wann">${esc(wann(m.zeit))}</span>
      <span class="bet">${esc(m.betreff || txt("k.ohne_betreff"))}</span>
      <span class="zeichen">${ort}${zeichen}</span>
      ${(!eng && S.einst.vorschautext && dritte) ? `<span class="aus">${
        esc(dritte)}</span>` : ""}
    </div>`;
  }).join("");
  spanneMalen();
  wahlLeisteMalen();
}
/* The third line of a row: the first words of the letter itself. That is what
   makes a list worth reading — sender and subject tell you who and about what,
   the excerpt tells you whether it can wait.

   🔴 Where there is none — a mail that is only an attachment, or a folder whose
   excerpts were not asked for — the row says what else is worth knowing instead
   of leaving a gap. And „To Rosa Marlow" under every row of the INBOX is not
   it: of course it is to me. In the sent folder the recipient is the opposite,
   the only interesting name. */
/* „INBOX" is the protocol's word — in this one place it gets the reader's. */
function ordnerKurz(m){
  return (m.ordner || "").toUpperCase() === "INBOX" ? txt("k.posteingang")
                                                    : (m.ordner_kurz || "");
}
function zweitzeile(m){
  if(m.auszug) return m.auszug;
  const raus = [];
  const gesendet = [S.rollen.gesendet, S.rollen.entwuerfe].includes(m.ordner || S.ordner);
  if(gesendet && m.an) raus.push(txt("k.an") + ": " + m.an);
  else if(m.adresse) raus.push(m.adresse);
  if(m.groesse) raus.push(gr(m.groesse));
  return raus.join(" · ");
}
/* 🔴 ONE place decides what stands in the toolbar. It used to be two — this one
   and `wahlLeisteMalen()` — and the second one ran last, so the „New" view drew
   its own controls and got the folder controls back on top of them a
   millisecond later. Two places saying the same thing means the one you did not
   change is the one that wins. */
function werkzeugMalen(){
  const n = S.gewaehlt.size;
  $("#wahltasten").style.display = n ? "flex" : "none";
  $("#siebtasten").style.display = (n || S.neu) ? "none" : "flex";
  $("#neutasten").style.display = (!n && S.neu) ? "flex" : "none";
  // Paging is a folder's idea. „New" is one glance.
  $("#zurueck").hidden = $("#weiter").hidden = S.neu;
  const w = $("#neu_zeitraum");
  if(S.neu && w && !w.options.length){
    /* Out of the ONE description in the engine, like every other setting — a
       second list of the same positions is a second list that goes stale. */
    const feld = (S.oberflaeche || []).flatMap(g => g.felder || [])
                                      .find(f => f.s === "neu_zeitraum");
    w.innerHTML = ((feld && feld.optionen) || []).map(([v, k]) =>
      `<option value="${esc(v)}">${esc(txt(k))}</option>`).join("");
  }
  if(w) w.value = S.einst.neu_zeitraum || "ungelesen";
}
function spanneMalen(){
  werkzeugMalen();
  /* The „New" view is one glance, not a stack of pages — it says how much it
     found and, honestly, when it had to cut. */
  if(S.neu){
    $("#spanne").textContent = S.mails.length
      ? txt("k.neu_spanne", {n:S.mails.length, o:S.neu_ordner}) : "";
    $("#zurueck").disabled = true;
    $("#weiter").disabled = true;
    const hinweis = $("#neuhinweis");
    if(hinweis){
      hinweis.hidden = !S.neu_gekuerzt;
      hinweis.textContent = S.neu_gekuerzt
        ? txt("k.neu_gekuerzt", {n:S.mails.length,
                                 g:S.neu_gesamt.toLocaleString(LANG)}) : "";
    }
    return;
  }
  const von = S.gesamt ? (S.seite - 1) * S.pro + 1 : 0;
  const bis = Math.min(S.gesamt, S.seite * S.pro);
  $("#spanne").textContent = S.gesamt
    ? txt("k.spanne", {von:von, bis:bis, n:S.gesamt.toLocaleString(LANG)}) : "";
  $("#zurueck").disabled = S.seite <= 1;
  $("#weiter").disabled = S.seite >= (S.seiten || 1);
}
async function blaettern(d){
  /* 🔑 The selection survives turning the page. It used to be tied to the
     page, which made more than one page at a time impossible. Changing the
     FOLDER, the search or the filter still clears it — there „chosen" means
     something else. */
  S.seite = Math.max(1, Math.min(S.seiten || 1, S.seite + d));
  await ladeListe(true);
}

/* ── Selection ─────────────────────────────────────────────────────────────
   🔴 A click on the row OPENS, a click on the box SELECTS. Two intentions on one
   row, and mixing them up means the reader marks a mail as read while trying to
   tick it. */
function zeileKlick(ev, uid, i){
  if(ev.metaKey || ev.ctrlKey){ wahlUm(uid, i, false); return; }
  if(ev.shiftKey){ wahlUm(uid, i, true); return; }
  mailOeffnen(uid, (S.mails[i] || {}).ordner);
}
function wahlUm(uid, i, bereich){
  if(bereich && S.letzteWahl != null){
    const [a, b] = [Math.min(S.letzteWahl, i), Math.max(S.letzteWahl, i)];
    for(let k = a; k <= b; k++) S.gewaehlt.add(wahlSchluessel(S.mails[k]));
  }else{
    const k = wahlSchluessel(S.mails[i] || {uid:uid});
    S.gewaehlt.has(k) ? S.gewaehlt.delete(k) : S.gewaehlt.add(k);
    S.letzteWahl = i;
  }
  listeMalen();
}
function alleWaehlen(an){
  S.gewaehlt.clear();
  if(an) S.mails.forEach(m => S.gewaehlt.add(wahlSchluessel(m)));
  listeMalen();
}
/* Everything the current view holds — not only the page.
   🔑 After a search, or with a filter on, „all" means every HIT and not the
   whole folder: the server returns the numbers of the very list the page is
   cut out of. One question, one answer. */
async function alleImOrdner(){
  if(S.neu){        // the „New" overview is already loaded in full
    S.mails.forEach(m => S.gewaehlt.add(wahlSchluessel(m)));
    return listeMalen();
  }
  const knopf = $("#alle_ordner");
  if(knopf) knopf.disabled = true;
  const r = await sende("klient_liste", {ordner:S.ordner, seite:S.seite,
      sieb:S.sieb, suche:S.suche, feld:S.feld, sortierung:S.sortierung,
      richtung:S.richtung, pro_seite:S.pro, alle_uids:true});
  if(knopf) knopf.disabled = false;
  if(!r || !r.ok || !r.alle_uids) return melde(txt("k.ging_nicht"), false);
  for(const u of r.alle_uids) S.gewaehlt.add(S.ordner + "\u0000" + u);
  listeMalen();
}
function auswahlWeg(){ S.gewaehlt.clear(); listeMalen(); }
function wahlLeisteMalen(){
  const n = S.gewaehlt.size;
  werkzeugMalen();
  $("#wahlzahl").textContent = n
    ? txt("k.gewaehlt", {n:n.toLocaleString(LANG)}) : "";
  /* 🔴 The box means the PAGE, not the selection: across pages more can be
     chosen than stand here, and then „n === rows" would never be true and the
     box would stay indeterminate for ever. So it asks whether every row on
     THIS page is chosen. */
  const aufSeite = S.mails.filter(m => S.gewaehlt.has(wahlSchluessel(m))).length;
  $("#alle_haken").checked = aufSeite > 0 && aufSeite === S.mails.length;
  $("#alle_haken").indeterminate = n > 0 && aufSeite < S.mails.length;
  document.body.classList.toggle("wahlmodus", n > 0);

  // „Select all N" appears only once the page is fully ticked and there is
  // more than that — before, it would be an offer without an occasion.
  const knopf = $("#alle_ordner"), weg = $("#auswahl_weg");
  const gesamt = S.neu ? S.mails.length : (S.gesamt || 0);
  const mehr = aufSeite > 0 && aufSeite === S.mails.length && n < gesamt;
  if(knopf){
    knopf.hidden = !mehr;
    knopf.textContent = txt("k.alle_im_ordner", {n:gesamt.toLocaleString(LANG)});
  }
  if(weg) weg.hidden = !(n > S.mails.length);
}

/* ── Acting ────────────────────────────────────────────────────────────────── */
/* 🔴 An action asks the ROW which folder it is in, never the view. In a folder
   that is one group and one request, exactly as before; in the „New" view the
   twelve rows on screen can live in six folders, and a single `S.ordner` would
   have flagged, moved or deleted the wrong mail in five of them. ONE place
   answers it: `nachOrdnern()`. */
async function stapel(was, an, uids){
  const liste = posten(uids);
  if(!liste.length) return melde(txt("k.nichts_gewaehlt"), false);
  let gut = true, fertig = 0;
  for(const [ordner, teil] of nachOrdnern(liste)){
    const r = await sende("klient_flaggen", {ordner:ordner, uids:teil, was:was, an:an});
    if(!r.ok){ gut = false; melde(r.text || txt("k.ging_nicht"), false); continue; }
    fertig += teil.length; stapelFortschritt(fertig, liste.length);
    if(was === "gelesen"){
      const o = S.ordner_liste.find(x => x.name === ordner);
      if(o) o.ungelesen = Math.max(0, (o.ungelesen || 0) + (an ? -teil.length : teil.length));
    }
  }
  if(!gut) return;
  uids = liste.map(p => p.uid);
  /* Do not refetch the whole list for a flag: the server has confirmed it, and a
     list that jumps after every click is a list you stop clicking in.
     🔴 By KEY, not by number: the same number exists in every folder, and
     `includes` over thousands inside a loop over the rows is one search too
     many anyway. */
  const bet = new Set(liste.map(p => p.ordner + "\u0000" + p.uid));
  S.mails.forEach(m => { if(bet.has(wahlSchluessel(m))) m[was] = an; });
  if(S.offen && bet.has(wahlSchluessel(S.offen))) S.offen[was] = an;
  listeMalen();
  if(was === "gelesen") ordnerMalen();
  if(S.offen && uids.includes(S.offen.uid)) leseKopfMalen();
}
async function stapelVerschieben(ziel, uids){
  if(!ziel) return;
  $("#stapel_ziel").value = "";
  return verschiebeListe(ziel, posten(uids));
}
/* 🔑 The same road for the toolbar and for a dragged row: one function that gets
   a LIST of (folder, number) — where that list came from is the caller's
   business, not this one's. */
async function verschiebeListe(ziel, liste){
  if(!liste.length) return melde(txt("k.nichts_gewaehlt"), false);
  let gut = true, zahl = 0, letzte = "";
  for(const [ordner, teil] of nachOrdnern(liste)){
    if(ordner === ziel){ continue; }        // already there — nothing to do
    const r = await sende("klient_verschieben", {ordner:ordner, uids:teil, ziel:ziel});
    if(r.ok){ zahl += teil.length; letzte = r.text || letzte;
              stapelFortschritt(zahl, liste.length); }
    else { gut = false; melde(r.text || txt("k.ging_nicht"), false); }
  }
  if(gut) melde(letzte, true);
  if(zahl) await nachTat(liste.map(p => p.uid), liste);
}
async function stapelLoeschen(uids, endgueltig){
  const liste = posten(uids);
  if(!liste.length) return melde(txt("k.nichts_gewaehlt"), false);
  uids = liste.map(p => p.uid);
  /* 🔴 One mail is not „1 mails". A count that reads as a sentence needs both
     forms — everywhere else the number stands at the end, where no form is
     needed at all. */
  const frage = uids.length === 1 ? txt("k.loeschen_sicher_eine")
                                  : txt("k.loeschen_sicher", {n:uids.length});
  if(S.einst.sicherheitsfrage && !confirm(frage)) return;
  let gut = true, letzte = "", fertig = 0;
  for(const [ordner, teil] of nachOrdnern(liste)){
    const r = await sende("klient_loeschen", {ordner:ordner, uids:teil,
                                              endgueltig:!!endgueltig});
    if(r.ok){ letzte = r.text || letzte;
              fertig += teil.length; stapelFortschritt(fertig, liste.length); }
    else { gut = false; melde(r.text || txt("k.ging_nicht"), false); }
  }
  if(gut){ melde(letzte, true); await nachTat(uids, liste); }
}
async function wieWache(uid, adresse){
  const r = await sende("klient_wie_wache", {ordner:ordnerVon(uid), uids:[uid],
                                             adresse:adresse});
  melde(r.text || (r.ok ? "" : txt("k.ging_nicht")), r.ok);
  if(r.ok) await nachTat([uid]);
}
/* ── Carrying things with the mouse ────────────────────────────────────────
   A whole folder travels by drag and drop, mail and all, and the watchman
   has to notice it for the sake of what it has learned.

   🔑 Two different things travel to the same targets: a handful of MAILS and a
   whole FOLDER. So one variable says what is in the air, and every target asks
   it — instead of two sets of handlers that would have to agree with each
   other. */
let ZIEHT = null;
function trenner(){ return S.faehig.trenner || "."; }
function mailZiehStart(ev, i){
  const m = S.mails[i];
  if(!m) return;
  /* 🔴 Dragging a row that is PART of the selection takes the whole selection;
     dragging one outside it takes that one alone and leaves the selection
     standing. Anything else and a careless drag moves fifty mails. */
  const liste = S.gewaehlt.has(wahlSchluessel(m))
    ? posten() : [{ordner: m.ordner || S.ordner, uid: m.uid}];
  ZIEHT = {art:"mails", liste:liste};
  try{
    ev.dataTransfer.effectAllowed = "move";
    ev.dataTransfer.setData("text/plain", String(liste.length));
  }catch(e){ /* a browser that refuses the clipboard still drags */ }
  document.body.classList.add("zieht");
}
function ordnerZiehStart(ev, name){
  ZIEHT = {art:"ordner", name:name};
  try{
    ev.dataTransfer.effectAllowed = "move";
    ev.dataTransfer.setData("text/plain", name);
  }catch(e){}
  document.body.classList.add("zieht");
}
function ziehEnde(){
  ZIEHT = null;
  ziehRollenAus();
  document.body.classList.remove("zieht");
  $$(".ziel").forEach(el => el.classList.remove("ziel"));
}
/* ── The column travels with you ───────────────────────────────────────────
   When a folder is dragged from the very bottom to the top, the list has to
   travel with it — on a long list the target would otherwise be out of reach.

   🔴 And it needs a TIMER, not a scroll step per event: `dragover` only fires
   while the pointer MOVES. Held still at the top edge — which is exactly what
   somebody does who is waiting for the list to come to them — not one more event
   arrives, and a single step per event would stop dead. */
let ZIEH_ROLLE = null;
const ZIEH_RAND = 70;        // how close to the edge it starts
function ziehRollen(ev){
  const feld = $("#ordner");
  if(!feld || !ZIEHT) return;
  const r = feld.getBoundingClientRect();
  let richtung = 0;
  if(ev.clientY < r.top + ZIEH_RAND) richtung = -1;
  else if(ev.clientY > r.bottom - ZIEH_RAND) richtung = 1;
  if(!richtung) return ziehRollenAus();
  if(ZIEH_ROLLE && ZIEH_ROLLE.richtung === richtung) return;
  ziehRollenAus();
  /* Nearer the edge is faster — the last centimetre is where somebody means
     „quickly now", and the middle of the field is where they mean „stop". */
  const tempo = () => {
    const weg = richtung < 0 ? ev.clientY - r.top : r.bottom - ev.clientY;
    return Math.max(6, Math.round((ZIEH_RAND - Math.max(0, weg)) / 3.5));
  };
  ZIEH_ROLLE = {richtung: richtung,
                takt: setInterval(() => { feld.scrollTop += richtung * tempo(); }, 16)};
}
function ziehRollenAus(){
  if(ZIEH_ROLLE) clearInterval(ZIEH_ROLLE.takt);
  ZIEH_ROLLE = null;
}
/* 🔴 A target that does not call `preventDefault` is NOT a target — that is how
   the browser is told „yes, this may be dropped here". So the same question is
   asked here that the drop will ask again: what is in the air, and does it
   belong here? */
function ziehUeber(ev, el, ziel, rolle){
  if(!ZIEHT) return;
  if(ZIEHT.art === "ordner"){
    if(rolle) return;                                   // a position, not a drawer
    if(!ziel && !S.ordner_liste.length) return;
    if(ziel === ZIEHT.name) return;                     // onto itself
    if(ziel && ziel.indexOf(ZIEHT.name + trenner()) === 0) return;  // into its own child
  }else if(!ziel){
    return;                                             // mail has no „top level"
  }
  ev.preventDefault();
  try{ ev.dataTransfer.dropEffect = "move"; }catch(e){}
  el.classList.add("ziel");
}
async function ziehAb(ev, el, ziel, rolle){
  ev.preventDefault();
  ziehRollenAus();
  el.classList.remove("ziel");
  const z = ZIEHT;
  ziehEnde();
  if(!z) return;
  if(z.art === "mails"){
    if(!ziel) return;
    return verschiebeListe(ziel, z.liste);
  }
  return ordnerZiehen(z.name, ziel);
}
/* 🔴 The only action in this client that cannot be taken back. So the engine
   is asked FIRST and refuses while it counts — the answer comes back with the
   number of mails in it, and only THAT number goes into the question. A dialog
   that says „delete?" without saying how much is a dialog people click away. */
async function ordnerFort(ev, name){
  ev.stopPropagation();
  const o = S.ordner_liste.find(x => x.name === name);
  if(!o) return;
  let r = await sende("klient_ordner_loeschen", {ordner:name});
  if(!r.ok && !r.frage) return melde(r.text || txt("k.ging_nicht"), false);
  const frage = r.frage
    ? txt("k.ordner_loeschen_inhalt", {o:ordnerName(o), n:r.mails.toLocaleString(LANG)})
    : txt("k.ordner_loeschen_frage", {o:ordnerName(o)});
  if(!confirm(frage)) return;
  S.laeuft = true;
  melde(txt("k.ordner_faellt", {o:ordnerName(o)}), null, true);
  try{ r = await sende("klient_ordner_loeschen", {ordner:name, mit_inhalt:true}); }
  catch(e){ S.laeuft = false; return melde("", null); }
  S.laeuft = false;
  melde(r.text || (r.ok ? "" : txt("k.ging_nicht")), r.ok);
  if(!r.ok) return;
  if(S.ordner === name) S.ordner = S.rollen.posteingang || "INBOX";
  S.zu.delete(name);
  await allesLaden(false);
}
async function ordnerZiehen(name, ziel){
  const o = S.ordner_liste.find(x => x.name === name);
  const zo = S.ordner_liste.find(x => x.name === ziel);
  if(!o) return;
  if(!confirm(txt("k.ordner_ziehen_frage", {o:ordnerName(o),
      ziel: zo ? ordnerName(zo) : txt("k.ordner_oben")}))) return;
  S.laeuft = true;
  melde(txt("k.ordner_zieht", {o:ordnerName(o)}), null, true);
  let r;
  try{ r = await sende("klient_ordner_ziehen", {ordner:name, ziel:ziel}); }
  catch(e){ S.laeuft = false; melde("", null); return; }
  S.laeuft = false;
  melde(r.text || (r.ok ? "" : txt("k.ging_nicht")), r.ok);
  if(!r.ok) return;
  /* 🔴 The move HAPPENED even when the watchman could not follow. Saying so is
     the only honest answer — and it names which half went wrong. */
  if(r.wache_fehler) melde(txt("k.wache_nicht_nachgezogen"), false);
  /* What was open may BE the folder that moved, or a child of it. */
  const t = r.trenner || trenner();
  if(S.ordner === r.alt) S.ordner = r.neu;
  else if(S.ordner.indexOf(r.alt + t) === 0) S.ordner = r.neu + S.ordner.slice(r.alt.length);
  if(S.zu.has(r.alt)){ S.zu.delete(r.alt); S.zu.add(r.neu); }
  await allesLaden(false);
  /* Where did it go? Straight into view — after a move through a long tree that
     is the first question anybody has. */
  const zeile = $$("#ordner .o").find(el => (el.getAttribute("title") || "")
    .indexOf(r.neu.split(r.trenner || ".").pop()) === 0);
  if(zeile) zeile.scrollIntoView({block:"nearest"});
}

/* After a move or a delete the mails are gone from this folder. Instead of
   refetching everything: take them out of the list, open the next one — that is
   what a reader working through a folder expects. */
async function nachTat(uids, liste){
  const stelle = S.mails.findIndex(m => m.uid === S.uid);
  /* 🔴 Removed by KEY where the caller knows the folders — in the „New" view the
     same number stands in three folders, and filtering by number alone would
     take two rows out of the list that nothing happened to. */
  const weg = new Set((liste || []).map(p => p.ordner + "\u0000" + p.uid));
  S.mails = S.mails.filter(m => liste ? !weg.has(wahlSchluessel(m))
                                      : !uids.includes(m.uid));
  S.gewaehlt.clear();
  if(uids.includes(S.uid)){
    const naechste = S.mails[Math.min(stelle, S.mails.length - 1)];
    S.uid = 0; S.offen = null; leseLeeren();
    if(naechste && S.einst.vorschau !== "aus") mailOeffnen(naechste.uid, naechste.ordner);
  }
  listeMalen();
  /* 🔴 Taking the rows out by hand is the INSTANT answer, refetching the page is
     the RIGHT one — in that order. Deleting 50 of 100 left „1 of 2" standing
     there with an empty list until somebody clicked to page two: the counter, the
     page count and the rows that move up into the gap all live on the server. */
  await ladeListe(false);
  const l = await sende("klient_ordner", {frisch:true});
  if(l.ok){ S.ordner_liste = l.ordner || S.ordner_liste; ordnerMalen(); }
}

/* ── Filter, sort, search ──────────────────────────────────────────────────── */
async function siebSetzen(v){ S.sieb = v; S.seite = 1; S.gewaehlt.clear(); await ladeListe(true); }
async function sortSetzen(){
  S.sortierung = $("#sortierung").value;
  if(!S.faehig.sort && S.sortierung !== "datum")
    melde(txt("k.kein_sort"), false);
  S.seite = 1; await ladeListe(true);
}
async function richtungDrehen(){
  S.richtung = S.richtung === "ab" ? "auf" : "ab";
  $("#richtung").textContent = S.richtung === "ab" ? "↓" : "↑";
  S.seite = 1; await ladeListe(true);
}
async function sucheLos(){
  S.suche = $("#suche").value.trim();
  S.feld = $("#suchfeld").value;
  S.seite = 1; S.gewaehlt.clear();
  $("#suche_x").hidden = !S.suche;
  await ladeListe(true);
}
async function sucheLeeren(){
  $("#suche").value = ""; S.suche = ""; $("#suche_x").hidden = true;
  S.seite = 1; await ladeListe(true);
}
</script>

<script>
/* ── The reading pane ──────────────────────────────────────────────────────── */
function leseLeeren(){
  $("#lese").innerHTML = `<div class="leer"><div><span class="gross">✉️</span>
    ${esc(txt("k.nichts_offen"))}</div></div>`;
}
async function mailOeffnen(uid, ordner){
  clearTimeout(S.lesemarke);
  S.uid = uid;
  S.uid_ordner = ordner || ordnerVon(uid);
  listeMalen();
  blick("lese");
  $("#lese").innerHTML = `<div class="leer"><div><span class="laedt"></span></div></div>`;
  let m;
  try{ m = await sende("klient_mail", {ordner:S.uid_ordner, uid:uid, hell:istHell()}); }
  catch(e){ return; }
  if(!m || !m.ok){
    $("#lese").innerHTML = `<div class="leer"><div>${esc((m && m.text) || txt("k.ging_nicht"))}</div></div>`;
    return;
  }
  S.offen = m;
  leseMalen();
  const inListe = S.mails.find(x => x.uid === uid);
  if(m.gelesen && inListe && !inListe.gelesen){ inListe.gelesen = true; listeMalen();
    ordnerZahlAktualisieren(undefined, Math.max(0,
      ((S.ordner_liste.find(o => o.name === ordnerVon(uid)) || {}).ungelesen || 1) - 1),
      ordnerVon(uid)); }
  /* „Mark as read after N seconds" — the timer belongs to the PAGE, because only
     it knows whether the mail is still open. It is cleared on every change of
     mail, otherwise a glance at four mails marks all four. */
  const nach = Number(S.einst.gelesen_nach);
  if(nach > 0 && !m.gelesen)
    S.lesemarke = setTimeout(() => { if(S.uid === uid) stapel("gelesen", true, [uid]); },
                             nach * 1000);
}
function leseMalen(){
  const m = S.offen;
  if(!m) return leseLeeren();
  $("#lese").innerHTML = `
    <div class="lesescroll" id="lesescroll">
      <div class="lesekopf" id="lesekopf"></div>
      <div class="lesetasten" id="lesetasten"></div>
      <div id="lesehinweise"></div>
      <table class="kopftabelle" id="kopftabelle">${
        (m.kopfzeilen || []).map(([n, w]) =>
          `<tr><td>${esc(n)}</td><td>${esc(w)}</td></tr>`).join("")}</table>
      <div class="anhangreihe" id="anhangreihe"></div>
      <iframe id="brief" title="${esc(txt("k.brief"))}"
              sandbox="allow-same-origin allow-popups allow-popups-to-escape-sandbox"
              srcdoc="${esc(m.rahmen || "")}" onload="briefHoehe()"></iframe>
    </div>`;
  leseKopfMalen();
  if(S.einst.kopfzeilen) $("#kopftabelle").classList.add("auf");
}
function leseKopfMalen(){
  const m = S.offen;
  if(!m) return;
  const an = (m.an || []).map(a => a.name || a.adresse).join(", ");
  const kopie = (m.kopie || []).map(a => a.name || a.adresse).join(", ");
  $("#lesekopf").innerHTML = `
    <h2>${esc(m.betreff || txt("k.ohne_betreff"))}</h2>
    <div class="wer">
      <span class="kreis" style="background:${farbe(m.adresse)}"
        >${esc(initialen(m.von, m.adresse))}</span>
      <div class="txt">
        <b>${esc(m.von || m.adresse)}</b>
        <div class="adr">${esc(m.adresse)}</div>
        <div class="kleiner leise" style="margin-top:.2rem">
          ${an ? esc(txt("k.an") + ": " + an) : ""}
          ${kopie ? " · " + esc(txt("k.kopie") + ": " + kopie) : ""}
        </div>
      </div>
      <div style="text-align:right;flex:0 0 auto">
        <div class="kleiner leise">${esc(langesDatum(m.zeit))}</div>
        <div class="kleiner leise">${esc(gr(m.groesse))}</div>
      </div>
    </div>`;
  const t = [];
  t.push(`<button onclick="verfassen('antwort',${m.uid})">↩ ${esc(txt("k.antworten"))}</button>`);
  if((m.an || []).length + (m.kopie || []).length > 1)
    t.push(`<button onclick="verfassen('antwort_alle',${m.uid})">↩↩ ${esc(txt("k.allen"))}</button>`);
  t.push(`<button onclick="verfassen('weiter',${m.uid})">➦ ${esc(txt("k.weiterleiten"))}</button>`);
  t.push(`<button class="blank" onclick="stapel('markiert',${!m.markiert},[${m.uid}])"
      title="${esc(txt("k.markieren"))}">${m.markiert ? "★" : "☆"}</button>`);
  t.push(`<button class="blank" onclick="stapel('gelesen',${!m.gelesen},[${m.uid}])"
      title="${esc(txt(m.gelesen ? "k.ungelesen" : "k.gelesen"))}">${m.gelesen ? "✉️" : "📖"}</button>`);
  const archiv = S.rollen.archiv;
  if(archiv && archiv !== offenOrdner())
    t.push(`<button class="blank" onclick="stapelVerschieben('${escJs(archiv)}',[${m.uid}])"
        title="${esc(txt("k.archivieren"))}">📦</button>`);
  const spam = S.rollen.spam;
  if(spam && spam !== offenOrdner())
    t.push(`<button class="blank" onclick="stapelVerschieben('${escJs(spam)}',[${m.uid}])"
        title="${esc(txt("k.spam"))}">🚫</button>`);
  t.push(`<button class="blank gefahr" onclick="stapelLoeschen([${m.uid}])"
      title="${esc(txt("k.loeschen"))}">🗑️</button>`);
  t.push(`<button class="blank" onclick="$('#kopftabelle').classList.toggle('auf')"
      title="${esc(txt("k.kopfzeilen"))}">📋</button>`);
  t.push(`<button class="blank" onclick="quelleZeigen()"
      title="${esc(txt("k.quelle"))}">{ }</button>`);
  t.push(`<button class="blank" onclick="briefDrucken()"
      title="${esc(txt("k.drucken"))}">🖨️</button>`);
  if(m.hat_html && m.hat_text)
    t.push(`<button class="blank" onclick="ansichtUm()"
        title="${esc(txt("k.ansicht_um"))}">${m.ansicht === "html" ? "Aa" : "</>"}</button>`);
  $("#lesetasten").innerHTML = t.join("");

  /* Banners and chips — everything the reader should know BEFORE clicking. */
  const h = [];
  if(m.phishing)
    h.push(`<div class="warnleiste"><span>🚨</span>
      <span><b>${esc(txt("k.phishing"))}</b> ${esc(m.phishing)}</span></div>`);
  if((m.links_verdacht || []).length){
    const l = m.links_verdacht.map(x =>
      `<div class="kleiner" style="margin-top:.25rem">${esc(x.text || "—")} →
        <b>${esc(x.wirt)}</b> <span class="leise">(${esc(txt("k.warn." + x.warnung))})</span></div>`).join("");
    h.push(`<div class="warnleiste mild"><div><b>${
      esc(txt("k.links_verdacht", {n:m.links_verdacht.length}))}</b>${l}</div></div>`);
  }
  if(m.fern_blockiert)
    h.push(`<div class="warnleiste mild"><span>🖼️</span>
      <span>${esc(txt("k.bilder_blockiert", {n:m.fern_blockiert}))}</span>
      <button onclick="bilderLaden()">${esc(txt("k.bilder_laden"))}</button>
      <button class="blank" onclick="bilderImmer()">${esc(txt("k.bilder_immer"))}</button></div>`);
  const c = [];
  const w = m.wache || {};
  if(w.klasse || w.ordner){
    const schub = (S.schubladen || {})[w.klasse] || {};
    c.push(`<span class="chip info" title="${esc(w.grund || "")}">🛡️
      ${w.klasse ? esc((schub.icon || "") + " " + (schub.name || w.klasse)) : ""}
      ${w.zeige ? "· " + esc(txt("k.wache_ordner", {o:w.zeige})) : ""}</span>`);
    if(w.ordner && w.ordner !== offenOrdner())
      c.push(`<span class="chip tat" onclick="wieWache(${m.uid},'${escJs(m.adresse)}')"
        >➜ ${esc(txt("k.wie_wache"))}</span>`);

  if(m.abmelden)
    c.push(`<a class="chip tat" href="${esc(m.abmelden)}" target="_blank"
      rel="noopener noreferrer">📰 ${esc(txt("k.abmelden_link"))}</a>`);
  if(c.length) h.push(`<div class="bahn">${c.join("")}</div>`);
  $("#lesehinweise").innerHTML = h.join("");

  const a = (m.anhaenge || []).map(x => {
    const url = "/api/klient/anhang?pf=" + encodeURIComponent(S.pf) +
      "&ordner=" + encodeURIComponent(offenOrdner()) + "&uid=" + m.uid +
      "&t=" + encodeURIComponent(x.t) + "&k=" + encodeURIComponent(x.k) +
      "&n=" + encodeURIComponent(x.n);
    const ic = x.art === "bild" ? "🖼️" : (x.art === "dokument" ? "📄" : "📎");
    return `<a class="anh" href="${esc(url)}" download="${esc(x.n)}"
      title="${esc(x.n + " · " + x.m)}"><span>${ic}</span>
      <span class="nm">${esc(x.n)}</span><span class="gr">${esc(gr(x.b))}</span></a>`;
  });
  $("#anhangreihe").innerHTML = a.length
