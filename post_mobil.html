<script>
/*SPRACHE*/
if (typeof T === "undefined") {
  globalThis.T = {}; globalThis.LANG = "de"; globalThis.SPRACHEN = [["de", "Deutsch"]];
}
/* The small helpers are the same as on the wide page — deliberately. What must
   NOT be duplicated is a DECISION: which folder plays which role, what a settings
   switch offers, how mail HTML is cleaned. All of that sits in the engine and
   arrives from there; both pages only draw it. */
/* ── Day and night ─────────────────────────────────────────────────────────
   TWO positions, one button: night and day. 🔴 And night is the DEFAULT — not
   „automatic", not what the device happens to say. A third position nobody asked
   for is a switch you have to press twice to understand, and a house this dark
   should not hand a light page to somebody who never chose one.
   🔑 The choice lives on the DEVICE, not in the mailbox: a phone in a dark room
   and a desk in the sun are two different answers to the same question, and one
   setting on the server can only ever give one of them.
   🔴 NOT called `ANSICHTEN`: on the watchman page that word is already the list
   of tabs, and a second `const` of the same name is a PARSE error that kills the
   whole script — while the page still draws its markup and looks perfectly
   normal. All three pages use the same names, so the word stays free here too. */
const LICHT_WAHLEN = ["dunkel", "hell"];
const LICHT_ZEICHEN = {dunkel:"☾", hell:"☀"};
/* 🔴 Keys SPELLED OUT, never assembled from the state: assembled, no literal
   exists anywhere, and the language bench can neither find a typo in it nor see
   that the key is in use. */
const LICHT_WORT = {dunkel:"allg.ansicht_dunkel", hell:"allg.ansicht_hell"};
/* 🔴 ONE variable holds the choice. Read it out of the store on every question
   and a `?licht=` in the address would win for ever — the button would write
   and write and nothing would move. */
let LICHT_WAHL = (function(){
  try{
    const auf = new URLSearchParams(location.search).get("licht");
    if(LICHT_WAHLEN.indexOf(auf) >= 0) return auf;
  }catch(e){ /* no parameter, no matter */ }
  try{
    const w = localStorage.getItem("pw_licht");
    if(LICHT_WAHLEN.indexOf(w) >= 0) return w;
  }catch(e){ /* a browser may refuse the store — then it stays night */ }
  return "dunkel";
})();
function istHell(){ return LICHT_WAHL === "hell"; }
function lichtAnwenden(neuzeichnen){
  const wurzel = document.documentElement;
  if(istHell()) wurzel.setAttribute("data-hell", "1");
  else wurzel.removeAttribute("data-hell");
  const grund = getComputedStyle(wurzel).getPropertyValue("--grund").trim();
  const marke = document.querySelector('meta[name="theme-color"]');
  if(marke && grund) marke.setAttribute("content", grund);
  const knopf = document.getElementById("lichttaste");
  if(knopf){
    knopf.textContent = LICHT_ZEICHEN[LICHT_WAHL];
    knopf.title = txt(LICHT_WORT[LICHT_WAHL]);
    knopf.setAttribute("aria-label", knopf.title);
  }
  /* 🔑 The letter is a document of its own inside the frame, with a stylesheet
     built by the ENGINE. It cannot be repainted from out here — so it is asked
     for again. One request, for something somebody pressed on purpose. */
  if(neuzeichnen && S.uid) mailOeffnen(S.uid, offenOrdner());
}
function lichtUm(){
  LICHT_WAHL = LICHT_WAHL === "hell" ? "dunkel" : "hell";
  try{ localStorage.setItem("pw_licht", LICHT_WAHL); }catch(e){}
  lichtAnwenden(true);
}

function txt(schluessel, werte){
  let s = T[schluessel];
  if(s === undefined) return schluessel;
  if(werte) for(const k in werte) s = s.split("{" + k + "}").join(werte[k]);
  return s;
}
function textenSetzen(wurzel){
  (wurzel || document).querySelectorAll("[data-t]").forEach(el => {
    el.textContent = txt(el.dataset.t); });
  (wurzel || document).querySelectorAll("[data-t-titel]").forEach(el => {
    el.title = txt(el.dataset.tTitel);
    if(!el.getAttribute("aria-label")) el.setAttribute("aria-label", txt(el.dataset.tTitel)); });
  (wurzel || document).querySelectorAll("[data-t-platzhalter]").forEach(el => {
    el.placeholder = txt(el.dataset.tPlatzhalter); });
}
const $ = s => document.querySelector(s);
function esc(s){ return String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function escJs(s){ return String(s).replace(/\\/g,"\\\\").replace(/'/g,"\\'"); }

const S = {
  pf:"", ordner:"INBOX", seite:1, sieb:"", suche:"", feld:"alle", pro:50,
  mails:[], uid:0, offen:null, ordner_liste:[], rollen:{}, einst:{}, faehig:{},
  oberflaeche:[], postfaecher:[], brief:null, seiten:1, gesamt:0, laeuft:false,
  version:"", blick:"liste",
  /* 🔑 „New" is where a session starts, not the inbox — every fresh
     connection opens there instead of on the inbox.
     The reason sits in the watchman itself: it moves new mail OUT of the inbox
     into a dozen folders, so somebody who lands in the inbox is looking at the
     one place that does NOT show what has arrived. The choice lasts for the
     session — open a folder and you stay there, and ⟳ does not pull you back
     either; only a fresh connection starts at „New" again. */
  neu:true,                // the „New" view instead of a folder
  zu:new Set(),            // collapsed folder branches
  wahl:false,              // choosing several at once
  gewaehlt:new Set()       // …and which ones
};

/* 🔴 `bleibt` is for the things that TAKE time. Moving or deleting a folder is
   one server command, but the server may be carrying two thousand mails while it
   runs — and a page that says nothing until it is over looks broken. There is no
   progress to report, so what is shown is the honest thing: what is happening,
   and that it can take a while. */
function melde(text, gut, bleibt){
  const m = $("#melde");
  m.innerHTML = (bleibt ? '<span class="laedt"></span> ' : "") + esc(text);
  m.className = "melde auf" + (gut === false ? " schlecht" : (gut ? " gut" : ""));
  clearTimeout(m._t);
  if(!bleibt) m._t = setTimeout(() => m.className = "melde", 4200);
}
async function sende(aktion, daten){
  const r = await fetch("/api/" + aktion, {method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify(Object.assign({pf:S.pf}, daten || {}))});
  const a = await r.json().catch(() => ({ok:false, text:"HTTP " + r.status}));
  if(a && a.gesperrt){ torZeigen({wort:true, an:false}); throw new Error("gesperrt"); }
  return a;
}
function initialen(name, adresse){
  const s = (name || adresse || "?").trim();
  const teile = s.replace(/[<>"]/g,"").split(/[\s.@_-]+/).filter(Boolean);
  if(!teile.length) return "?";
  if(teile.length === 1) return teile[0].slice(0,2).toUpperCase();
  return (teile[0][0] + teile[1][0]).toUpperCase();
}
function farbe(adresse){
  let h = 0; const s = String(adresse || "");
  for(let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360;
  return "hsl(" + h + " 52% 63%)";
}
function gr(b){
  b = Number(b || 0);
  if(b >= 1048576) return (b/1048576).toFixed(1).replace(".0","") + " MB";
  if(b >= 1024) return Math.round(b/1024) + " kB";
  return b + " B";
}
function wann(iso){
  if(!iso) return "";
  const d = new Date(iso); if(isNaN(d)) return String(iso).slice(0,10);
  const jetzt = new Date();
  const tag = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  /* 🔴 The setting decides, not the language. With LANG „en" the locale default
     is 12 hours — and whoever set „24 hours" watched it be ignored. Seen in the
     screenshot: „09:44 AM" on a page set to 24. */
  const uhrform = {hour:"2-digit", minute:"2-digit"};
  if(S.einst && S.einst.zeitform) uhrform.hour12 = (S.einst.zeitform === "12");
  const uhr = d.toLocaleTimeString(LANG, uhrform);
  const tage = Math.round((tag(jetzt) - tag(d)) / 86400000);
  if(tage === 0) return uhr;
  if(tage === 1) return txt("k.gestern");
  if(tage < 7) return d.toLocaleDateString(LANG, {weekday:"short"});
  if(d.getFullYear() === jetzt.getFullYear())
    return d.toLocaleDateString(LANG, {day:"2-digit", month:"2-digit"});
  return d.toLocaleDateString(LANG, {day:"2-digit", month:"2-digit", year:"2-digit"});
}
function langesDatum(iso){
  if(!iso) return "";
  const d = new Date(iso); if(isNaN(d)) return String(iso);
  const form = {day:"2-digit", month:"short", year:"numeric",
                hour:"2-digit", minute:"2-digit"};
  if(S.einst && S.einst.zeitform) form.hour12 = (S.einst.zeitform === "12");
  return d.toLocaleString(LANG, form);
}
function blick(was){
  S.blick = was;
  document.body.dataset.blick = was;
  fussMalen();
  /* 🔴 Every sheet has its own scroll position. Without this, opening a mail
     leaves you halfway down the letter because the list was scrolled there. */
  const r = {liste:"#rollen", mail:"#mailrumpf", ordner:"#ordnerliste",
             mehr:"#mehrleib", ziel:"#zielliste"}[was];
  if(was === "mail" && $(r)) $(r).scrollTop = 0;
}

/* ── The door ──────────────────────────────────────────────────────────── */
function torZeigen(schloss){
  $("#tor").classList.add("auf");
  const kein = !schloss.wort;
  $("#tor_neu").hidden = !kein;
  $("#tor_an").hidden = kein;
  $("#tor_text").textContent = kein ? txt("k.tor_kein_wort") : txt("k.tor_text");
  $("#tor_fuss").textContent = kein ? txt("k.tor_fuss_neu") : txt("k.tor_fuss");
  setTimeout(() => (kein ? $("#tor_wort1") : $("#tor_wort")).focus(), 80);
}
function torWeg(){ $("#tor").classList.remove("auf"); }
async function wortSetzen(){
  const a = $("#tor_wort1").value, b = $("#tor_wort2").value;
  if(a.length < 8) return melde(txt("k.wort_kurz"), false);
  if(a !== b) return melde(txt("k.wort_ungleich"), false);
  const r = await sende("klient_wort", {neu:a});
  melde(r.text, r.ok);
  if(r.ok){ $("#tor_wort1").value = $("#tor_wort2").value = ""; torZeigen({wort:true}); }
}
async function anmelden(){
  const wort = $("#tor_wort").value;
  if(!wort) return;
  const r = await sende("klient_anmelden", {wort:wort});
  if(!r.ok) return melde(r.text, false);
  $("#tor_wort").value = "";
  torWeg();
  await allesLaden();
}
async function abmelden(){
  const r = await sende("klient_abmelden", {});
  melde(r.text, true);
  torZeigen({wort:true, an:false});
}

/* ── Loading ───────────────────────────────────────────────────────────── */
async function allesLaden(){
  if(S.laeuft) return;
  S.laeuft = true;
  try{
    const l = await sende("klient_lage", {});
    if(!l.schloss || !l.schloss.an){ torZeigen(l.schloss || {wort:false}); return; }
    torWeg();
    if(l.ok === false && l.text) melde(l.text, false);
    S.einst = l.einst || {};
    S.oberflaeche = l.oberflaeche || [];
    S.ordner_liste = l.ordner || [];
    S.rollen = l.rollen || {};
    S.faehig = l.faehig || {};
    S.postfaecher = l.postfaecher || [];
    S.schubladen = l.schubladen || {};
    S.smtp = l.smtp || {};
    S.pf = l.pf || S.pf;
    S.version = l.version || "";
    S.pro = S.einst.pro_seite || 50;
    if(S.einst.nur_ungelesen && !S.sieb) S.sieb = "ungelesen";
    document.documentElement.style.setProperty("--schrift", (S.einst.schrift || 100) + "%");
    if(!S.ordner || !S.ordner_liste.some(o => o.name === S.ordner))
      S.ordner = S.rollen.posteingang || (S.ordner_liste[0] || {}).name || "INBOX";
    ordnerMalen();
    fussMalen();
    await ladeListe(true);
  }catch(e){
    if(String(e.message) !== "gesperrt") melde(txt("k.keine_verbindung"), false);
  }finally{ S.laeuft = false; }
}

function fussMalen(){
  const ungelesen = (S.ordner_liste || []).reduce((s, o) => s + (o.ungelesen || 0), 0);
  const knoepfe = [
    ["liste", "📥", "k.m_post", ungelesen > 0],
    ["ordner", "📁", "k.ordner", false],
    ["schreiben", "✏️", "k.m_schreiben", false],
    ["mehr", "⚙️", "k.m_mehr", false],
  ].map(([wohin, ic, k, punkt]) =>
    `<button class="${S.blick === wohin ? "an" : ""}" onclick="fussTaste('${wohin}')"
       aria-label="${esc(txt(k))}"><i>${ic}</i>${punkt ? '<span class="punkt"></span>' : ""}
       <span>${esc(txt(k))}</span></button>`).join("");
  ["#fussleiste", "#fussleiste2", "#fussleiste3"].forEach(id => {
    const el = $(id); if(el) el.innerHTML = knoepfe;
  });
}
function fussTaste(wohin){
  if(wohin === "schreiben") return verfassen("neu");
  if(wohin === "mehr"){ mehrMalen(); return blick("mehr"); }
  blick(wohin);
}

/* ── Folders ───────────────────────────────────────────────────────────── */
function ordnerMalen(){
  const sonder = S.ordner_liste.filter(o => o.rolle);
  const rest = S.ordner_liste.filter(o => !o.rolle);
  const grund = rest.length ? Math.min(...rest.map(o => o.tiefe)) : 0;
  const tr = S.faehig && S.faehig.trenner ? S.faehig.trenner : ".";
  /* 🔑 The same fold as on the wide page — a tree with twenty branches is no
     easier to read on a phone, it is harder. The triangle has its own slot on
     EVERY row, empty ones included: a part of the geometry that is only
     sometimes there is what put the tree on its head in 5.2.0. */
  const faltbar = (o) => rest.some(x => x !== o && x.name.startsWith(o.name + tr));
  const zeile = (o, tief, faltet) => {
    /* 🔴 Roles are NOT a hierarchy. On this server they are all called
       `INBOX.something`, so the inbox looks like a parent of every one of them —
       give it a triangle and one tap folds Drafts, Sent, Archive, Junk and Trash
       out of sight. In that block nothing folds; the empty slot keeps the icons
       in one line. (The same trap as 5.2.0, one surface later.) */
    const kinder = faltet && faltbar(o);
    if(faltet && o.name.indexOf(tr) > 0
       && elternWeg(o, tr).some(p => S.zu.has(p))) return "";
    /* 🔑 A long press picks the folder UP — the phone's answer to dragging it
       across a desk. A special folder is a position and stays put, so it does
       not react to the press at all. */
    const falt = kinder
      ? `<span class="ofalt ${S.zu.has(o.name) ? "zu" : ""}"
             onclick="faltenUm(event,'${escJs(o.name)}')">▾</span>`
      : `<span class="ofalt"></span>`;
    return `<div class="o ${tief > 0 ? "unter" : ""} ${kinder ? "eltern" : ""}
        ${(!S.neu && o.name === S.ordner) ? "an" : ""}" style="--tief:${tief}"
        onclick="ordnerWaehlen('${escJs(o.name)}')" role="button" tabindex="0"
        ${o.rolle ? "" : `ontouchstart="ordnerDruckAn(event,'${escJs(o.name)}')"
        ontouchend="ordnerDruckAus()" ontouchmove="ordnerDruckAus()"
        ontouchcancel="ordnerDruckAus()"
        oncontextmenu="event.preventDefault();ordnerTatAuf('${escJs(o.name)}')"`}>
      ${falt}<span class="ic ${o.ungelesen ? "atmet" : ""}">${o.icon || "📁"}</span>
      <span class="nm">${esc(ordnerName(o))}</span>
      ${o.ungelesen ? `<span class="u">${o.ungelesen}</span>`
                    : `<span class="n">${o.gesamt || ""}</span>`}</div>`;
  };
  const offen = neuZahl();
  const teile = [`<div class="o neuzeile ${S.neu ? "an" : ""}" role="button" tabindex="0"
      onclick="neuWaehlen()"><span class="ic">✨</span>
    <span class="nm">${esc(txt("k.neu"))}</span>
    ${offen ? `<span class="u">${offen}</span>` : ""}</div>`];
  teile.push(sonder.map(o => zeile(o, 0, false)).join(""));
  if(rest.length){
    teile.push(`<div class="gruppentitel">${esc(txt("k.eigene_ordner"))}</div>`);
    let zweig = [];
    for(const o of rest){
      const tief = o.tiefe - grund;
      if(tief === 0 && zweig.length){
        teile.push(`<div class="ozweig">${zweig.join("")}</div>`);
        zweig = [];
      }
      zweig.push(zeile(o, tief, true));
    }
    if(zweig.length) teile.push(`<div class="ozweig">${zweig.join("")}</div>`);
  }
  $("#ordnerliste").innerHTML = teile.join("");
  /* 🔑 ONE button, and the STATE decides which of the two things it offers: as
     long as anything is open it closes everything, and only when everything is
     closed does it open it again. */
  const faltbare = rest.filter(o => rest.some(
    x => x !== o && x.name.startsWith(o.name + tr))).map(o => o.name);
  const knopf = $("#falttaste");
  const allesZu = faltbare.length > 0 && faltbare.every(n => S.zu.has(n));
  knopf.hidden = !faltbare.length;
  knopf.textContent = allesZu ? "⊞" : "⊟";
  knopf.title = txt(allesZu ? "k.alle_auf" : "k.alle_zu");
  knopf.setAttribute("aria-label", knopf.title);
}
function elternWeg(o, tr){
  const teile = o.name.split(tr);
  return teile.slice(0, -1).map((_, i) => teile.slice(0, i + 1).join(tr));
}
function faltenUm(ev, name){
  ev.stopPropagation();
  S.zu.has(name) ? S.zu.delete(name) : S.zu.add(name);
  ordnerMalen();
}
/* Everything at once. 🔴 Only folders that HAVE children are remembered as
   closed — a childless name in the set would never come out again, and the
   button would never offer „open all" once more. */
function alleFalten(){
  const tr = (S.faehig && S.faehig.trenner) || ".";
  const rest = S.ordner_liste.filter(o => !o.rolle);
  const faltbare = rest.filter(o => rest.some(
    x => x !== o && x.name.startsWith(o.name + tr))).map(o => o.name);
  const allesZu = faltbare.length > 0 && faltbare.every(n => S.zu.has(n));
  S.zu.clear();
  if(!allesZu) for(const n of faltbare) S.zu.add(n);
  ordnerMalen();
}
/* How many mails the „New" view would show — out of the counts the folder list
   already carries, so it costs nothing. */
function neuZahl(){
  return S.ordner_liste.reduce((n, o) => {
    if(!o.waehlbar || o.rolle === "papierkorb" || o.rolle === "entwuerfe") return n;
    if(o.rolle === "spam" && !S.einst.neu_spam) return n;
    return n + (o.ungelesen || 0);
  }, 0);
}
/* „INBOX" is protocol, not a name — see the wide version. */
function ordnerName(o){
  return (o.name.toUpperCase() === "INBOX") ? txt("k.posteingang") : o.zeige;
}
async function ordnerWaehlen(name){
  /* 🔴 The long press that picks a folder up sends a `click` afterwards — the
     same bar as for the list rows, or the folder would open underneath its own
     move sheet. */
  if(Date.now() < sperreKlick) return;
  S.neu = false; wahlAus();
  S.ordner = name; S.seite = 1; S.uid = 0; S.offen = null; S.mails = [];
  ordnerMalen();
  blick("liste");
  await ladeListe(true);
}
/* The view the watchman makes necessary: it carries new post into folders, so
   „what came in" is no longer one folder but twelve. Here they are one list. */
async function neuWaehlen(){
  S.neu = true; wahlAus();
  S.seite = 1; S.uid = 0; S.offen = null; S.mails = [];
  ordnerMalen();
  blick("liste");
  await ladeListe(true);
}
/* Which folder a row really lives in — every action asks here instead of
   assuming the view. */
function ordnerVon(uid){
  /* 🔴 The open mail answers for itself. Searching the list by number finds the
     FIRST row with that number — and in the „New" view the same number stands in
     three folders, so the answer would be right by luck. */
  if(S.offen && S.offen.uid === uid && S.offen.ordner) return S.offen.ordner;
  const m = S.mails.find(x => x.uid === uid);
  return (m && m.ordner) || S.ordner;
}
function offenOrdner(){
  return (S.offen && S.offen.ordner) || S.ordner;
}
async function ordnerNeu(){
  const name = prompt(txt("k.ordner_name"));
  if(!name) return;
  const r = await sende("klient_ordner_neu", {name:name});
  melde(r.text || (r.ok ? "" : txt("k.ging_nicht")), r.ok);
  if(r.ok) await allesLaden();
}

/* ── The list ──────────────────────────────────────────────────────────── */
async function ladeListe(frisch){
  const o = S.ordner_liste.find(x => x.name === S.ordner) || {};
  $("#ordnername").textContent = S.neu ? txt("k.neu")
                                       : (o.name ? ordnerName(o) : "Postwache");
  $("#siebknopf").style.color = S.sieb ? "var(--akzent)" : "";
  if(frisch) $("#zeilen").innerHTML = `<div class="leerraum"><span class="laedt"></span></div>`;
  let a;
  try{
    a = S.neu
      ? await sende("klient_neu", {})
      : await sende("klient_liste", {ordner:S.ordner, seite:frisch ? 1 : S.seite,
          sieb:S.sieb, suche:"", feld:"alle", pro_seite:S.pro});
  }catch(e){ return; }
  if(!a || a.ok === false) return melde((a && a.text) || txt("k.ging_nicht"), false);
  S.mails = (frisch || S.neu) ? (a.mails || []) : S.mails.concat(a.mails || []);
  if(S.neu){
    S.seite = 1; S.seiten = 1; S.gesamt = S.mails.length;
    const un = $("#ungelesen");
    un.hidden = !a.gesamt;
    un.textContent = a.gesamt || "";
    listeMalen();
    return;
  }
  S.seite = a.seite || 1; S.seiten = a.seiten || 1; S.gesamt = a.gesamt || 0;
  const u = $("#ungelesen");
  u.hidden = !a.ordner_ungelesen;
  u.textContent = a.ordner_ungelesen || "";
  if(o.name){ o.gesamt = a.ordner_gesamt; o.ungelesen = a.ordner_ungelesen; }
  listeMalen();
  fussMalen();
  if(frisch) $("#rollen").scrollTop = 0;
}
async function mehrLaden(){
  if(S.seite >= S.seiten) return;
  S.seite += 1;
  await ladeListe(false);
}
function listeMalen(){
  if(!S.mails.length){
    $("#zeilen").innerHTML = S.neu
      ? `<div class="leerraum"><div><span class="gross">✨</span>
         ${esc(txt("k.nichts_neu"))}</div></div>`
      : `<div class="leerraum"><div>
      <span class="gross">${S.sieb ? "●" : "📭"}</span>
      ${esc(txt(S.sieb ? "k.nichts_im_sieb" : "k.ordner_leer"))}</div></div>`;
    $("#mehrknopf").hidden = true;
    return;
  }
  $("#zeilen").innerHTML = S.mails.map((m, i) => zeileHtml(m, i)).join("");
  $("#mehrknopf").hidden = S.seite >= S.seiten;
}
function zeileHtml(m, i){
  const zeichen = [
    m.markiert ? '<span class="stern">★</span>' : "",
    m.beantwortet ? "<span>↩</span>" : "",
    m.anhang ? "<span>📎</span>" : "",
    !m.gelesen ? '<span class="punkt"></span>' : ""
  ].filter(Boolean).join("");
  const gewaehlt = S.gewaehlt.has(wahlSchluessel(m));
  return `<div class="zeile" data-uid="${m.uid}">
    <div class="wischen"><span class="links">📦</span><span class="rechts">🗑️</span></div>
    <div class="z ${m.gelesen ? "" : "neu"} ${gewaehlt ? "gewaehlt" : ""}"
         role="button" tabindex="0"
         onclick="zeileKlick(${i})"
         ontouchstart="wischStart(event,this,${i})" ontouchmove="wischZug(event,this)"
         ontouchend="wischEnde(event,this,${i})"
         ontouchcancel="wischEnde(event,this,${i},true)">
      <span class="haken">${gewaehlt ? "✓" : ""}</span>
      <span class="kreis" style="background:${farbe(m.adresse)}"
        >${esc(initialen(m.von, m.adresse))}</span>
      <span class="von">${esc(m.von || m.adresse)}</span>
      <span class="rand"><span class="wann">${esc(wann(m.zeit))}</span>
        <span class="zeichen">${S.neu && m.ordner_kurz
          ? `<span class="ort">📁 ${esc(ordnerKurz(m))}</span>` : ""}${zeichen}</span></span>
      <span class="bet">${esc(m.betreff || txt("k.ohne_betreff"))}</span>
      <span class="aus">${esc(dritteZeile(m))}</span>
    </div></div>`;
}

/* The third line: the first words of the letter. On a phone that matters more
   than anywhere else — the screen shows eight rows, and the excerpt is what
   saves opening six of them. Where there is none, the row says what else is
   worth knowing about the mail. */
/* „INBOX" is the protocol's word — in this one place it gets the reader's. */
function ordnerKurz(m){
  return (m.ordner || "").toUpperCase() === "INBOX" ? txt("k.posteingang")
                                                    : (m.ordner_kurz || "");
}
function dritteZeile(m){
  if(m.auszug) return m.auszug;
  const gesendet = [S.rollen.gesendet, S.rollen.entwuerfe].includes(m.ordner || S.ordner);
  const wer = gesendet && m.an ? txt("k.an") + ": " + m.an : m.adresse;
  return wer + (m.anhang ? " · " + gr(m.anhang_gross) : "");
}

/* ── Choosing several ──────────────────────────────────────────────────
   🔑 Two ways in, because both are learned behaviour: a long press on a row
   (what a phone teaches you) and a button in the bar (what you find when you do
   not know that). Once inside, a tap chooses instead of opening — a mode that
   changes what a tap means has to be visible, and it is: the avatars turn into
   ticks and the bar at the bottom is a different one. */
let sperreKlick = 0;          // a long press must not also count as a tap
function zeileKlick(i){
  if(Date.now() < sperreKlick) return;
  const m = S.mails[i];
  if(!m) return;
  if(S.wahl) return wahlUm(i);
  mailOeffnen(m.uid, m.ordner);
}
function wahlAn(){ S.wahl = true; wahlMalen(); listeMalen(); }
function wahlAus(){
  S.wahl = false; S.gewaehlt.clear(); wahlMalen(); listeMalen();
}
function wahlUm(i){
  S.wahl = true;
  const m = S.mails[i];
  if(!m) return;
  const k = wahlSchluessel(m);
  S.gewaehlt.has(k) ? S.gewaehlt.delete(k) : S.gewaehlt.add(k);
  wahlMalen(); listeMalen();
}
function alleWaehlen(){
  const geladen = S.mails.length;
  const alleGeladen = geladen > 0 && S.mails.every(m => S.gewaehlt.has(wahlSchluessel(m)));
  const gesamt = S.neu ? geladen : (S.gesamt || 0);
  // Step two: everything loaded is chosen and the folder holds more.
  if(alleGeladen && S.gewaehlt.size < gesamt) return alleImOrdner();
  const schon = S.gewaehlt.size === geladen && geladen > 0;
  S.gewaehlt.clear();
  if(!schon) S.mails.forEach(m => S.gewaehlt.add(wahlSchluessel(m)));
  wahlMalen(); listeMalen();
}
/* Everything the view holds — including what has not been loaded yet.
   🔑 With a filter on, „all" means every HIT: the server returns the numbers of
   the very list the page is cut out of. */
async function alleImOrdner(){
  if(S.neu){
    S.mails.forEach(m => S.gewaehlt.add(wahlSchluessel(m)));
    return (wahlMalen(), listeMalen());
  }
  /* 🔴 WORD FOR WORD the request that fetches the list — otherwise „all"
     means something other than what is on screen. This page does not search
     through the server (`suche:""`), so no search may ride along here. */
  const r = await sende("klient_liste", {ordner:S.ordner, seite:1,
      sieb:S.sieb, suche:"", feld:"alle", pro_seite:S.pro, alle_uids:true});
  if(!r || !r.ok || !r.alle_uids) return melde(txt("k.ging_nicht"), false);
  for(const u of r.alle_uids) S.gewaehlt.add(S.ordner + "\u0000" + u);
  wahlMalen(); listeMalen();
}
/* 🔴 A UID is unique inside ITS FOLDER and nowhere else. Keyed by number alone,
   one tick in the „New" view marked three rows — the same 101 stands in the
   inbox, in House and in People. So the key is folder AND number, and every
   action works on (folder, number) pairs. Measured, not assumed. */
function wahlSchluessel(m){
  return (m.ordner || S.ordner) + "\u0000" + m.uid;
}
function gewaehlteMails(){
  return S.mails.filter(m => S.gewaehlt.has(wahlSchluessel(m)));
}
/* 🔴 From the KEYS, not from the loaded rows: after „select all" thousands
   stand in the selection and only the loaded ones are on screen. Filtered
   through `S.mails` the action would have caught exactly those and left the
   rest quietly lying. The key carries folder AND number. */
function posten(uids){
  if(uids && uids.length)
    return uids.map(u => ({ordner: ordnerVon(u), uid: u}));
  return [...S.gewaehlt].map(k => {
    const i = k.indexOf("\u0000");
    return {ordner: k.slice(0, i), uid: parseInt(k.slice(i + 1), 10)};
  }).filter(p => p.ordner && p.uid);
}
function wahlMalen(){
  const n = S.gewaehlt.size;
  document.body.classList.toggle("wahlmodus", S.wahl);
  $("#listenkopf").hidden = S.wahl;
  $("#wahlkopf").hidden = !S.wahl;
  $("#wahlzahl").textContent = n
    ? txt("k.gewaehlt", {n:n.toLocaleString(LANG)}) : txt("k.auswaehlen");
  // The one button says which step comes next.
  const knopf = $("#alle_waehlen");
  if(knopf){
    const geladenGewaehlt = S.mails.length > 0
      && S.mails.every(m => S.gewaehlt.has(wahlSchluessel(m)));
    const gesamt = S.neu ? S.mails.length : (S.gesamt || 0);
    knopf.textContent = (geladenGewaehlt && n < gesamt)
      ? txt("k.alle_im_ordner", {n:gesamt.toLocaleString(LANG)})
      : txt("k.alle_waehlen");
  }
  $("#wahlfuss").innerHTML = [
    ["📖", "k.gelesen", "stapel('gelesen',true)", ""],
    ["✉️", "k.ungelesen", "stapel('gelesen',false)", ""],
    ["⭐", "k.markieren", "stapel('markiert',true)", ""],
    ["📁", "k.verschieben", "zielAuf()", ""],
    ["🗑️", "k.loeschen", "stapelLoeschen()", "gefahr"],
  ].map(([ic, k, tat, art]) =>
    `<button class="${art}" onclick="${tat}" ${n ? "" : "disabled"}
       aria-label="${esc(txt(k))}"><i>${ic}</i><span>${esc(txt(k))}</span></button>`
  ).join("");
}

/* ── Where to ──────────────────────────────────────────────────────────
   The folders as a sheet, not as a `prompt()` with numbers to type. Serves the
   one open mail and a whole selection alike. */
let zielOrdner = "";     // a whole folder on its way, instead of mails
let zielFuer = [];              // (folder, number) pairs — never numbers alone
function zielAuf(uids){
  zielOrdner = "";
  zielFuer = posten(uids);
  if(!zielFuer.length) return melde(txt("k.nichts_gewaehlt"), false);
  zielMalen();
  blick("ziel");
}
/* ── A whole folder on its way ─────────────────────────────────────────────
   A whole folder travels by drag and drop, mail and all, and the watchman
   has to notice it for the sake of what it has learned.
   🔑 On a phone nothing is dragged across a desk — it is picked up with a long
   press and put down in the SAME sheet that mail is moved with. One list of
   folders, two kinds of traveller. */
let ordnerDruck = null;
function ordnerDruckAn(ev, name){
  clearTimeout(ordnerDruck);
  ordnerDruck = setTimeout(() => {
    ordnerDruck = null;
    /* 🔴 A long press still sends a `click` afterwards — without the bar the
       folder would open the moment it was picked up. */
    sperreKlick = Date.now() + 800;
    if(navigator.vibrate) try{ navigator.vibrate(12); }catch(e){}
    ordnerTatAuf(name);
  }, 550);
}
function ordnerDruckAus(){ clearTimeout(ordnerDruck); ordnerDruck = null; }
function ordnerZielAuf(name){
  const o = S.ordner_liste.find(x => x.name === name);
  if(!o) return;
  if(o.rolle) return melde(txt("k.ordner_fest"), false);
  zielOrdner = name;
  zielFuer = [];
  zielMalen();
  blick("ziel");
}
/* 🔑 A long press asks „what with this folder?", and there are two answers. A
   sheet with two rows says both out loud — better than one hidden gesture per
   action, which is what a phone usually ends up with. */
let tatOrdner = "";
function ordnerTatAuf(name){
  const o = S.ordner_liste.find(x => x.name === name);
  if(!o) return;
  if(o.rolle) return melde(txt("k.ordner_fest"), false);
  tatOrdner = name;
  $("#ordnertatkopf").textContent = ordnerName(o);
  blick("ordnertat");
}
function ordnerTatZu(){ tatOrdner = ""; blick("ordner"); }
function ordnerHinweisWeg(){
  $("#ordnerhinweis").hidden = true;
  try{ localStorage.setItem("pw_ordnerzieh", "1"); }catch(e){ /* then it comes again */ }
}
function ordnerHinweisZeigen(){
  let gesehen = "1";
  try{ gesehen = localStorage.getItem("pw_ordnerzieh") || ""; }catch(e){ gesehen = "1"; }
  if(!gesehen && ("ontouchstart" in window)) $("#ordnerhinweis").hidden = false;
}
function zielZu(){ blick(S.offen && S.blick === "ziel" && !S.wahl ? "mail" : "liste"); }
function zielMalen(){
  /* The same sheet answers two questions, so it says WHICH one it is answering. */
  $("#zielkopf").textContent = txt(zielOrdner ? "k.ordner_ziehen" : "k.verschieben_nach");
  const rest = S.ordner_liste.filter(o => !o.rolle);
  const grund = rest.length ? Math.min(...rest.map(o => o.tiefe)) : 0;
  const tr = (S.faehig && S.faehig.trenner) || ".";
  const aus = new Set(zielFuer.map(p => p.ordner));
  /* 🔴 A folder on its way may not land in itself, in one of its own children,
     or in a special folder — and it must not be offered there either. Offering
     something that will be refused is a worse answer than not offering it. */
  const geht = (o) => zielOrdner
    ? (!o.rolle && o.name !== zielOrdner && o.name.indexOf(zielOrdner + tr) !== 0
       && o.name !== zielOrdner.split(tr).slice(0, -1).join(tr))
    : (o.waehlbar && !(aus.size === 1 && aus.has(o.name)));
  const zeile = (o, tief) => geht(o)
    ? `<div class="o ${tief > 0 ? "unter" : ""}" style="--tief:${tief}"
           role="button" tabindex="0" onclick="zielNehmen('${escJs(o.name)}')">
        <span class="ic">${o.icon || "📁"}</span>
        <span class="nm">${esc(ordnerName(o))}</span></div>` : "";
  const teile = [S.ordner_liste.filter(o => o.rolle).map(o => zeile(o, 0)).join("")];
  if(rest.length){
    teile.push(`<div class="gruppentitel">${esc(txt("k.eigene_ordner"))}</div>`);
    /* Only a FOLDER can go „to the top" — mail has no such place. */
    if(zielOrdner && zielOrdner.indexOf(tr) > 0)
      teile.push(`<div class="o" role="button" tabindex="0" onclick="zielNehmen('')">
        <span class="ic">⇱</span>
        <span class="nm">${esc(txt("k.ordner_oben"))}</span></div>`);
    teile.push(rest.map(o => zeile(o, o.tiefe - grund)).join(""));
  }
  $("#zielliste").innerHTML = teile.join("");
}
async function zielNehmen(name){
  if(zielOrdner){
    const welcher = zielOrdner;
    zielOrdner = "";
    blick("ordner");
    return ordnerZiehen(welcher, name);
  }
  const liste = zielFuer;
  blick("liste");
  await verschiebeListe(name, liste);
}
/* 🔴 The only action in this client that cannot be taken back. The engine is
   asked FIRST and refuses while it counts — the answer carries the number of
   mails, and only THAT number goes into the question. */
async function ordnerFort(name){
  const o = S.ordner_liste.find(x => x.name === name);
  if(!o) return;
  blick("ordner");
  let r = await sende("klient_ordner_loeschen", {ordner:name});
  if(!r.ok && !r.frage) return melde(r.text || txt("k.ging_nicht"), false);
  const frage = r.frage
    ? txt("k.ordner_loeschen_inhalt", {o:ordnerName(o), n:r.mails.toLocaleString(LANG)})
    : txt("k.ordner_loeschen_frage", {o:ordnerName(o)});
  if(!confirm(frage)) return;
  S.laeuft = true;
  melde(txt("k.ordner_faellt", {o:ordnerName(o)}), null, true);
  try{ r = await sende("klient_ordner_loeschen", {ordner:name, mit_inhalt:true}); }
  catch(e){ S.laeuft = false; return melde("", null); }
  S.laeuft = false;
  melde(r.text || (r.ok ? "" : txt("k.ging_nicht")), r.ok);
  if(!r.ok) return;
  if(S.ordner === name) S.ordner = S.rollen.posteingang || "INBOX";
  S.zu.delete(name);
  await allesLaden();
}
async function ordnerZiehen(name, ziel){
  const o = S.ordner_liste.find(x => x.name === name);
  const zo = S.ordner_liste.find(x => x.name === ziel);
  if(!o) return;
  if(!confirm(txt("k.ordner_ziehen_frage", {o:ordnerName(o),
      ziel: zo ? ordnerName(zo) : txt("k.ordner_oben")}))) return;
  S.laeuft = true;
  melde(txt("k.ordner_zieht", {o:ordnerName(o)}), null, true);
  let r;
  try{ r = await sende("klient_ordner_ziehen", {ordner:name, ziel:ziel}); }
  catch(e){ S.laeuft = false; melde("", null); return; }
  S.laeuft = false;
  melde(r.text || (r.ok ? "" : txt("k.ging_nicht")), r.ok);
  if(!r.ok) return;
  /* 🔴 The move HAPPENED even if the watchman could not follow — say which half
     went wrong instead of calling the whole thing a failure. */
  if(r.wache_fehler) melde(txt("k.wache_nicht_nachgezogen"), false);
  const t = r.trenner || ((S.faehig && S.faehig.trenner) || ".");
  if(S.ordner === r.alt) S.ordner = r.neu;
  else if(S.ordner.indexOf(r.alt + t) === 0) S.ordner = r.neu + S.ordner.slice(r.alt.length);
  await allesLaden();
}

/* ── Swiping ───────────────────────────────────────────────────────────
   🔴 Only when the finger really moves SIDEWAYS. Deciding on the first pixel
   turns every scroll into an archive action — so nothing happens until the
   horizontal distance beats the vertical one, and `touch-action: pan-y` leaves
   the scrolling to the browser. */
let wisch = null, langDruck = null;
function wischStart(ev, el, i){
  /* While several are chosen a sideways drag is scrolling, not a gesture — an
     archive action in the middle of choosing is the last thing anybody means. */
  if(S.wahl) return;
  const t = ev.touches[0];
  wisch = {x:t.clientX, y:t.clientY, dx:0, quer:false};
  el.style.transition = "none";
  /* 🔴 A long press opens the selection — and must NOT also count as a tap. The
     browser sends `click` on touchend all the same, so the tap is barred for a
     moment. Without that the row is chosen and immediately unchosen again. */
  clearTimeout(langDruck);
  langDruck = setTimeout(() => {
    if(!wisch || wisch.quer) return;
    sperreKlick = Date.now() + 800;
    wisch = null;
    try{ if(navigator.vibrate) navigator.vibrate(12); }catch(e){}
    wahlUm(i);
  }, 480);
}
function wischZug(ev, el){
  if(!wisch) return;
  const t = ev.touches[0];
  const dx = t.clientX - wisch.x, dy = t.clientY - wisch.y;
  if(!wisch.quer){
    if(Math.abs(dy) > Math.abs(dx) || Math.abs(dx) < 12) return;
    wisch.quer = true;
    clearTimeout(langDruck);          // a finger that moves is not a long press
  }
  wisch.dx = dx;
  el.style.transform = "translateX(" + dx + "px)";
}
function wischEnde(ev, el, i, abbruch){
  clearTimeout(langDruck);
  const dx = wisch ? wisch.dx : 0;
  const quer = wisch && wisch.quer;
  wisch = null;
  el.style.transition = "transform .18s ease";
  el.style.transform = "translateX(0)";
  if(abbruch || !quer || Math.abs(dx) < 90) return;
  ev.preventDefault();
  const m = S.mails[i];
  if(!m) return;
  if(dx > 0 && S.rollen.archiv) stapelVerschieben(S.rollen.archiv, [m.uid]);
  else if(dx > 0) melde(txt("k.kein_archiv"), false);
  else stapelLoeschen([m.uid]);
}
async function siebUm(){
  S.sieb = S.sieb ? "" : "ungelesen";
  S.seite = 1;
  await ladeListe(true);
}
</script>

<script>
/* ── Reading ───────────────────────────────────────────────────────────── */
async function mailOeffnen(uid, ordner){
  clearTimeout(S.lesemarke);
  S.uid = uid;
  blick("mail");
  $("#mailkopf").textContent = "";
  $("#mailrumpf").innerHTML = `<div class="leerraum"><span class="laedt"></span></div>`;
  $("#tatleiste").innerHTML = "";
  let m;
  try{ m = await sende("klient_mail", {ordner:ordner || ordnerVon(uid), uid:uid,
                                       hell:istHell()}); }
  catch(e){ return; }
  if(!m || !m.ok){
    $("#mailrumpf").innerHTML = `<div class="leerraum">${
      esc((m && m.text) || txt("k.ging_nicht"))}</div>`;
    return;
  }
  S.offen = m;
  mailMalen();
  const inListe = S.mails.find(x => x.uid === uid);
  if(m.gelesen && inListe && !inListe.gelesen){ inListe.gelesen = true; listeMalen(); }
  const nach = Number(S.einst.gelesen_nach);
  if(nach > 0 && !m.gelesen)
    S.lesemarke = setTimeout(() => { if(S.uid === uid) stapel("gelesen", true, [uid]); },
                             nach * 1000);
}
function mailMalen(){
  const m = S.offen;
  if(!m) return;
  $("#mailkopf").textContent = m.von || m.adresse;
  const an = (m.an || []).map(a => a.name || a.adresse).join(", ");
  const w = m.wache || {};
  const schub = (S.schubladen || {})[w.klasse] || {};
  const hinweise = [];
  if(m.phishing)
    hinweise.push(`<div class="warnleiste"><span>🚨</span><span><b>${
      esc(txt("k.phishing"))}</b> ${esc(m.phishing)}</span></div>`);
  if((m.links_verdacht || []).length)
    hinweise.push(`<div class="warnleiste mild"><div><b>${
      esc(txt("k.links_verdacht", {n:m.links_verdacht.length}))}</b>${
      m.links_verdacht.map(x => `<div class="kleiner" style="margin-top:.2rem">${
        esc(x.text || "—")} → <b>${esc(x.wirt)}</b></div>`).join("")}</div></div>`);
  if(m.fern_blockiert)
    hinweise.push(`<div class="warnleiste mild"><span>🖼️</span><span>${
      esc(txt("k.bilder_blockiert", {n:m.fern_blockiert}))}</span>
      <button onclick="bilderLaden()">${esc(txt("k.bilder_laden"))}</button></div>`);
  const chips = [];
  if(w.klasse || w.ordner)
    chips.push(`<span class="chip info">🛡️ ${
      w.klasse ? esc((schub.icon || "") + " " + (schub.name || w.klasse)) : ""}${
      w.zeige ? " · " + esc(txt("k.wache_ordner", {o:w.zeige})) : ""}</span>`);
  if(w.ordner && w.ordner !== offenOrdner())
    chips.push(`<span class="chip tat" onclick="wieWache(${m.uid},'${escJs(m.adresse)}')"
      >➜ ${esc(txt("k.wie_wache"))}</span>`);
  if(m.abmelden)
    chips.push(`<a class="chip tat" href="${esc(m.abmelden)}" target="_blank"
      rel="noopener noreferrer">📰 ${esc(txt("k.abmelden_link"))}</a>`);
  const anhaenge = (m.anhaenge || []).map(x => {
    const url = "/api/klient/anhang?pf=" + encodeURIComponent(S.pf) + "&ordner="
      + encodeURIComponent(offenOrdner()) + "&uid=" + m.uid + "&t=" + encodeURIComponent(x.t)
      + "&k=" + encodeURIComponent(x.k) + "&n=" + encodeURIComponent(x.n);
    const ic = x.art === "bild" ? "🖼️" : (x.art === "dokument" ? "📄" : "📎");
    return `<a class="anh" href="${esc(url)}" download="${esc(x.n)}"><span>${ic}</span>
      <span class="nm">${esc(x.n)}</span><span class="gr">${esc(gr(x.b))}</span></a>`;
  }).join("");
  $("#mailrumpf").innerHTML = `
    <div class="wer">
      <span class="kreis" style="background:${farbe(m.adresse)}"
        >${esc(initialen(m.von, m.adresse))}</span>
      <div class="txt"><b>${esc(m.von || m.adresse)}</b>
        <div class="adr">${esc(m.adresse)}</div>
        <div class="kleiner leise">${esc(langesDatum(m.zeit))} · ${esc(gr(m.groesse))}</div>
        ${an ? `<div class="kleiner leise">${esc(txt("k.an"))}: ${esc(an)}</div>` : ""}
      </div>
    </div>
    <div class="betreff">${esc(m.betreff || txt("k.ohne_betreff"))}</div>
    ${hinweise.join("")}
    ${chips.length ? `<div class="bahn">${chips.join("")}</div>` : ""}
    ${anhaenge ? `<div class="anhangreihe">${anhaenge}</div>` : ""}
    <iframe id="brief" title="${esc(txt("k.brief"))}"
      sandbox="allow-same-origin allow-popups allow-popups-to-escape-sandbox"
      srcdoc="${esc(m.rahmen || "")}" onload="briefHoehe()"></iframe>`;
  $("#tatleiste").innerHTML = [
    `<button onclick="verfassen('antwort',${m.uid})"
       aria-label="${esc(txt("k.antworten"))}">↩</button>`,
    `<button onclick="verfassen('weiter',${m.uid})"
       aria-label="${esc(txt("k.weiterleiten"))}">➦</button>`,
    `<button onclick="stapel('markiert',${!m.markiert},[${m.uid}])"
       aria-label="${esc(txt("k.markieren"))}">${m.markiert ? "★" : "☆"}</button>`,
    `<button onclick="stapel('gelesen',${!m.gelesen},[${m.uid}])"
       aria-label="${esc(txt(m.gelesen ? "k.ungelesen" : "k.gelesen"))}"
       >${m.gelesen ? "✉️" : "📖"}</button>`,
    `<button class="gefahr" onclick="stapelLoeschen([${m.uid}])"
       aria-label="${esc(txt("k.loeschen"))}">🗑️</button>`,
    `<button onclick="mehrTaten()" aria-label="${esc(txt("k.mehr"))}">⋯</button>`,
  ].join("");
}
function briefHoehe(){
  const f = $("#brief");
  if(!f) return;
  const messen = () => {
    try{
      const d = f.contentDocument;
      if(d && d.body) f.style.height = Math.max(180, d.body.scrollHeight + 28) + "px";
    }catch(e){ f.style.height = "60vh"; }
  };
  messen(); setTimeout(messen, 350); setTimeout(messen, 1200);
}
function mailNachbar(d){
  const i = S.mails.findIndex(m => m.uid === S.uid);
  const n = S.mails[i + d];
  if(n) mailOeffnen(n.uid, n.ordner); else melde(txt(d > 0 ? "k.letzte_mail" : "k.erste_mail"));
}
async function mehrTaten(){
  const m = S.offen;
  if(!m) return;
  zielAuf([m.uid]);
}
async function bilderLaden(){
  const m = await sende("klient_mail", {ordner:offenOrdner(), uid:S.uid, bilder:1,
                                        hell:istHell()});
  if(m && m.ok){ S.offen = m; mailMalen(); }
}

/* ── Acting ──────────────────────────────────────────────────────────────
   🔴 Every action asks the ROW which folder it is in, and a selection is split
   by folder before anything is sent. In a folder that is one group and one
   request, exactly as before; in „New" the chosen mails can live in six folders
   and one `S.ordner` would have hit the wrong mail in five of them. */
const STAPEL_STUECK = 500;
function nachOrdnern(liste){
  const karte = new Map();
  for(const p of liste){
    if(!karte.has(p.ordner)) karte.set(p.ordner, []);
    karte.get(p.ordner).push(p.uid);
  }
  /* 🔴 Now that „select all" also means what is not loaded, a group can hold
     thousands of numbers. One request over all of them would run for minutes —
     on a phone all the more, where the connection changes. So: short
     requests. */
  const raus = [];
  for(const [ordner, uids] of karte)
    for(let i = 0; i < uids.length; i += STAPEL_STUECK)
      raus.push([ordner, uids.slice(i, i + STAPEL_STUECK)]);
  return raus;
}
async function stapel(was, an, uids){
  const liste = posten(uids);
  if(!liste.length) return melde(txt("k.nichts_gewaehlt"), false);
  uids = liste.map(p => p.uid);
  let gut = true;
  for(const [ordner, teil] of nachOrdnern(liste)){
    const r = await sende("klient_flaggen", {ordner:ordner, uids:teil, was:was, an:an});
    if(!r.ok){ gut = false; melde(r.text || txt("k.ging_nicht"), false); continue; }
    const o = S.ordner_liste.find(x => x.name === ordner);
    if(was === "gelesen" && o)
      o.ungelesen = Math.max(0, (o.ungelesen || 0) + (an ? -teil.length : teil.length));
  }
  if(!gut) return;
  S.mails.forEach(m => { if(uids.includes(m.uid)) m[was] = an; });
  if(S.offen && uids.includes(S.offen.uid)){ S.offen[was] = an; mailMalen(); }
  if(S.wahl) wahlAus(); else listeMalen();
  fussMalen();
}
async function stapelVerschieben(ziel, uids){
  return verschiebeListe(ziel, posten(uids));
}
async function verschiebeListe(ziel, liste){
  if(!liste.length) return melde(txt("k.nichts_gewaehlt"), false);
  let gut = true, zahl = 0, letzte = "";
  for(const [ordner, teil] of nachOrdnern(liste)){
    if(ordner === ziel) continue;             // already there — nothing to do
    const r = await sende("klient_verschieben", {ordner:ordner, uids:teil, ziel:ziel});
    if(r.ok){ zahl += teil.length; letzte = r.text || letzte; }
    else { gut = false; melde(r.text || txt("k.ging_nicht"), false); }
  }
  if(gut) melde(letzte, true);
  if(S.wahl) wahlAus();
  if(zahl) await nachTat(liste.map(p => p.uid), liste);
}
async function stapelLoeschen(uids){
  const liste = posten(uids);
  if(!liste.length) return melde(txt("k.nichts_gewaehlt"), false);
  uids = liste.map(p => p.uid);
  /* 🔴 One mail is not „1 mails". A count that reads as a sentence needs both
     forms — everywhere else the number stands at the end, where no form is
     needed at all. */
  const frage = uids.length === 1 ? txt("k.loeschen_sicher_eine")
                                  : txt("k.loeschen_sicher", {n:uids.length});
  if(S.einst.sicherheitsfrage && !confirm(frage)) return;
  let gut = true, letzte = "";
  for(const [ordner, teil] of nachOrdnern(liste)){
    const r = await sende("klient_loeschen", {ordner:ordner, uids:teil});
    if(r.ok) letzte = r.text || letzte;
    else { gut = false; melde(r.text || txt("k.ging_nicht"), false); }
  }
  if(S.wahl) wahlAus();
  if(gut){ melde(letzte, true); await nachTat(uids, liste); }
}
async function wieWache(uid, adresse){
  const r = await sende("klient_wie_wache", {ordner:ordnerVon(uid), uids:[uid],
                                             adresse:adresse});
  melde(r.text || (r.ok ? "" : txt("k.ging_nicht")), r.ok);
  if(r.ok) await nachTat([uid]);
}
async function nachTat(uids, liste){
  const stelle = S.mails.findIndex(m => m.uid === S.uid);
  /* 🔴 By KEY where the caller knows the folders — in the „New" view the same
     number stands in three folders, and filtering by number alone would take
     rows out of the list that nothing happened to. */
  const weg = new Set((liste || []).map(p => p.ordner + "\u0000" + p.uid));
  S.mails = S.mails.filter(m => liste ? !weg.has(wahlSchluessel(m))
                                      : !uids.includes(m.uid));
  listeMalen();
  if(uids.includes(S.uid)){
    const naechste = S.mails[Math.min(stelle, S.mails.length - 1)];
    S.uid = 0; S.offen = null;
    /* On a phone the list is the place to come back to — opening the next mail
       by itself would take the reader somewhere they did not ask to go. */
    blick("liste");
    if(naechste) S.uid = naechste.uid;
  }
  await listeNachfuellen();
  const l = await sende("klient_ordner", {frisch:true});
  if(l.ok){ S.ordner_liste = l.ordner || S.ordner_liste; ordnerMalen(); fussMalen(); }
}
/* 🔴 Removing the rows by hand is the INSTANT answer, the refill is the RIGHT
   one. Deleting 50 of 100 left the list EMPTY — the remaining fifty sat on the
   next page, and „more" was gone with them. The phone stacks its pages, so it
   asks for the span it has already shown: ONE request, and the reader keeps
   their place. */
async function listeNachfuellen(){
  if(S.suche) return;                 // hits are not a folder page
  if(S.neu) return ladeListe(false);
  const wunsch = Math.max(S.pro, Math.min(200, S.pro * (S.seite || 1)));
  const a = await sende("klient_liste", {ordner:S.ordner, seite:1, sieb:S.sieb,
                                         suche:"", feld:"alle", pro_seite:wunsch});
  if(!a || a.ok === false) return;
  S.mails = a.mails || [];
  S.gesamt = a.gesamt || 0;
  S.seiten = Math.max(1, Math.ceil(S.gesamt / S.pro));
  S.seite = Math.min(S.seiten, Math.max(1, Math.ceil(S.mails.length / S.pro)));
  const u = $("#ungelesen");
  u.hidden = !a.ordner_ungelesen;
  u.textContent = a.ordner_ungelesen || "";
  const o = S.ordner_liste.find(x => x.name === S.ordner);
  if(o){ o.gesamt = a.ordner_gesamt; o.ungelesen = a.ordner_ungelesen; }
  listeMalen();
  fussMalen();
}

/* ── Search ────────────────────────────────────────────────────────────── */
function suchchipsMalen(){
  const felder = [["alle","k.feld_alle"],["von","k.feld_von"],["betreff","k.feld_betreff"],
                  ["an","k.feld_an"],["text","k.feld_text"]];
  $("#suchchips").innerHTML = felder.map(([v, k]) =>
    `<button class="${S.feld === v ? "an" : ""}" onclick="S.feld='${v}';suchchipsMalen();
      if($('#suche').value)sucheLos()">${esc(txt(k))}</button>`).join("");
}
async function sucheLos(){
  S.suche = $("#suche").value.trim();
  if(!S.suche) return;
  $("#suchtreffer").innerHTML = `<div class="leerraum"><span class="laedt"></span></div>`;
  const a = await sende("klient_liste", {ordner:S.ordner, seite:1, suche:S.suche,
                                         feld:S.feld, pro_seite:50});
  if(!a.ok) return melde(a.text || txt("k.ging_nicht"), false);
  if(!(a.mails || []).length){
    $("#suchtreffer").innerHTML = `<div class="leerraum"><div>
      <span class="gross">🔍</span>${esc(txt("k.nichts_gefunden"))}</div></div>`;
    return;
  }
  /* 🔴 The hits go into the list as well — otherwise tapping one opens a mail the
     list does not know, and the next/previous buttons jump somewhere else. */
  S.mails = a.mails;
  S.seite = 1; S.seiten = a.seiten || 1;
  listeMalen();
  $("#suchtreffer").innerHTML =
    `<div class="gruppentitel">${esc(txt("k.spanne", {von:1,
       bis:Math.min(a.gesamt, a.mails.length), n:a.gesamt}))}</div>`
    + a.mails.map(m => zeileHtml(m)).join("");
}
</script>

<script>
/* ── Writing ───────────────────────────────────────────────────────────── */
async function verfassen(art, uid){
  const v = await sende("klient_vorlage", {art:art, ordner:ordnerVon(uid), uid:uid || 0});
  if(!v || !v.ok) return melde((v && v.text) || txt("k.ging_nicht"), false);
  S.brief = {art:art, quelle:v.quelle || null, in_antwort_auf:v.in_antwort_auf || "",
             anhaenge:[], uebernahme:(v.anhaenge || []).map(a =>
               Object.assign({}, a, {ordner:(v.quelle || {}).ordner,
                                     uid:(v.quelle || {}).uid}))};
  $("#schreibkopf").textContent = txt({neu:"k.neue_mail", antwort:"k.antworten",
    antwort_alle:"k.allen", weiter:"k.weiterleiten"}[art] || "k.neue_mail");
  $("#s_an").value = v.an || "";
  $("#s_kopie").value = v.kopie || "";
  $("#s_betreff").value = v.betreff || "";
  $("#s_text").value = v.text || "";
  $("#s_kopiereihe").hidden = !v.kopie;
  $("#s_mehr").hidden = !!v.kopie;
  anhaengeMalen();
  blick("schreiben");
  setTimeout(() => {
    const feld = (art === "neu" || art === "weiter") ? $("#s_an") : $("#s_text");
    feld.focus();
    if(feld === $("#s_text") && S.einst.zitat !== "oben"){
      feld.setSelectionRange(0, 0);
      /* 🔴 And to the top. Setting the cursor is not the same as scrolling
         there — the first line of the quote was cut off at the upper edge. */
      feld.scrollTop = 0;
    }
  }, 90);
}
function schreibenZu(){
  const leer = !$("#s_an").value && !$("#s_betreff").value.trim()
               && !$("#s_text").value.replace(/\s/g, "");
  if(!leer && !confirm(txt("k.verwerfen_sicher"))) return;
  blick(S.offen ? "mail" : "liste");
}
function anhaengeMalen(){
  const b = S.brief || {anhaenge:[], uebernahme:[]};
  $("#s_anhaenge").innerHTML = b.anhaenge.map((a, i) =>
    `<span class="anh"><span>📎</span><span class="nm">${esc(a.name)}</span>
      <span class="gr">${esc(gr(a.gross))}</span>
      <button class="blank kleiner" onclick="S.brief.anhaenge.splice(${i},1);anhaengeMalen()"
        aria-label="✕">✕</button></span>`).join("")
    + b.uebernahme.map((a, i) =>
    `<span class="anh"><span>↪</span><span class="nm">${esc(a.n)}</span>
      <span class="gr">${esc(gr(a.b))}</span>
      <button class="blank kleiner" onclick="S.brief.uebernahme.splice(${i},1);anhaengeMalen()"
        aria-label="✕">✕</button></span>`).join("");
}
function dateienNehmen(dateien){
  const grenze = (S.einst.anhang_grenze || 25) * 1024 * 1024;
  [...dateien].forEach(d => {
    const schon = S.brief.anhaenge.reduce((s, a) => s + a.gross, 0);
    if(schon + d.size > grenze)
      return melde(txt("k.anhang_gross", {mb:S.einst.anhang_grenze || 25}), false);
    const leser = new FileReader();
    leser.onload = () => {
      S.brief.anhaenge.push({name:d.name, typ:d.type || "", gross:d.size,
        b64:String(leser.result).split(",")[1] || ""});
      anhaengeMalen();
    };
    leser.readAsDataURL(d);
  });
  $("#s_datei").value = "";
}
function briefFelder(){
  const b = S.brief || {};
  return {an:$("#s_an").value, kopie:$("#s_kopie").value, blind:"",
    betreff:$("#s_betreff").value, text:$("#s_text").value,
    anhaenge:b.anhaenge || [], uebernahme:b.uebernahme || [],
    in_antwort_auf:b.in_antwort_auf || "", quelle:b.quelle || null};
}
async function senden(){
  const k = $("#sendeknopf");
  k.disabled = true;
  k.innerHTML = '<span class="laedt"></span>';
  let r;
  try{ r = await sende("klient_senden", briefFelder()); }
  catch(e){ k.disabled = false; k.textContent = txt("k.senden"); return; }
  k.disabled = false;
  k.textContent = txt("k.senden");
  melde(r.text || (r.ok ? "" : txt("k.ging_nicht")), r.ok);
  if(r.ok){
    S.brief = {anhaenge:[], uebernahme:[]};
    ["#s_an", "#s_kopie", "#s_betreff", "#s_text"].forEach(id => $(id).value = "");
    blick("liste");
    await allesLaden();
  }
}
async function entwurfSpeichern(){
  const r = await sende("klient_entwurf", briefFelder());
  melde(r.text || (r.ok ? "" : txt("k.ging_nicht")), r.ok);
}
let vorschlag_zeit = null;
function vorschlagSuchen(el){
  clearTimeout(vorschlag_zeit);
  const kasten = $("#vorschlag_" + el.id.slice(2));
  const stuecke = String(el.value).split(",");
  const frage = (stuecke[stuecke.length - 1] || "").trim();
  if(frage.length < 2){ kasten.classList.remove("auf"); return; }
  vorschlag_zeit = setTimeout(async () => {
    const r = await sende("klient_adressbuch", {q:frage});
    const t = r.treffer || [];
    if(!t.length){ kasten.classList.remove("auf"); return; }
    kasten.innerHTML = t.map((x, i) =>
      `<div onclick="vorschlagNehmen('${escJs(el.id)}',${i})">${
        esc(x.name || x.adresse)}<small>${esc(x.adresse)}</small></div>`).join("");
    kasten._treffer = t;
    kasten.classList.add("auf");
  }, 200);
}
function vorschlagNehmen(feldId, i){
  const el = $("#" + feldId), kasten = $("#vorschlag_" + feldId.slice(2));
  const x = (kasten._treffer || [])[i];
  if(!x) return;
  const vor = String(el.value).split(",").slice(0, -1);
  const name = x.name && x.name.includes(",") ? '"' + x.name.replace(/"/g, "") + '"'
                                              : x.name;
  el.value = vor.concat([" " + (name ? name + " <" + x.adresse + ">" : x.adresse)])
                .join(",").replace(/^\s*,?\s*/, "") + ", ";
  kasten.classList.remove("auf");
  el.focus();
}

/* ── More: the settings, drawn from what the engine describes ───────────── */
function mehrMalen(){
  const e = S.einst;
  const stueck = (f) => {
    const wert = e[f.s];
    const titel = esc(txt(f.titel));
    const hilfe = txt(f.hilfe);
    const kopf = `<div class="txt"><b>${titel}</b>${
      hilfe === f.hilfe ? "" : `<span>${esc(hilfe)}</span>`}</div>`;
    if(f.art === "knebel")
      return `<div class="reihe">${kopf}<div class="knebel" role="switch"
        tabindex="0" aria-checked="${!!wert}" aria-label="${titel}"
        onclick="einstellungSetzen('${f.s}',${!wert})"></div></div>`;
    if(f.art === "wahl")
      return `<div class="reihe">${kopf}<div class="stell"><select aria-label="${titel}"
        onchange="einstellungSetzen('${f.s}',this.value)">${
        (f.optionen || []).map(([v, k]) => `<option value="${esc(v)}"${
          String(v) === String(wert) ? " selected" : ""}>${esc(txt(k))}</option>`)
          .join("")}</select></div></div>`;
    if(f.art === "zahl")
      return `<div class="reihe">${kopf}<div class="stell">
        <input type="range" min="${f.tief}" max="${f.hoch}" step="${f.schritt}"
          value="${wert}" aria-label="${titel}"
          onchange="einstellungSetzen('${f.s}',Number(this.value))"></div></div>`;
    if(f.art === "ordner")
      return `<div class="reihe">${kopf}<div class="stell"><select aria-label="${titel}"
        onchange="einstellungSetzen('${f.s}',this.value)">
        <option value="">${esc(txt("k.o_automatisch"))}</option>${
        S.ordner_liste.filter(o => o.waehlbar).map(o =>
          `<option value="${esc(o.name)}"${o.name === wert ? " selected" : ""}>${
          esc(o.pfad)}</option>`).join("")}</select></div></div>`;
    if(f.mehrzeilig)
      return `<div style="padding:.6rem 0;border-top:1px solid var(--rand)">
        <label>${titel}</label><textarea rows="4"
          onchange="einstellungSetzen('${f.s}',this.value)">${esc(wert || "")}</textarea></div>`;
    return `<div style="padding:.6rem 0;border-top:1px solid var(--rand)">
      <label>${titel}</label><input value="${esc(wert || "")}"
      onchange="einstellungSetzen('${f.s}',this.value)"></div>`;
  };
  /* 🔴 `nur_breit` comes from the engine: a switch for „preview pane on the
     right" has no meaning on a phone, and offering it would be a promise the
     layout cannot keep. */
  const gruppen = (S.oberflaeche || []).map(g => {
    const felder = (g.felder || []).filter(f => !f.nur_breit);
    if(!felder.length) return "";
    return `<div class="gruppe"><h3>${esc(txt(g.titel))}</h3>
      <div class="klein leise">${esc(txt(g.hilfe))}</div>
      ${felder.map(stueck).join("")}</div>`;
  });
  const s = S.smtp || {};
  gruppen.push(`<div class="gruppe"><h3>${esc(txt("k.g_senden"))}</h3>
    <div class="klein leise">${esc(txt("k.g_senden_hilfe"))}</div>
    <div class="feld"><label>${esc(txt("k.smtp_server"))}</label>
      <input id="m_server" value="${esc(s.server || "")}"
        inputmode="url" autocapitalize="off" autocorrect="off"></div>
    <div style="display:flex;gap:.5rem">
      <div class="feld" style="flex:0 0 7rem"><label>${esc(txt("k.smtp_port"))}</label>
        <input id="m_port" class="zahl" inputmode="numeric" value="${esc(s.port || 587)}"></div>
      <div class="feld" style="flex:1 1 auto"><label>${esc(txt("k.smtp_art"))}</label>
        <select id="m_art">
          <option value="starttls"${s.art === "starttls" ? " selected" : ""}>STARTTLS</option>
          <option value="ssl"${s.art === "ssl" ? " selected" : ""}>SSL/TLS</option>
          <option value="klar"${s.art === "klar" ? " selected" : ""}>${
            esc(txt("k.o_klar"))}</option></select></div>
    </div>
    <div class="feld"><label>${esc(txt("k.smtp_benutzer"))}</label>
      <input id="m_benutzer" value="${esc(s.benutzer || "")}"
        inputmode="email" autocapitalize="off" autocorrect="off"></div>
    <div class="feld"><label>${esc(txt("k.smtp_passwort"))}</label>
      <input id="m_passwort" type="password" autocomplete="new-password"
        placeholder="${esc(s.passwort_da ? txt("k.unveraendert") : txt("k.wie_imap"))}"></div>
    <div class="feld"><label>${esc(txt("k.absender_name"))}</label>
      <input id="m_name" value="${esc(s.absender_name || "")}"></div>
    <div style="display:flex;gap:.5rem;flex-wrap:wrap">
      <button class="haupt" onclick="smtpSpeichern()">${esc(txt("k.speichern"))}</button>
      <button onclick="smtpPruefen()">${esc(txt("k.verbindung_pruefen"))}</button>
    </div></div>`);
  gruppen.push(`<div class="gruppe"><h3>${esc(txt("k.g_zugang"))}</h3>
    <div class="feld"><label>${esc(txt("k.wort_alt"))}</label>
      <input id="m_alt" type="password" autocomplete="current-password"></div>
    <div class="feld"><label>${esc(txt("k.wort_neu"))}</label>
      <input id="m_neu" type="password" autocomplete="new-password"></div>
    <div style="display:flex;gap:.5rem;flex-wrap:wrap">
      <button onclick="wortAendern()">${esc(txt("k.wort_aendern"))}</button>
      <button onclick="abmelden()">🔒 ${esc(txt("k.abmelden"))}</button>
    </div></div>`);
  /* The way to the wide page — and it STAYS there: the server remembers the
     choice, otherwise the next tap on the link lands back here. */
  gruppen.push(`<div class="gruppe"><h3>${esc(txt("k.ansicht"))}</h3>
    <div class="klein leise">${esc(txt("k.ansicht_hilfe"))}</div>
    <div style="display:flex;gap:.5rem;flex-wrap:wrap;padding:.6rem 0">
      <button onclick="location.href='/post?ansicht=breit'">🖥️ ${
        esc(txt("k.breite_ansicht"))}</button>
      <button onclick="location.href='/?wache=1'">🛡️ ${esc(txt("k.zum_waechter"))}</button>
    </div></div>`);
  gruppen.push(`<div class="klein leise" style="text-align:center;padding:.2rem 0 1rem">
    Postwache ${esc(S.version)}</div>`);
  $("#mehrleib").innerHTML = gruppen.join("");
}
async function einstellungSetzen(schluessel, wert){
  const r = await sende("klient_einstellung", {werte:{[schluessel]:wert}});
  if(!r.ok) return melde(r.text || txt("k.ging_nicht"), false);
  S.einst = r.einst || S.einst;
  document.documentElement.style.setProperty("--schrift", (S.einst.schrift || 100) + "%");
  if(["pro_seite", "sortierung", "richtung", "nur_ungelesen"].includes(schluessel)){
    S.pro = S.einst.pro_seite; S.seite = 1;
    await ladeListe(true);
  }
  if(["bilder", "html_zuerst", "wache_grund"].includes(schluessel) && S.uid)
    await mailOeffnen(S.uid);
  mehrMalen();
}
async function smtpSpeichern(){
  const r = await sende("klient_smtp", {server:$("#m_server").value,
    port:$("#m_port").value, art:$("#m_art").value, benutzer:$("#m_benutzer").value,
    passwort:$("#m_passwort").value, absender_name:$("#m_name").value});
  melde(r.text, r.ok);
  if(r.ok){ S.smtp = r.smtp || S.smtp; mehrMalen(); }
}
async function smtpPruefen(){
  const r = await sende("klient_smtp_pruefen", {});
  melde(r.text, r.ok);
}
async function wortAendern(){
  const neu = $("#m_neu").value;
  if(neu.length < 8) return melde(txt("k.wort_kurz"), false);
  const r = await sende("klient_wort", {neu:neu, alt:$("#m_alt").value});
  melde(r.text, r.ok);
  if(r.ok) torZeigen({wort:true, an:false});
}

/* ── Start ─────────────────────────────────────────────────────────────── */
/* 🔴 The hardware back button. Without this it leaves the page — and on a phone
   that is the most natural gesture there is. Each sheet pushes one state, and
   „back" goes to the list instead of out of the app. */
window.addEventListener("popstate", () => {
  /* 🔑 Back leaves the innermost thing first. Choosing several IS a state the
     reader is inside — jumping straight out of the sheet would leave a mode on
     that nothing on the next screen explains. */
  if(S.wahl){ wahlAus(); history.pushState({}, ""); return; }
  if(S.blick === "liste") return;
  blick("liste");
  history.pushState({}, "");
});
history.pushState({}, "");
/* 🔴 Browser storage can be switched off or throw — in a private window it does.
   The hint is a convenience, so it must never take the page down with it. */
function wischHinweisWeg(){
  $("#wischhinweis").hidden = true;
  try{ localStorage.setItem("pw_wisch", "1"); }catch(e){ /* then it comes again */ }
}
function wischHinweisZeigen(){
  let gesehen = "1";
  try{ gesehen = localStorage.getItem("pw_wisch") || ""; }catch(e){ gesehen = "1"; }
  if(!gesehen && ("ontouchstart" in window)) $("#wischhinweis").hidden = false;
}
textenSetzen(document);
lichtAnwenden(false);           /* the button needs its sign and its word */
wahlMalen();
wischHinweisZeigen();
ordnerHinweisZeigen();
suchchipsMalen();
fussMalen();
allesLaden();
/* ── The listening post ─────────────────────────────────────────────────────
   🔑 New mail has to show up BY ITSELF. So the phone does not ask every minute —
   it LISTENS: one request stays waiting, and the server answers it the moment the
   provider says a word (IMAP IDLE). The same loop is the fallback, so there is
   only ONE place that decides how often anything happens. */
const HORCH = {stand:0, marken:{}};
function schlafen(ms){ return new Promise(r => setTimeout(r, ms)); }
function angemeldet(){ return !$("#tor").classList.contains("auf"); }
function horchOrte(){
  const orte = ["INBOX"];
  for(const o of [S.rollen.posteingang, S.ordner])
    if(o && orte.indexOf(o) < 0) orte.push(o);
  return orte;
}
async function horchSchleife(){
  while(true){
    /* A phone in a pocket asks for nothing — the screen is off, the tab is
       hidden, and the listening post lets go of its connection by itself.
       Picking the phone up refreshes at once, see `visibilitychange`. */
    if(document.hidden || !angemeldet()){ await schlafen(1500); continue; }
    let a = null;
    try{
      a = await sende("klient_horch", {ordner:horchOrte(), stand:HORCH.stand, warte:20});
    }catch(e){ a = null; }
    if(!a || a.ok === false){ await schlafen(20000); await nachziehen(false); continue; }
    const vorher = HORCH.marken;
    HORCH.marken = a.marken || {};
    HORCH.stand = a.stand || 0;
    /* 🔴 The first answer has no „before" — keeping it and doing nothing is the
       point, otherwise every start would refetch the list it just drew. */
    if(!Object.keys(vorher).length) continue;
    let etwas = false, neuePost = false;
    for(const ort in HORCH.marken){
      const v = vorher[ort], n = HORCH.marken[ort];
      if(!v) continue;
      if(v.join() !== n.join()) etwas = true;
      if(n[2] > v[2]) neuePost = true;      // UIDNEXT only grows when post ARRIVES
    }
    if(etwas) await nachziehen(neuePost);
  }
}
/* 🔴 Nothing is redrawn under a thumb: while writing, while choosing several,
   while a field has the keyboard up, or in a search. The folder NUMBERS are
   updated anyway — a badge steals nobody's tap. */
async function nachziehen(neuePost){
  if(S.laeuft || !angemeldet() || S.blick === "schreiben") return;
  try{
    const l = await sende("klient_ordner", {frisch:true});
    if(!l.ok) return;
    const vorher = (S.ordner_liste.find(o => o.name === S.ordner) || {}).gesamt;
    S.ordner_liste = l.ordner || S.ordner_liste;
    ordnerMalen(); fussMalen();
    const jetzt = (S.ordner_liste.find(o => o.name === S.ordner) || {}).gesamt;
    if(S.wahl || S.suche) return;
    if(/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName || "")) return;
    if(S.blick !== "liste") return;
    if(S.neu) await ladeListe(false);
    else if(neuePost || jetzt !== vorher) await listeNachfuellen();
  }catch(e){ /* the next round tries again */ }
}
document.addEventListener("visibilitychange", () => {
  if(!document.hidden && angemeldet()) nachziehen(false);
});
horchSchleife();
</script>
