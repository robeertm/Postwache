<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<!-- 🔴 `viewport-fit=cover` plus the safe-area insets below. Without it the bottom
     bar of an iPhone sits UNDER the home indicator and the last button cannot be
     pressed — the kind of thing only a real phone shows you. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 🔴 `apple-mobile-web-app-capable` + `…-status-bar-style: black-translucent`
     used to stand here, and they were the whole trouble. With them a page put
     on the home screen is DRAWN from the very top of the screen but MEASURED
     as though it began below the status bar. Measured on iOS 18.7: screen 912,
     `innerHeight` 844 — 68 px, exactly the status bar, and they pile up at the
     BOTTOM, underneath the tab bar, where nothing can go.
     DocuSort never carried them and never had the gap. Its head is the pattern
     here: `viewport-fit=cover` for the safe areas, `theme-color` for the bar
     the system now paints itself — which is why the colour has to follow the
     light, in the script below and in `lichtAnwenden()`. -->
<meta name="theme-color" content="#12100c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Postwache">
<title>Postwache</title>
<script>
/* 🔴 In the HEAD, and nowhere else. This decides the colours BEFORE the page is
   drawn; one line further down and the reader watches the night flash past on
   the way to the day. It reads the choice and nothing else — the machinery
   lives below, with the other functions. */
(function(){
  /* 🔴 NIGHT is the default, full stop — not „whatever the device says". The
     Postwache is a dark house; a device set to light would otherwise hand a
     first-time visitor a page they never chose. Only an explicit „hell" turns
     the light on: the one in the store, or the one in the address.
     🔴 `licht`, NOT `ansicht` — for the parameter AND for the slot. The word
     „Ansicht" was already taken twice: `?ansicht=breit` / `?ansicht=mobil` picks
     which of the two surfaces is served (a cookie, written by the server), and
     the watchman page remembered its open TAB under `pw_ansicht` in the same
     store. Two meanings in one slot erase each other: opening the watchman page
     wrote „uebersicht" over the light choice, and the light button wrote „hell"
     over the remembered tab. The switch worked every single time — its memory
     was taken from underneath it, which is why it looked broken and not wrong.
     One slot, one meaning: `pw_licht`. */
  var wahl = "";
  try{ wahl = new URLSearchParams(location.search).get("licht") || ""; }catch(e){}
  if(wahl !== "hell" && wahl !== "dunkel"){
    wahl = "";
    try{ wahl = localStorage.getItem("pw_licht") || ""; }catch(e){}
  }
  if(wahl === "hell"){
    document.documentElement.setAttribute("data-hell", "1");
    /* 🔴 And the colour of the bar the system paints, BEFORE the first paint.
       `lichtAnwenden()` further down keeps it in step afterwards, but it runs
       only once the page is alive — and while `black-translucent` was set this
       never showed, because the page drew its own ground under the status bar.
       Now the system draws it, and a day-mode start would flash a black bar
       over a paper page. The value is the day ground `--grund`. */
    var marke = document.querySelector('meta[name="theme-color"]');
    if(marke) marke.setAttribute("content", "#f5efe3");
  }
})();
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%AC%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2312100c'/%3E%3Ctext y='.85em' x='8' font-size='76'%3E%F0%9F%93%AC%3C/text%3E%3C/svg%3E">
<style>
/* ── The phone version ────────────────────────────────────────────────────
   🔑 Not the wide page made narrow. A phone is a different device: one thing at a
   time, thumbs instead of a mouse, no hover, and a bottom bar because the top of a
   6-inch screen is out of reach. Same colours, same words, same engine — a
   different shape.
   Everything that can be touched is at least 44 px: below that, people miss. */
:root{
  color-scheme: dark;
  --grund:#12100c;
  --karte:rgba(255,255,255,.05); --karte2:rgba(255,255,255,.08);
  --karte-voll:#1d1b17;
  --rand:rgba(255,255,255,.11); --rand2:rgba(255,255,255,.2);
  --text:#f4efe6; --leise:#a99c88; --leiser:#7d7264;
  /* 🔑 TWO golds: `--akzent` writes, `--akzent-fuell` fills. In the dark they
     are the same colour; on paper #e0a458 as text is a hint, not a word. */
  --akzent:#e0a458; --akzent-fuell:#e0a458; --akzent-tief:#2a1d0a;
  --ok:#34d399; --info:#60a5fa; --warnung:#fbbf24; --kritisch:#f87171;
  --film:rgba(255,255,255,.06); --film2:rgba(255,255,255,.12);
  --feld:rgba(0,0,0,.3); --griff:#e7ddcd;
  --schatten:rgba(0,0,0,.5);
  --gefahr:#fca5a5; --warnton:#fcd34d; --briefgrund:#161410;
  /* The bars at the top and the bottom lie OVER the list — translucent, with the
     ground behind them. So the ground has to be named here as well. */
  --schleier:rgba(18,16,12,.93); --schleier2:rgba(30,24,14,.97);
  --licht1:rgba(224,164,88,.16); --licht2:rgba(96,165,250,.08);
  --licht3:rgba(224,164,88,.09);
  --r:1rem;
  --oben:env(safe-area-inset-top,0px);
  --unten:env(safe-area-inset-bottom,0px);
  --kopf:3.5rem;
  --fuss:3.7rem;
  --schrift:100%;
}
/* ── Day mode ───────────────────────────────────────────────────────────────
   The day mode keeps the style of the night, only on paper. The night
   becomes PAPER — same
   brown, same gold, same three lights. Only the signals go darker: #34d399 on
   white is a colour nobody can read. */
html[data-hell]{
  color-scheme: light;
  --grund:#f5efe3;
  --karte:rgba(255,255,255,.75); --karte2:rgba(255,255,255,.93);
  --karte-voll:#fffdf8;
  --rand:rgba(61,44,22,.15); --rand2:rgba(61,44,22,.3);
  --text:#2b2015; --leise:#6e6353; --leiser:#8a7f6d;
  --akzent:#9a5a17;
  --ok:#0f7a4f; --info:#1a5fc8; --warnung:#95600a; --kritisch:#b42318;
  --film:rgba(61,44,22,.05); --film2:rgba(61,44,22,.10);
  --feld:#fffdf8; --griff:#8d8371;
  --schatten:rgba(61,44,22,.20);
  --gefahr:#b42318; --warnton:#8a5a06; --briefgrund:#fffdf8;
  --schleier:rgba(245,239,227,.93); --schleier2:rgba(250,245,236,.97);
  --licht1:rgba(224,164,88,.34); --licht2:rgba(96,165,250,.10);
  --licht3:rgba(224,164,88,.22);
}
/* 🔴 The browser's own `[hidden]{display:none}` is ONE selector — every class
   with a `display` beats it. `.wischhinweis{display:flex}` did, so the swipe
   hint carried `hidden`, remembered that it had been dismissed, and stood there
   anyway: the bookkeeping was right and only the cascade was wrong. Measured,
   not guessed — `getComputedStyle` said `flex` while `hidden` was set. This one
   line settles it for every element on the page (5.3.0). */
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;font-size:var(--schrift)}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{
  background:var(--grund); color:var(--text);
  font-family:ui-rounded,"SF Pro Rounded",system-ui,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
  /* 🔑 The same three lights as the watchman's page and the wide client, laid
     out for a narrow screen. One house, one ground. */
  background-image:
    radial-gradient(36rem 24rem at 10% -8%, var(--licht1), transparent 62%),
    radial-gradient(30rem 22rem at 100% 5%, var(--licht2), transparent 60%),
    radial-gradient(34rem 24rem at 50% 116%, var(--licht3), transparent 62%);
  background-attachment:fixed;
}
h1,h2,h3{margin:0;font-weight:600}
/* 🔴 16 px on every input. Below that iOS zooms into the field when it gets the
   focus and the layout is crooked afterwards — and nobody knows why. */
input,select,textarea,button{font:inherit;font-size:max(1rem,16px);color:var(--text)}
input,select,textarea{background:var(--feld);border:1px solid var(--rand);
  border-radius:.7rem;padding:.7rem .8rem;width:100%}
/* 🔴 `width:100%` is right for a text field and wrong for a BOX. A checkbox with
   it stretches across the whole row and pushes its own label to the far edge —
   that is what made the redirect card look broken, and it had been that way since
   the card was built. Two places had patched it with an inline style of their
   own; a rule that needs patching at the call site is a rule in the wrong place. */
input[type="checkbox"],input[type="radio"]{width:auto;flex:0 0 auto;margin:0;
  accent-color:var(--akzent-fuell);cursor:pointer}
input[type=range],input[type=checkbox]{accent-color:var(--akzent)}
input[type=range]{padding:0}
input:focus-visible,textarea:focus-visible,select:focus-visible,
button:focus-visible{outline:2px solid var(--akzent);outline-offset:1px}
button{background:var(--karte2);border:1px solid var(--rand);border-radius:.8rem;
  padding:.62rem .9rem;min-height:2.75rem;cursor:pointer}
button.haupt{background:var(--akzent-fuell);border-color:var(--akzent-fuell);
  color:var(--akzent-tief);font-weight:600}
button.blank{background:transparent;border-color:transparent;min-width:2.75rem;
  padding:.5rem}
button:disabled{opacity:.45}
.leise{color:var(--leise)} .klein{font-size:.84rem} .kleiner{font-size:.75rem}
.zahl{font-variant-numeric:tabular-nums}

/* ── One thing at a time ─────────────────────────────────────────── */
.blatt{position:fixed;inset:0;display:none;flex-direction:column;
  padding-top:var(--oben)}
body[data-blick="liste"] #b_liste,
body[data-blick="mail"] #b_mail,
body[data-blick="ordner"] #b_ordner,
body[data-blick="suche"] #b_suche,
body[data-blick="mehr"] #b_mehr,
body[data-blick="ziel"] #b_ziel,
body[data-blick="ordnertat"] #b_ordnertat,
body[data-blick="schreiben"] #b_schreiben{display:flex}
.kopf{flex:0 0 auto;height:var(--kopf);display:flex;align-items:center;gap:.4rem;
  padding:0 .35rem;border-bottom:1px solid var(--rand);
  background:var(--schleier);backdrop-filter:blur(12px)}
.kopf h1{flex:1 1 auto;font-size:1.05rem;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.kopf .u{font-size:.7rem;font-weight:700;color:var(--akzent-tief);
  background:var(--akzent-fuell);border-radius:99px;padding:.06rem .42rem}
.rumpf{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch}
.rumpf.gepolstert{padding:.7rem .8rem calc(1.2rem + var(--unten))}
.fuss{flex:0 0 auto;display:flex;border-top:1px solid var(--rand);
  background:var(--schleier);backdrop-filter:blur(12px);
  padding-bottom:var(--unten)}
.fuss button{flex:1 1 0;min-width:0;border:0;background:transparent;border-radius:0;
  display:flex;flex-direction:column;align-items:center;gap:.1rem;padding:.45rem 0 .5rem;
  color:var(--leiser);font-size:.66rem;min-height:var(--fuss)}
.fuss button i{font-style:normal;font-size:1.28rem;line-height:1.1}
.fuss button.an{color:var(--akzent)}
.fuss button .punkt{position:absolute;transform:translate(.85rem,-.15rem);
  width:.45rem;height:.45rem;border-radius:50%;background:var(--akzent)}

/* ── The list ────────────────────────────────────────────────────── */
.zeile{position:relative;overflow:hidden;border-bottom:1px solid var(--rand)}
/* 🔴 EVERY cell placed by hand. Left to automatic placement the date landed in
   the middle column and the sender was pushed off the right edge — visible in the
   screenshot, invisible in the source. Three columns, three rows, no guessing. */
.z{display:grid;grid-template-columns:auto minmax(0,1fr) auto;
  grid-template-rows:auto auto auto;gap:.1rem .7rem;
  align-items:start;padding:.62rem .85rem .68rem;
  /* 🔴 OPAQUE. Behind the row lie the two swipe actions; with a translucent
     background the bin and the box shine through every unread mail. */
  background:var(--grund);min-height:4.4rem;position:relative;touch-action:pan-y}
.z.neu{background:linear-gradient(90deg,rgba(224,164,88,.09),rgba(0,0,0,0) 45%),
  var(--grund)}
.kreis{grid-column:1;grid-row:1/4;width:2.5rem;height:2.5rem;border-radius:50%;
  display:grid;place-items:center;font-size:.85rem;font-weight:700;
  color:var(--akzent-tief);
  align-self:center}
/* ── Choosing several ────────────────────────────────────────────
   🔑 The tick takes the avatar's PLACE, it does not stand next to it. A phone
   row has no room for a column that is empty six days a week, and a list that
   shifts sideways when you start choosing is a list you lose your place in. */
.z .haken{display:none}
body.wahlmodus .z .kreis{display:none}
body.wahlmodus .z .haken{grid-column:1;grid-row:1/4;width:2.5rem;height:2.5rem;
  border-radius:50%;display:grid;place-items:center;align-self:center;
  border:2px solid var(--rand2);color:var(--akzent-tief);font-size:1.05rem;font-weight:700;
  flex:0 0 auto}
body.wahlmodus .z.gewaehlt .haken{background:var(--akzent-fuell);
  border-color:var(--akzent-fuell)}
/* 🔴 OPAQUE, like every row — the comment two rules up says why, and I still
   wrote a translucent one: behind the row lie the swipe actions, and in the
   picture the bin shone through every chosen mail that had been read. Layered
   over the ground instead of mixed with what is behind it. */
.z.gewaehlt{background:linear-gradient(rgba(224,164,88,.16),rgba(224,164,88,.16)),
  var(--grund)}
.z.gewaehlt.neu{background:linear-gradient(90deg,rgba(224,164,88,.2),rgba(224,164,88,.12) 45%),
  var(--grund)}
/* The bar of the selection replaces the tab bar — same height, same place, so
   the thumb does not have to learn a second one. */
.wahlfuss{flex:0 0 auto;display:none;border-top:1px solid var(--rand);
  background:var(--schleier2);backdrop-filter:blur(12px);
  padding-bottom:var(--unten)}
body.wahlmodus .wahlfuss{display:flex}
body.wahlmodus .fuss{display:none}
.wahlfuss button{flex:1 1 0;min-width:0;border:0;background:transparent;border-radius:0;
  display:flex;flex-direction:column;align-items:center;gap:.1rem;
  padding:.45rem 0 .5rem;color:var(--text);font-size:.66rem;min-height:var(--fuss)}
.wahlfuss button:disabled{opacity:.35}
.wahlfuss button i{font-style:normal;font-size:1.28rem;line-height:1.1}
.wahlfuss button.gefahr{color:var(--gefahr)}
.z .von{grid-column:2;grid-row:1;font-size:.95rem;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.z.neu .von,.z.neu .bet{font-weight:700}
.z .bet{grid-column:2;grid-row:2;font-size:.88rem;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;opacity:.95}
.z .aus{grid-column:2;grid-row:3;font-size:.76rem;color:var(--leiser);min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.z .rand{grid-column:3;grid-row:1/4;display:flex;flex-direction:column;
  align-items:flex-end;gap:.3rem}
.z .wann{font-size:.72rem;color:var(--leise);white-space:nowrap}
.z .zeichen{display:flex;gap:.25rem;font-size:.76rem;align-items:center;color:var(--leise)}
.z .punkt{width:.55rem;height:.55rem;border-radius:50%;background:var(--akzent)}
.z .stern{color:var(--warnung)}
/* Behind the row lie the two actions a swipe reveals. */
.wischen{position:absolute;inset:0;display:flex;align-items:center;
  justify-content:space-between;padding:0 1.1rem;font-size:1.3rem}
.wischen .links{color:var(--ok)}
.wischen .rechts{color:var(--kritisch)}
.wischhinweis{display:flex;align-items:center;gap:.6rem;padding:.6rem .9rem;
  font-size:.8rem;color:var(--leise);background:var(--karte);
  border-bottom:1px solid var(--rand)}
.wischhinweis span{flex:1 1 auto}
.leerraum{display:grid;place-items:center;padding:4rem 1.5rem;text-align:center;
  color:var(--leiser);font-size:.9rem;line-height:1.6}
.leerraum .gross{font-size:2.8rem;opacity:.5;display:block;margin-bottom:.6rem}
.mehrknopf{padding:1rem .8rem calc(1.4rem + var(--unten));text-align:center}

/* ── Folders ─────────────────────────────────────────────────────── */
/* 🔑 The depth is measured from the shallowest OWN folder, not from the root —
   nearly all of them sit under INBOX, and counted absolutely the whole tree
   hangs one step in from the left with nothing in that step. And one branch per
   top-level folder, with air between them: a flat run of rows leaves the reader
   counting indents to see where one family ends. */
.o{display:flex;align-items:center;gap:.7rem;min-height:3.2rem;position:relative;
  border-bottom:1px solid var(--rand);
  padding:.85rem .95rem .85rem calc(.95rem + var(--tief, 0) * 1.1rem)}
.o.an{background:rgba(224,164,88,.14)}
.o.unter::before{content:"";position:absolute;top:0;bottom:0;width:1px;
  background:var(--rand);
  left:calc(.95rem + (var(--tief) - 1) * 1.1rem + .6rem)}
.ozweig + .ozweig{margin-top:.5rem}
.o.neuzeile{background:rgba(224,164,88,.09);border-bottom-color:rgba(224,164,88,.3)}
/* ── Folders that are alive ────────────────────────────────────────────────
   A folder icon answers to a finger: it ducks while being pressed. And a folder
   with unread mail BREATHES — slowly, so it reads as „there is something here",
   not as a flashing sign.
   🔴 Whoever has asked their phone for less motion gets none. */
/* 🔴 As a glyph „●" is the same size as ☰ and ☑︎ — only solid, so it sits in
   the header as a white lump beside three thin signs. What it means is the
   small dot the list puts on an unread mail, so it is drawn that size. The tap
   target stays the button. */
#siebknopf{font-size:.66em;line-height:1}
.o .ic{display:inline-block;transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
.o:active .ic{transform:scale(.88)}
.o.an .ic{transform:scale(1.12)}
@keyframes atmen{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
.o .ic.atmet{animation:atmen 3.4s ease-in-out infinite}
.o:active .ic.atmet{animation:none}
.o.gefahr .nm{color:var(--gefahr)}
@media (prefers-reduced-motion: reduce){
  .o .ic,.o .ic.atmet{transition:none;animation:none}
  .o:active .ic,.o.an .ic{transform:none}
}
.ofalt{flex:0 0 1.1rem;font-size:.8rem;color:var(--leise);text-align:center;
  transition:transform .15s ease;padding:.35rem 0}
.ofalt.zu{transform:rotate(-90deg)}
.o.neuzeile.an{background:rgba(224,164,88,.22)}
.o.neuzeile .nm{font-weight:600}
.o.eltern .nm{font-weight:600}
.o .ic{font-size:1.1rem;flex:0 0 1.4rem;text-align:center}
.o .nm{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;font-size:.95rem}
.ort{display:inline-flex;align-items:center;gap:.2rem;max-width:8rem;
  padding:.04rem .38rem;border-radius:99px;font-size:.68rem;
  border:1px solid var(--rand);background:var(--karte2);color:var(--leise);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:0 1 auto}
.o .n{font-size:.76rem;color:var(--leiser)}
.o .u{font-size:.7rem;font-weight:700;color:var(--akzent-tief);
  background:var(--akzent-fuell);border-radius:99px;padding:.08rem .45rem}
.gruppentitel{padding:1rem .95rem .3rem;font-size:.68rem;letter-spacing:.09em;
  text-transform:uppercase;color:var(--leiser)}

/* ── Reading ─────────────────────────────────────────────────────── */
.wer{display:flex;gap:.7rem;padding:.85rem .9rem .6rem;align-items:flex-start}
.wer .txt{min-width:0;flex:1 1 auto}
.wer b{display:block;font-size.95rem}
.wer .adr{font-size:.8rem;color:var(--leise);word-break:break-all}
.betreff{padding:0 .9rem .5rem;font-size:1.1rem;font-weight:600;line-height:1.35}
.bahn{display:flex;gap:.4rem;flex-wrap:wrap;padding:.2rem .9rem .5rem}
.chip{display:inline-flex;align-items:center;gap:.3rem;padding:.25rem .6rem;
  border-radius:999px;font-size:.76rem;border:1px solid var(--rand);
  background:var(--karte2);color:var(--leise);max-width:100%}
.chip.info{color:var(--info);border-color:#60a5fa55;background:#60a5fa1a}
.chip.tat{cursor:pointer}
.warnleiste{display:flex;gap:.55rem;align-items:center;flex-wrap:wrap;
  margin:.2rem .9rem .6rem;padding:.6rem .75rem;border-radius:.8rem;font-size:.84rem;
  border:1px solid #f8717155;background:#f871711a;color:var(--gefahr)}
.warnleiste.mild{border-color:#fbbf2455;background:#fbbf2414;color:var(--warnton)}
.warnleiste button{padding:.35rem .6rem;font-size:.8rem;min-height:2.2rem}
.anhangreihe{display:flex;gap:.45rem;flex-wrap:wrap;padding:0 .9rem .6rem}
.anh{display:inline-flex;align-items:center;gap:.4rem;padding:.45rem .6rem;
  border-radius:.7rem;border:1px solid var(--rand);background:var(--karte2);
  font-size:.82rem;max-width:100%;text-decoration:none;color:var(--text);
  min-height:2.6rem}
.anh .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.anh .gr{color:var(--leiser);font-size:.72rem;flex:0 0 auto}
#brief{width:100%;border:0;background:var(--briefgrund);display:block;min-height:12rem}
.tatleiste{flex:0 0 auto;display:flex;gap:.3rem;padding:.4rem .5rem;
  padding-bottom:calc(.4rem + var(--unten));border-top:1px solid var(--rand);
  background:var(--schleier);backdrop-filter:blur(12px)}
.tatleiste button{flex:1 1 0;min-width:0;background:transparent;border-color:transparent;
  font-size:1.15rem;padding:.5rem 0}
.tatleiste button.gefahr{color:var(--gefahr)}

/* ── Sheets: more, search, compose ───────────────────────────────── */
